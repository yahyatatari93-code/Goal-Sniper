        const BIG_TEAMS = ['ARS', 'MCI', 'LIV', 'MUN', 'CHE', 'TOT'];

        function getTeamName(code) {
    const team = TEAMS.find(t => t.code === code);
    if (!team) return code;
    
    if (currentLang === 'en') return team.nameEn;
    if (currentLang === 'tr') return team.nameTr;
    
    return team.name; // العربية كافتراضي
}
        
        function getTeamLogo(code) {
    const team = TEAMS.find(t => t.code === code);
    // إذا وجد الشعار يعيده، وإلا يعطي درعاً رمادياً شفافاً احتياطياً
    return team && team.logo ? team.logo : 'https://cdn-icons-png.flaticon.com/512/3247/3247492.png';
}
        
        const getMatchType = (h, a) => {
    const hB = BIG_TEAMS.includes(h), aB = BIG_TEAMS.includes(a);
    if (hB && aB) return { label: t('bigClash'), color: 'text-yellow-400' };
    if (!hB && !aB) return { label: t('balanced'), color: 'text-gray-400' };
    return { label: t('bigVsAmbitious'), color: 'text-blue-400' };
};

        async function syncData() {
    try {
        const res = await fetch(`${API_BASE_URL}/sync`);
        const json = await res.json();
        if (json.success) {
            users = json.data.users || [];
            
            matches = (json.data.matches || []).map(m => ({
                id: m.id,
                gw: m.gw,
                home: m.home,
                away: m.away,
                date: m.match_date || m.date,
                time: m.match_time || m.time,
                actualH: m.actual_h !== undefined ? m.actual_h : m.actualH,
                actualA: m.actual_a !== undefined ? m.actual_a : m.actualA
            }));
            
            predictions = json.data.predictions || {};
            miniLeagues = json.data.miniLeagues || [];
            
            // 👇 هذا هو السطر المنقذ الذي نسينا إضافته 👇
            sniperShots = json.data.sniperShots || []; 
        }
    } catch (e) { 
        console.warn("Sync failed:", e); 
        showCustomDialog("لا يمكن الاتصال بالسيرفر حالياً. حاول مجدداً.");
    }
}

        const calcPoints = (homeCode, awayCode, predH, predA, actualH = null, actualA = null, isCaptain = false, isTripleCaptain = false) => {
            if (predH === '' || predA === '' || predH === null || predA === null) return 0;
            const ph = Number(predH), pa = Number(predA);
            const homeIsBig = BIG_TEAMS.includes(homeCode), awayIsBig = BIG_TEAMS.includes(awayCode);
            let ah = actualH !== null ? Number(actualH) : ph;
            let aa = actualA !== null ? Number(actualA) : pa;

            const isExact = (ph === ah && pa === aa);
            const isOutcomeCorrect = (ph > pa && ah > aa) || (ph < pa && ah < aa) || (ph === pa && ah === aa);
            const isDraw = (ah === aa);
            const totalGoals = ah + aa;

            let pts = 0;
            if (isOutcomeCorrect || isExact) {
                if (!homeIsBig && !awayIsBig) {
                    if (isExact) pts = (totalGoals >= 5 || (ah === 0 && aa === 0)) ? 5 : (isDraw ? 3 : 3);
                    else if (isOutcomeCorrect) pts = 1;
                } else if (homeIsBig && awayIsBig) {
                    if (isDraw) pts = isExact ? 3 : 2;
                    else pts = isExact ? 5 : 3;
                } else {
                    const bigWon = (homeIsBig && ah > aa) || (awayIsBig && aa > ah);
                    const bigLost = (homeIsBig && ah < aa) || (awayIsBig && aa < ah);
                    if (isDraw) pts = isExact ? 4 : 3;
                    else if (bigWon) pts = isExact ? 3 : 1;
                    else if (bigLost) pts = isExact ? 6 : 4;
                }
            }

            if (isTripleCaptain) return pts * 3; 
            if (isCaptain) return pts * 2; 
            return pts;
        };

        function getGlobalStandings() {
    // 1. تحديد الجولة الحالية والسابقة في البداية لكي نستخدمها في الأوسمة المؤقتة
    const activeGw = typeof getCurrentActiveGw === 'function' ? getCurrentActiveGw() : 1;
    const prevGw = activeGw > 1 ? activeGw - 1 : 1;

    const allUsernames = new Set();
    Object.keys(predictions).forEach(u => allUsernames.add(u));
    users.forEach(u => allUsernames.add(u.username));

    const statsMap = {};
    allUsernames.forEach(username => { 
        statsMap[username] = { 
            username: username, totalPts: 0, predictedCount: 0, correctOutcomes: 0, playedMatches: 0,
            teamPoints: {}, exactsPerGw: {}, gwPoints: {}, badges: { sniper: false, giantSlayer: false, motw: false }
        }; 
    });

    matches.forEach(m => {
        const isPlayed = m.actualH !== null && m.actualA !== null;
        allUsernames.forEach(username => {
            const p = (predictions[username] || {})[m.id];
            const userStats = statsMap[username];
            if (userStats && p && p.home !== '' && p.away !== '' && p.home !== null && p.away !== null) {
                userStats.predictedCount++;
                if (isPlayed) {
                    userStats.playedMatches++;
                    const pts = calcPoints(m.home, m.away, p.home, p.away, m.actualH, m.actualA, p.isCaptain, p.isTripleCaptain);
                    userStats.totalPts += pts;
                    
                    const isOutcomeCorrect = (p.home > p.away && m.actualH > m.actualA) || (p.home < p.away && m.actualH < m.actualA) || (p.home === p.away && m.actualH === m.actualA);
                    if (isOutcomeCorrect) userStats.correctOutcomes++;

                    userStats.teamPoints[m.home] = (userStats.teamPoints[m.home] || 0) + pts;
                    userStats.teamPoints[m.away] = (userStats.teamPoints[m.away] || 0) + pts;
                    userStats.gwPoints[m.gw] = (userStats.gwPoints[m.gw] || 0) + pts;
                    
                    if (Number(p.home) === m.actualH && Number(p.away) === m.actualA) {
                        userStats.exactsPerGw[m.gw] = (userStats.exactsPerGw[m.gw] || 0) + 1;
                        // التعديل: تفعيل وسام القناص فقط إذا تحقق في الجولة السابقة
                        if (Number(m.gw) === prevGw && userStats.exactsPerGw[m.gw] >= 3) userStats.badges.sniper = true;
                    }

                    const homeIsBig = BIG_TEAMS.includes(m.home), awayIsBig = BIG_TEAMS.includes(m.away);
                    const bigLost = (homeIsBig && m.actualH < m.actualA) || (awayIsBig && m.actualA < m.actualH);
                    // التعديل: تفعيل وسام قاهر الكبار فقط إذا تحقق في الجولة السابقة
                    if (Number(m.gw) === prevGw && bigLost && isOutcomeCorrect) userStats.badges.giantSlayer = true;
                }
            }
        });
    });

    // 2. إضافة منطق عراف الأسبوع
    let highestGwPts = -1, motwUser = null;
    
    Object.values(statsMap).forEach(userStats => {
        const pts = userStats.gwPoints[prevGw] || 0;
        if (pts > highestGwPts && pts > 0) { highestGwPts = pts; motwUser = userStats.username; }
    });
    if (motwUser) statsMap[motwUser].badges.motw = true;

    Object.values(statsMap).forEach(userStats => {
        userStats.hitRate = userStats.playedMatches > 0 ? Math.round((userStats.correctOutcomes / userStats.playedMatches) * 100) : 0;
        let bestTeam = '-', maxTeamPts = -1;
        for (const [team, pts] of Object.entries(userStats.teamPoints)) {
            if (pts > maxTeamPts) { maxTeamPts = pts; bestTeam = getTeamName(team); }
        }
        userStats.favTeam = maxTeamPts > 0 ? bestTeam : '-';
    });

    return Object.values(statsMap).sort((a, b) => b.totalPts - a.totalPts);
}

        function getLeagueStandings(leagueCode, baseStats) {
    const activeGw = typeof getCurrentActiveGw === 'function' ? getCurrentActiveGw() : 1;
    const league = miniLeagues.find(l => l.code === leagueCode);
    if (!league) return null;

    // 1. استنساخ البيانات وعزلها عن الترتيب العام
    let leagueMembers = baseStats
        .filter(s => league.members.includes(s.username))
        .map(s => ({
            ...s,
            mlTotalPts: s.totalPts, // نقاط الدوري التي ستتأثر بالقنص
            mlGwPts: s.gwPoints[activeGw] || 0 // نقاط الجولة الحالية
        }));

    // 2. تحليل رصاصات القناص في هذا الدوري فقط
    const currentLeagueShots = (sniperShots || []).filter(shot => 
        (shot.league_code === leagueCode || shot.leagueCode === leagueCode)
    );

    const victimsLastGw = new Set(); // لتسجيل الحصانة
    const snipersThisGw = new Set(); // لتسجيل من استخدم الميزة هذه الجولة

    currentLeagueShots.forEach(shot => {
        // تطبيق الخصم من المجموع الكلي داخل الدوري فقط
        const victim = leagueMembers.find(m => m.username === shot.victim);
        if (victim) victim.mlTotalPts -= shot.points_deducted;

        // تسجيل الحصانة إذا تم قنصه في الجولة السابقة
        if (shot.gw === activeGw - 1) victimsLastGw.add(shot.victim);

        // تسجيل من أطلق النار في الجولة الحالية
        if (shot.gw === activeGw) snipersThisGw.add(shot.sniper);
    });

    // 3. إعادة ترتيب الأعضاء بناءً على نقاط الدوري (بعد الخصومات)
    leagueMembers.sort((a, b) => b.mlTotalPts - a.mlTotalPts);

    // 4. تحديد المتصدرين في الجولة الحالية (أعلى نقاط الجولة)
    let maxGwPts = -1;
    leagueMembers.forEach(m => {
        if (m.mlGwPts > maxGwPts) maxGwPts = m.mlGwPts;
    });

    // جلب أسماء المتصدرين بشرط أن تكون نقاطهم أكبر من صفر
    const topScorers = leagueMembers.filter(m => m.mlGwPts === maxGwPts && maxGwPts > 0).map(m => m.username);
    
    // تحديد قوة الرصاصة (4 للانفراد، 2 للتعادل)
    const sniperPenalty = topScorers.length > 1 ? 2 : 4; 

    return {
        members: leagueMembers,
        topScorers,
        sniperPenalty,
        victimsLastGw,
        snipersThisGw,
        activeGw
    };
}

        // 1. دالة تجميل التاريخ (تحوله إلى أرقام أنيقة وموحدة DD/MM/YYYY)
function formatMatchDate(dateStr) {
    if (!dateStr) return '';
    let str = String(dateStr);
    
    // تحويل أي شهر عربي إلى رقم في حال تم إدخاله بالخطأ
    const arabicMonths = {
        'يناير': '1', 'جانفي': '1', 'فبراير': '2', 'فيفري': '2', 'شباط': '2',
        'مارس': '3', 'آذار': '3', 'أبريل': '4', 'ابريل': '4', 'نيسان': '4',
        'مايو': '5', 'أيار': '5', 'ايار': '5', 'يونيو': '6', 'حزيران': '6',
        'يوليو': '7', 'تموز': '7', 'أغسطس': '8', 'اغسطس': '8', 'آب': '8',
        'سبتمبر': '9', 'أيلول': '9', 'ايلول': '9', 'أكتوبر': '10', 'اكتوبر': '10', 'تشرين الأول': '10',
        'نوفمبر': '11', 'تشرين الثاني': '11', 'ديسمبر': '12', 'كانون الأول': '12'
    };
    for (const [name, num] of Object.entries(arabicMonths)) {
        if (str.includes(name)) {
            str = str.replace(new RegExp(name, 'g'), num);
        }
    }
    
    // توحيد الفواصل
    str = str.replace(/[\s\.-]+/g, '/').replace(/\/+/g, '/');
    
    // تنسيق التاريخ ليظهر بشكل أرقام أنيقة (مثال: 16/08/2026)
    let parts = str.match(/\d+/g);
    if (parts && parts.length >= 2) {
        let d = parts[0].padStart(2, '0');
        let m = parts[1].padStart(2, '0');
        let y = parts[2] ? parts[2] : new Date().getFullYear();
        if (parts[0].length === 4) { // في حال كان النسق YYYY/MM/DD
            y = parts[0]; m = parts[1].padStart(2, '0'); d = parts[2].padStart(2, '0');
        }
        return `${d}/${m}/${y}`;
    }
    return str;
}

        // 2. دالة حساب الوقت (تدعم الآن نظام AM و PM بشكل مثالي)
function parseMatchDate(dateStr, timeStr) {
    try {
        let dStr = formatMatchDate(dateStr);
        let [time, period] = (timeStr || '').trim().split(/\s+/);
        let [hours, minutes] = (time || '0:0').split(':');
        hours = parseInt(hours, 10) || 0;
        minutes = parseInt(minutes, 10) || 0;
        
        // دعم اللغتين (ص/م) و (AM/PM)
        if (period) {
            period = period.toUpperCase();
            if ((period === 'م' || period === 'PM') && hours !== 12) hours += 12;
            if ((period === 'ص' || period === 'AM') && hours === 12) hours = 0;
        }
        
        let parts = dStr.match(/\d+/g);
        let y = new Date().getFullYear(), m = 0, d = 1;
        if (parts) {
            if (parts.length >= 3 && parts[0].length === 4) { 
                y = parseInt(parts[0]); m = parseInt(parts[1]) - 1; d = parseInt(parts[2]); 
            } else if (parts.length >= 2) { 
                d = parseInt(parts[0]); m = parseInt(parts[1]) - 1; if (parts[2]) y = parseInt(parts[2]); 
            }
        }
        return new Date(y, m, d, hours, minutes).getTime();
    } catch(e) { return 0; }
}

        // 3. دالة قفل المباراة (تم سد ثغرة القفل الخاطئ)
function isMatchLocked(match) {
    try {
        // التأكد 100% أن النتيجة مسجلة فعلاً وليست (فارغة أو غير معرفة)
        if (match.actualH !== undefined && match.actualH !== null && match.actualH !== '' && 
            match.actualA !== undefined && match.actualA !== null && match.actualA !== '') {
            return true; // المباراة انتهت ومسجلة لها نتيجة
        }
        
        const matchTimeMs = parseMatchDate(match.date, match.time);
        if (!matchTimeMs) return false;
        
        const now = new Date().getTime();
        return (matchTimeMs - now) <= 60 * 60 * 1000; // قفل قبل ساعة من بداية المباراة
    } catch(e) { return false; }
}

        function getCurrentActiveGw() {
            // يبحث عن أول جولة تحتوي على مباريات غير ملعوبة (actualH و actualA تساوي null)
            for (let gw = 1; gw <= 38; gw++) {
                const gwMatches = matches.filter(m => Number(m.gw) === gw);
                if (gwMatches.length === 0) continue;
                if (!gwMatches.every(m => m.actualH !== null && m.actualA !== null)) return gw;
            }
            return 1;
        }

                                ${gwMatches.map(match => {
                                    const pred = userPreds[match.id] || { home: '', away: '', isCaptain: false, isTripleCaptain: false };
                                    const isPredicted = pred.home !== '' && pred.away !== '' && pred.home !== null && pred.away !== null;
                                    const isLocked = isMatchLocked(match);
                                    
                                    // حماية ذكية: إذا لم تكن دالة الوقت موجودة، يعرض الوقت القديم دون أن يتعطل
                                    const displayDate = formatMatchDate(match.date);
                                    const displayTime = typeof formatDisplayTime === 'function' ? formatDisplayTime(match.time) : match.time;
                                    
                                    let bMini = '';
                                    if(pred.isTripleCaptain) bMini = `<div class="absolute top-2 ${isAr ? 'left-2' : 'right-2'} bg-fuchsia-600 text-white w-4 h-4 rounded-full flex items-center justify-center font-black text-[8px]"><i class="fa-solid fa-bolt"></i></div>`;
                                    else if(pred.isCaptain) bMini = `<div class="absolute top-2 ${isAr ? 'left-2' : 'right-2'} bg-amber-500 text-black w-4 h-4 rounded-full flex items-center justify-center font-black text-[8px]">C</div>`;

                                    const lockedText = typeof t === 'function' ? t('locked') : 'مقفلة';
                                    const predictText = typeof t === 'function' ? t('predictNow') : 'توقع الآن';

                                    return `
                                        <div class="bg-slate-900/60 p-3 rounded-xl flex flex-col gap-2 border border-white/5 relative ${isLocked ? 'opacity-70' : ''}">
                                            ${bMini}
                                            <div class="text-[10px] text-center text-slate-400 border-b border-white/5 pb-1">
                                                <i class="far fa-${isLocked ? 'lock' : 'calendar-alt'} text-blue-400"></i> ${isLocked ? lockedText : `${displayDate} - ${displayTime}`}
                                            </div>
                                            <div class="flex items-center justify-between mt-1">
                                                
                                                <div class="flex-1 flex justify-start items-center gap-2">
                                                    <img src="${getTeamLogo(match.home)}" class="w-6 h-6 md:w-7 md:h-7 object-contain drop-shadow-md shrink-0" loading="lazy" alt="logo" />
                                                    <div class="${isAr ? 'text-left' : 'text-right'} font-bold text-[11px] md:text-xs text-slate-200 whitespace-normal leading-tight">${getTeamName(match.home)}</div>
                                                </div>
                                                
                                                <div class="px-2 shrink-0">
                                                    <button ${isLocked ? 'disabled' : `onclick="openModal('${match.id}')"`} class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${isPredicted ? 'bg-blue-600/20 text-blue-300 border border-blue-500/30' : 'bg-slate-800 text-slate-300 hover:bg-blue-600 hover:text-white'} ${isLocked ? 'opacity-50 cursor-not-allowed' : ''}">
                                                        ${isPredicted ? `${pred.home} - ${pred.away}` : (isLocked ? '<i class="fa-solid fa-lock"></i>' : predictText)}
                                                    </button>
                                                </div>
                                                
                                                <div class="flex-1 flex justify-end items-center gap-2 flex-row-reverse">
                                                    <img src="${getTeamLogo(match.away)}" class="w-6 h-6 md:w-7 md:h-7 object-contain drop-shadow-md shrink-0" loading="lazy" alt="logo" />
                                                    <div class="${isAr ? 'text-right' : 'text-left'} font-bold text-[11px] md:text-xs text-slate-200 whitespace-normal leading-tight">${getTeamName(match.away)}</div>
                                                </div>

                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    } catch (e) {
        console.error("Error in matches tab:", e);
        return `<div class="text-center text-rose-400 mt-10">حدث خطأ بسيط في عرض المباريات.. ولكن التطبيق لم يتعطل! 🚀</div>`;
    }
}

        amber: 'bg-amber-500/20 text-amber-400 border-amber-500/30',

        gray: 'bg-slate-700/30 text-slate-400 border-slate-600/30'

    return `

}

        function updateModalCalc() {
            const h = document.getElementById('modal-pred-h').value, a = document.getElementById('modal-pred-a').value;
            const p = document.querySelector('input[name="powerup"]:checked')?.value || 'none';
            // نحسب النقاط بافتراض أن النتيجة الفعلية جاءت مطابقة تماماً (h, a, h, a)
            let possiblePts = calcPoints(activeMatchModal.home, activeMatchModal.away, h, a, h, a, p==='captain', p==='triple');
            if (h === '' || a === '') possiblePts = 0;
            document.getElementById('modal-pts-display').innerText = possiblePts + ' نقطة';
        }

        async function saveModalPrediction() {
            const h = document.getElementById('modal-pred-h').value, a = document.getElementById('modal-pred-a').value;
            const powerup = document.querySelector('input[name="powerup"]:checked')?.value || 'none';
            if (h === '' || a === '') return;
            
            // تحديث شكلي سريع لراحة المستخدم
            if (!predictions[currentUser.username]) predictions[currentUser.username] = {};
            predictions[currentUser.username][activeMatchModal.id] = { 
                home: Number(h), 
                away: Number(a), 
                isCaptain: powerup === 'captain', 
                isTripleCaptain: powerup === 'triple'
            };
            
            const reqMatchId = activeMatchModal.id;
            closeModal();
            render(); // إعادة رسم الشاشة لتظهر الأرقام

            // الحفظ الفعلي في السيرفر
            try {
                await fetch(`${API_BASE_URL}/predict`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: currentUser.username, 
                        matchId: reqMatchId, 
                        predH: h, 
                        predA: a, 
                        isCaptain: powerup === 'captain', 
                        isTripleCaptain: powerup === 'triple'
                    })
                });
                await syncData(); // جلب البيانات لتأكيد الحفظ
            } catch(e) {
                console.error("Predict error:", e);
                showCustomDialog("حدث خطأ أثناء الحفظ بالسيرفر. يرجى التأكد من اتصال الإنترنت.");
            }
        }

        async function createMiniLeague() {
            const name = document.getElementById('new-ml-name').value.trim();
            if (!name) { showCustomDialog('يرجى كتابة اسم الدوري أولاً.'); return; }
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            try {
                const res = await fetch(`${API_BASE_URL}/leagues`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: 'ml_' + Date.now(), name, code, creator: currentUser.username })
                });
                const data = await res.json();
                if(data.success) {
                    showCustomDialog('تم إنشاء الدوري بنجاح! كود الدعوة: ' + code);
                    await syncData();
                    render();
                } else { showCustomDialog(data.message); }
            } catch(e) { showCustomDialog("تعذر الاتصال بالسيرفر"); }
        }

        async function joinMiniLeague() {
            const code = document.getElementById('join-ml-code').value.trim().toUpperCase();
            if(!code) { showCustomDialog('يرجى إدخال كود الدوري.'); return; }
            try {
                const res = await fetch(`${API_BASE_URL}/leagues/join`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ code, username: currentUser.username })
                });
                const data = await res.json();
                showCustomDialog(data.message || (data.success ? 'تم الانضمام للدوري بنجاح!' : 'خطأ غير معروف'));
                if (data.success) { await syncData(); render(); }
            } catch(e) { showCustomDialog("تعذر الاتصال بالسيرفر"); }
        }

        async function addMatch(e) {
            e.preventDefault();
            const gw = document.getElementById('adm-gw').value, home = document.getElementById('adm-home').value;
            const away = document.getElementById('adm-away').value, dateInput = document.getElementById('adm-date').value;
            const timeInput = document.getElementById('adm-time').value;
            if(!gw || !home || !away || !dateInput || !timeInput) return;

            const formattedDate = dateInput.replace(/-/g, '/');
            let [hours, minutes] = timeInput.split(':'); hours = parseInt(hours, 10);
            let period = hours >= 12 ? 'م' : 'ص'; hours = hours % 12 || 12;
            const formattedTime = `${hours}:${minutes} ${period}`;
            
            try {
                await fetch(`${API_BASE_URL}/admin/match`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id: 'm_custom_' + Date.now(), gw: Number(gw), home, away, date: formattedDate, time: formattedTime})
                });
                showCustomDialog(`تمت إضافة المباراة بنجاح!`);
                await syncData(); render();
            } catch(e) {}
        }

                try {
                    await fetch(`${API_BASE_URL}/admin/match/${id}`, { method: 'DELETE' });
                    await syncData(); render();
                } catch(e){}
            });
        }

        async function deleteUserByAdmin() {
    const username = document.getElementById('admin-delete-username').value;
    const adminPass = document.getElementById('admin-pass-1').value;

    if (!username || !adminPass) return alert('يرجى ملء جميع الحقول!');
    if (!confirm(`هل أنت متأكد 100% أنك تريد مسح اللاعب ${username}؟`)) return;

    try {
        // نجهز الرابط ليتطابق مع ما هو مكتوب في ملف السيرفر تماماً
        const baseUrl = API_BASE_URL.replace('/api', '');
        let url = `${baseUrl}/admin/delete-user`;

        let response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminPassword: adminPass, targetUsername: username })
        });

        // إذا كان المسار يعطي 404 (غير موجود)، نجرب المسار الآخر احتياطياً
        if (response.status === 404) {
            url = `${API_BASE_URL}/admin/delete-user`;
            response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminPassword: adminPass, targetUsername: username })
            });
        }

        const result = await response.json();
        alert(result.message || 'تمت العملية');
        
        if (result.success) {
            document.getElementById('admin-delete-username').value = '';
            document.getElementById('admin-pass-1').value = '';
        }
    } catch (error) {
        alert('فشل الاتصال بالمسار الصحيح: ' + error.message);
    }
}

        async function handleAuth(e) {
            e.preventDefault();
            const name = document.getElementById('auth-name').value.trim();
            const pin = document.getElementById('auth-pin').value.trim();
            
            if (authMode === 'register') {
                const pinConfirm = document.getElementById('auth-pin-confirm').value.trim();
                if (pin !== pinConfirm) {
                    showCustomDialog('كلمات المرور غير متطابقة!');
                    return;
                }
            }

            if (!name || pin.length < 4) {
                showCustomDialog('يرجى إدخال اسم المستخدم وكلمة مرور لا تقل عن 4 أرقام أو حروف.');
                return;
            }

            try {
                // إظهار شاشة تحميل مؤقتة
                document.getElementById('app').innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-screen text-slate-400 gap-4">
                        <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-500"></i>
                        <span class="font-bold text-lg text-white">جاري الاتصال بالسيرفر...</span>
                    </div>`;

                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: name, pin: pin })
                });
                
                const data = await response.json();

                if (data.success) {
                    currentUser = data.user;
                    localStorage.setItem('oracle_current_user_v8', JSON.stringify(currentUser));
                    
                    document.getElementById('app').innerHTML = `
                        <div class="flex flex-col items-center justify-center min-h-screen text-slate-400 gap-4">

                            <span class="font-bold text-sm">جاري مزامنة جدول المباريات الرسمي...</span>

                    await syncData(); 
                    render();    
                } else {
                    showCustomDialog(data.message || 'خطأ في الدخول.');
                    render(); // العودة لشاشة الدخول
                }

                console.error("Auth Error:", error);
                showCustomDialog('تعذر الاتصال بالسيرفر. تأكد من اتصال الإنترنت لديك.');
                render();
            }
        }

        window.onload = async function() {

        async function fireSniper(leagueCode, victimName, penaltyPoints, gw) {
    const confirmShot = confirm(`🎯 تأكيد القنص:\nهل أنت متأكد أنك تريد قنص [ ${victimName} ] وخصم ${penaltyPoints} نقاط منه؟\n\nتذكر: الميزة تستخدم مرة واحدة فقط في الجولة!`);
    
    if (!confirmShot) return;

    try {
        const res = await fetch(`${API_BASE_URL}/sniper/shoot`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                leagueCode: leagueCode,
                gw: gw,
                sniper: currentUser.username,
                victim: victimName,
                pointsDeducted: penaltyPoints
            })
        });
       
        const json = await res.json();
        if (json.success) {
            alert(`🔥 تمت العملية بنجاح!\nتم إرسال رصاصة القناص نحو ${victimName}.`);
            if(typeof syncData === 'function') syncData(); 
        } else {
            alert(json.message || "⚠️ فشلت عملية القنص، ربما استخدمته مسبقاً!");
        }
    } catch (e) {
        alert("❌ لا يمكن الاتصال بالسيرفر حالياً. جرب لاحقاً.");
    }
}
    </script>
