<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goal Sniper</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        deep: '#060b19', card: '#0f172a', primary: '#0ea5e9',
                        crimson: '#e11d48', gold: '#fbbf24', accent: '#8b5cf6'
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #060b19;
            color: #f8fafc;
            background-image: 
                radial-gradient(circle at 10% 0%, rgba(14, 165, 233, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 100%, rgba(139, 92, 246, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 60%);
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
        }
        .glass {
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(14px);
            border: 1px solid rgba(14, 165, 233, 0.15); border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .score-input {
            width: 48px; height: 48px; text-align: center; font-size: 1.2rem; font-weight: bold;
            background: rgba(6, 11, 25, 0.8); border: 1px solid rgba(14, 165, 233, 0.3); color: white;
            border-radius: 12px; outline: none; transition: all 0.3s;
        }
        .score-input:focus { border-color: #0ea5e9; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); background: rgba(15, 23, 42, 1); }
        .bottom-nav-pb { padding-bottom: calc(95px + env(safe-area-inset-bottom)); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.35s ease forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col bottom-nav-pb">

    <div id="app" class="flex-1 flex flex-col">
        <div class="flex flex-col items-center justify-center min-h-screen text-slate-400 gap-4">
            <i class="fa-solid fa-crosshairs fa-spin text-4xl text-blue-500"></i>
            <span class="font-bold text-lg text-white">Goal Sniper</span>
            <span class="font-bold text-sm">جاري جلب المباريات من السيرفر...</span>
        </div>
    </div>

    <div id="modal-container"></div>
    <div id="dialog-container"></div>

    <script>
        // رابط السيرفر الخاص بك
        const API_BASE_URL = 'https://5.189.138.161.nip.io/api';

        const TEAMS = [
            { code: 'ARS', name: 'آرسنال' }, { code: 'MCI', name: 'مانشستر سيتي' },
            { code: 'LIV', name: 'ليفربول' }, { code: 'MUN', name: 'مانشستر يونايتد' },
            { code: 'CHE', name: 'تشيلسي' }, { code: 'TOT', name: 'توتنهام' },
            { code: 'NEW', name: 'نيوكاسل يونايتد' }, { code: 'AVL', name: 'أستون فيلا' },
            { code: 'BHA', name: 'برايتون' }, { code: 'COV', name: 'كوفنتري سيتي' },
            { code: 'HUL', name: 'هال سيتي' }, { code: 'NFO', name: 'نوتينغهام فورست' },
            { code: 'LEE', name: 'ليدز يونايتد' }, { code: 'IPS', name: 'إيبسويتش تاون' },
            { code: 'SUN', name: 'سندرلاند' }, { code: 'CRY', name: 'كريستال بالاس' },
            { code: 'BRE', name: 'برينتفورد' }, { code: 'FUL', name: 'فولهام' },
            { code: 'BOU', name: 'بورنموث' }, { code: 'EVE', name: 'إيفرتون' }
        ];
        const BIG_TEAMS = ['ARS', 'MCI', 'LIV', 'MUN', 'CHE', 'TOT'];

        const getTeamName = (code) => TEAMS.find(t => t.code === code)?.name || code;
        
        const getMatchType = (h, a) => {
            const hB = BIG_TEAMS.includes(h), aB = BIG_TEAMS.includes(a);
            if (hB && aB) return { label: '👑 قمة الكبار', color: 'text-yellow-400' };
            if (!hB && !aB) return { label: '⚽ مباراة متكافئة', color: 'text-gray-400' };
            return { label: '🌟 الكبار ضد الطموحين', color: 'text-blue-400' };
        };

        let users = [], currentUser = null, matches = [], predictions = {}, miniLeagues = [];
        let currentTab = 'home', authMode = 'login', activeMatchModal = null;

        async function syncData() {
            try {
                const res = await fetch(`${API_BASE_URL}/sync`);
                const json = await res.json();
                if (json.success) {
                    users = json.data.users || [];
                    
                    // إصلاح مشكلة قفل المباريات: مطابقة أسماء الأعمدة القادمة من قاعدة البيانات
                    matches = (json.data.matches || []).map(m => ({
                        id: m.id,
                        gw: m.gw,
                        home: m.home,
                        away: m.away,
                        date: m.match_date || m.date,
                        time: m.match_time || m.time,
                        actualH: m.actual_h !== undefined ? m.actual_h : m.actualH,
                        actualA: m.actual_a !== undefined ? m.actual_a : m.actualA
                    }));
                    
                    predictions = json.data.predictions || {};
                    miniLeagues = json.data.miniLeagues || [];
                }
            } catch (e) { 
                console.warn("Sync failed:", e); 
                showCustomDialog("لا يمكن الاتصال بالسيرفر حالياً. حاول مجدداً.");
            }
        }

        const calcPoints = (homeCode, awayCode, predH, predA, actualH = null, actualA = null, isCaptain = false, isTripleCaptain = false, isShield = false) => {
            if (predH === '' || predA === '' || predH === null || predA === null) return 0;
            const ph = Number(predH), pa = Number(predA);
            const homeIsBig = BIG_TEAMS.includes(homeCode), awayIsBig = BIG_TEAMS.includes(awayCode);
            let ah = actualH !== null ? Number(actualH) : ph;
            let aa = actualA !== null ? Number(actualA) : pa;

            const isExact = (ph === ah && pa === aa);
            const isOutcomeCorrect = (ph > pa && ah > aa) || (ph < pa && ah < aa) || (ph === pa && ah === aa);
            const isDraw = (ah === aa);
            const totalGoals = ah + aa;

            let pts = 0;
            if (isOutcomeCorrect || isExact) {
                if (!homeIsBig && !awayIsBig) {
                    if (isExact) pts = (totalGoals >= 5 || (ah === 0 && aa === 0)) ? 4 : 3;
                    else if (isOutcomeCorrect) pts = 1;
                } else if (homeIsBig && awayIsBig) {
                    if (isDraw) pts = isExact ? 3 : 2;
                    else pts = isExact ? 5 : 3;
                } else {
                    const bigWon = (homeIsBig && ah > aa) || (awayIsBig && aa > ah);
                    const bigLost = (homeIsBig && ah < aa) || (awayIsBig && aa < ah);
                    if (isDraw) pts = isExact ? 3 : 2;
                    else if (bigWon) pts = isExact ? 2 : 1;
                    else if (bigLost) pts = isExact ? 6 : 4;
                }
            }

            if (pts === 0 && isShield) return 1;
            if (isTripleCaptain) return pts * 3; 
            if (isCaptain) return pts * 2; 
            return pts;
        };

        function getGlobalStandings() {
            const statsMap = {};
            users.forEach(u => { 
                statsMap[u.username] = { 
                    username: u.username, totalPts: 0, predictedCount: 0, correctOutcomes: 0, playedMatches: 0,
                    teamPoints: {}, exactsPerGw: {}, gwPoints: {}, badges: { sniper: false, giantSlayer: false, motw: false }
                }; 
            });

            matches.forEach(m => {
                const isPlayed = m.actualH !== null && m.actualA !== null;
                users.forEach(u => {
                    const p = (predictions[u.username] || {})[m.id];
                    const userStats = statsMap[u.username];
                    if (userStats && p && p.home !== '' && p.away !== '') {
                        userStats.predictedCount++;
                        if (isPlayed) {
                            userStats.playedMatches++;
                            const pts = calcPoints(m.home, m.away, p.home, p.away, m.actualH, m.actualA, p.isCaptain, p.isTripleCaptain, p.isShield);
                            userStats.totalPts += pts;
                            
                            const isOutcomeCorrect = (p.home > p.away && m.actualH > m.actualA) || (p.home < p.away && m.actualH < m.actualA) || (p.home === p.away && m.actualH === m.actualA);
                            if (isOutcomeCorrect) userStats.correctOutcomes++;

                            userStats.teamPoints[m.home] = (userStats.teamPoints[m.home] || 0) + pts;
                            userStats.teamPoints[m.away] = (userStats.teamPoints[m.away] || 0) + pts;
                            userStats.gwPoints[m.gw] = (userStats.gwPoints[m.gw] || 0) + pts;
                            
                            if (Number(p.home) === m.actualH && Number(p.away) === m.actualA) {
                                userStats.exactsPerGw[m.gw] = (userStats.exactsPerGw[m.gw] || 0) + 1;
                                if (userStats.exactsPerGw[m.gw] >= 3) userStats.badges.sniper = true;
                            }

                            const homeIsBig = BIG_TEAMS.includes(m.home), awayIsBig = BIG_TEAMS.includes(m.away);
                            const bigLost = (homeIsBig && m.actualH < m.actualA) || (awayIsBig && m.actualA < m.actualH);
                            if (bigLost && isOutcomeCorrect) userStats.badges.giantSlayer = true;
                        }
                    }
                });
            });

            const activeGw = getCurrentActiveGw();
            const prevGw = activeGw > 1 ? activeGw - 1 : 1;
            let highestGwPts = -1, motwUser = null;
            
            Object.values(statsMap).forEach(userStats => {
                const pts = userStats.gwPoints[prevGw] || 0;
                if (pts > highestGwPts && pts > 0) { highestGwPts = pts; motwUser = userStats.username; }
            });
            if (motwUser) statsMap[motwUser].badges.motw = true;

            Object.values(statsMap).forEach(userStats => {
                userStats.hitRate = userStats.playedMatches > 0 ? Math.round((userStats.correctOutcomes / userStats.playedMatches) * 100) : 0;
                let bestTeam = '-', maxTeamPts = -1;
                for (const [team, pts] of Object.entries(userStats.teamPoints)) {
                    if (pts > maxTeamPts) { maxTeamPts = pts; bestTeam = getTeamName(team); }
                }
                userStats.favTeam = maxTeamPts > 0 ? bestTeam : '-';
            });

            return Object.values(statsMap).sort((a, b) => b.totalPts - a.totalPts);
        }

        function isMatchLocked(match) {
            try {
                if (match.actualH !== null && match.actualA !== null) return true;
                const [year, month, day] = match.date.split('/');
                let [timeStr, period] = match.time.split(' ');
                let [hours, minutes] = timeStr.split(':');
                hours = parseInt(hours, 10);
                if (period === 'م' && hours !== 12) hours += 12;
                if (period === 'ص' && hours === 12) hours = 0;
                
                const matchDate = new Date(year, month - 1, day, hours, minutes);
                const now = new Date();
                return (matchDate - now) <= 60 * 60 * 1000;
            } catch(e) { return false; }
        }

        function getCurrentActiveGw() {
            for (let gw = 1; gw <= 38; gw++) {
                const gwMatches = matches.filter(m => Number(m.gw) === gw);
                if (gwMatches.length === 0) continue;
                if (!gwMatches.every(m => m.actualH !== null && m.actualA !== null)) return gw;
            }
            return 1;
        }

        function renderHomeTab() {
            const activeGw = getCurrentActiveGw();
            const prevGw = activeGw > 1 ? activeGw - 1 : null;
            const gwMatches = matches.filter(m => Number(m.gw) === activeGw);
            const userPreds = predictions[currentUser.username] || {};
            
            const standings = getGlobalStandings();
            const myStats = standings.find(u => u.username === currentUser.username) || { totalPts: 0, hitRate: 0, favTeam: '-', badges: {} };
            const myRank = standings.findIndex(u => u.username === currentUser.username) + 1 || '-';
            const motw = prevGw ? standings.find(u => u.badges.motw) : null;

            return `
                <div class="space-y-6">
                    ${motw ? `
                        <div class="glass p-4 rounded-3xl bg-gradient-to-r from-amber-500/20 to-amber-700/20 border border-amber-500/30 flex items-center justify-between shadow-[0_0_15px_rgba(245,158,11,0.2)]">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 bg-amber-500 rounded-full flex items-center justify-center text-xl shadow-lg shadow-amber-500/40">👑</div>
                                <div>
                                    <h3 class="text-xs font-bold text-amber-500">عراف الأسبوع (الجولة ${prevGw})</h3>
                                    <span class="text-base font-black text-white">${motw.username}</span>
                                </div>
                            </div>
                            <div class="text-center">
                                <span class="block text-2xl font-black text-amber-400">${motw.gwPoints[prevGw]}</span>
                                <span class="text-[10px] text-slate-300">نقطة</span>
                            </div>
                        </div>
                    ` : ''}

                    <div class="glass p-5 md:p-6 rounded-3xl relative overflow-hidden border border-blue-500/20 shadow-xl bg-gradient-to-br from-indigo-950/60 via-[#131b2e] to-blue-950/50">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <span class="text-xs font-bold text-blue-400 bg-blue-600/20 px-3 py-1 rounded-full border border-blue-500/30">بطاقة القناص الشخصية</span>
                                <h2 class="text-xl md:text-2xl font-black mt-2 text-white flex items-center gap-2">
                                    ${currentUser.username}
                                    ${myStats.badges.motw ? '<span title="عراف الأسبوع" class="text-amber-400 text-lg"><i class="fa-solid fa-fire"></i></span>' : ''}
                                    ${myStats.badges.sniper ? '<span title="القناص" class="text-emerald-400 text-lg"><i class="fa-solid fa-crosshairs"></i></span>' : ''}
                                    ${myStats.badges.giantSlayer ? '<span title="قاهر الكبار" class="text-rose-400 text-lg"><i class="fa-solid fa-shield-halved"></i></span>' : ''}
                                </h2>
                            </div>
                            <div class="text-left">
                                <span class="text-[10px] text-slate-400 block">الترتيب العام</span>
                                <span class="text-lg md:text-xl font-black text-amber-400">#${myRank}</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center mb-3">
                            <div class="bg-slate-900/60 p-3 rounded-2xl border border-white/5">
                                <span class="text-[10px] text-slate-400 block mb-1">المجموع الكلي</span>
                                <span class="text-lg font-black text-amber-400">${myStats.totalPts}</span>
                            </div>
                            <div class="bg-slate-900/60 p-3 rounded-2xl border border-white/5">
                                <span class="text-[10px] text-slate-400 block mb-1">معدل الدقة</span>
                                <span class="text-lg font-black text-emerald-400">${myStats.hitRate}%</span>
                            </div>
                            <div class="bg-slate-900/60 p-3 rounded-2xl border border-white/5 col-span-2">
                                <span class="text-[10px] text-slate-400 block mb-1">الفريق المفضل للتوقع</span>
                                <span class="text-base font-black text-blue-300 truncate block">${myStats.favTeam}</span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-base md:text-lg flex items-center gap-2">
                                <i class="fa-solid fa-fire text-amber-400"></i> مباريات الجولة الحالية (${activeGw})
                            </h3>
                            <button onclick="switchTab('matches')" class="text-xs text-blue-400 hover:underline font-semibold">
                                عرض كل الجولات <i class="fa-solid fa-arrow-left mr-1"></i>
                            </button>
                        </div>
                        <div class="space-y-3">
                            ${gwMatches.map(match => {
                                const pred = userPreds[match.id] || { home: '', away: '', isCaptain: false, isTripleCaptain: false, isShield: false };
                                const matchType = getMatchType(match.home, match.away);
                                const isPredicted = pred.home !== '' && pred.away !== '' && pred.home !== null && pred.away !== null;
                                const isLocked = isMatchLocked(match);
                                
                                let badgeHtml = '';
                                if (pred.isTripleCaptain) badgeHtml = `<div class="absolute top-3 left-3 bg-fuchsia-600 text-white px-2 py-0.5 rounded-lg flex items-center gap-1 font-black text-[10px]"><i class="fa-solid fa-bolt"></i> الجوكر x3</div>`;
                                else if (pred.isShield) badgeHtml = `<div class="absolute top-3 left-3 bg-sky-500 text-white w-6 h-6 rounded-full flex items-center justify-center font-black text-[10px]"><i class="fa-solid fa-shield"></i></div>`;
                                else if (pred.isCaptain) badgeHtml = `<div class="absolute top-3 left-3 bg-amber-500 text-black w-6 h-6 rounded-full flex items-center justify-center font-black text-xs">C</div>`;

                                return `
                                    <div class="glass p-4 rounded-2xl flex flex-col gap-3 shadow-md relative ${isLocked ? 'opacity-80' : ''}">
                                        ${badgeHtml}
                                        <div class="flex justify-between items-center text-xs text-slate-400 border-b border-white/5 pb-2">
                                            <span class="font-bold ${matchType.color}">${matchType.label}</span>
                                            <span class="${isLocked ? 'text-rose-400' : ''}"><i class="far fa-${isLocked ? 'lock' : 'calendar-alt'} ml-1"></i> ${isLocked ? 'مقفلة' : `${match.date} - ${match.time}`}</span>
                                        </div>
                                        <div class="flex items-center justify-between">
                                            <div class="flex-1 text-left font-bold text-sm md:text-base text-slate-200">${getTeamName(match.home)}</div>
                                            <div class="px-3">
                                                <button ${isLocked ? 'disabled' : `onclick="openModal('${match.id}')"`} class="px-4 py-2 ${isPredicted ? 'bg-blue-600/20 border border-blue-500/40 text-blue-300' : 'bg-blue-600 text-white shadow-lg shadow-blue-600/30'} ${isLocked ? 'opacity-50 cursor-not-allowed bg-slate-800' : ''} font-bold text-xs rounded-xl transition-all">
                                                    ${isPredicted ? `${pred.home} - ${pred.away}` : (isLocked ? '<i class="fa-solid fa-lock"></i> انتهى الوقت' : 'أضف توقعك')}
                                                </button>
                                            </div>
                                            <div class="flex-1 text-right font-bold text-sm md:text-base text-slate-200">${getTeamName(match.away)}</div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                            ${gwMatches.length === 0 ? '<div class="text-center text-slate-400 text-sm py-8">لا توجد مباريات متاحة الآن.</div>' : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMatchesTab() {
            const userPreds = predictions[currentUser.username] || {};
            return `
                <div class="space-y-6">
                    <div class="glass p-4 rounded-2xl">
                        <h2 class="text-lg font-bold mb-1 flex items-center gap-2"><i class="fa-solid fa-calendar-days text-blue-400"></i> جدول مباريات الدوري الرسمي</h2>
                    </div>
                    ${Array.from({ length: 38 }, (_, i) => i + 1).map(gw => {
                        const gwMatches = matches.filter(m => Number(m.gw) === gw);
                        if (gwMatches.length === 0) return '';
                        return `
                            <div class="glass p-4 rounded-2xl space-y-3">
                                <div class="border-b border-white/10 pb-2 flex justify-between items-center">
                                    <h3 class="font-black text-sm text-blue-400">الجولة ${gw}</h3>
                                    <span class="text-xs text-slate-400">${gwMatches.length} مواجهات</span>
                                </div>
                                <div class="space-y-2">
                                    ${gwMatches.map(match => {
                                        const pred = userPreds[match.id] || { home: '', away: '', isCaptain: false, isTripleCaptain: false, isShield: false };
                                        const isPredicted = pred.home !== '' && pred.away !== '' && pred.home !== null && pred.away !== null;
                                        const isLocked = isMatchLocked(match);
                                        
                                        let bMini = '';
                                        if(pred.isTripleCaptain) bMini = `<div class="absolute -top-1 -left-1 bg-fuchsia-600 text-white w-5 h-5 rounded-full flex items-center justify-center font-black text-[10px]"><i class="fa-solid fa-bolt"></i></div>`;
                                        else if (pred.isShield) bMini = `<div class="absolute -top-1 -left-1 bg-sky-500 text-white w-5 h-5 rounded-full flex items-center justify-center font-black text-[10px]"><i class="fa-solid fa-shield"></i></div>`;
                                        else if(pred.isCaptain) bMini = `<div class="absolute -top-1 -left-1 bg-amber-500 text-black w-5 h-5 rounded-full flex items-center justify-center font-black text-[10px]">C</div>`;

                                        return `
                                            <div class="bg-slate-900/60 p-3 rounded-xl flex items-center justify-between border border-white/5 relative ${isLocked ? 'opacity-70' : ''}">
                                                ${bMini}
                                                <div class="flex-1 text-left font-bold text-xs md:text-sm text-slate-200 truncate">${getTeamName(match.home)}</div>
                                                <div class="px-2">
                                                    <button ${isLocked ? 'disabled' : `onclick="openModal('${match.id}')"`} class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${isPredicted ? 'bg-blue-600/20 text-blue-300 border border-blue-500/30' : 'bg-slate-800 text-slate-300 hover:bg-blue-600 hover:text-white'} ${isLocked ? 'opacity-50 cursor-not-allowed' : ''}">
                                                        ${isPredicted ? `${pred.home} - ${pred.away}` : (isLocked ? '<i class="fa-solid fa-lock"></i> مقفلة' : 'توقع الآن')}
                                                    </button>
                                                </div>
                                                <div class="flex-1 text-right font-bold text-xs md:text-sm text-slate-200 truncate">${getTeamName(match.away)}</div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderStandingsTab() {
            const standings = getGlobalStandings();
            return `
                <div class="glass p-4 md:p-6 rounded-3xl space-y-4">
                    <div class="flex justify-between items-center border-b border-white/10 pb-3">
                        <div>
                            <h2 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-trophy text-amber-400"></i> لوحة الشرف</h2>
                        </div>
                        <span class="text-xs font-bold text-blue-400 bg-blue-600/20 px-3 py-1 rounded-full border border-blue-500/30">الإجمالي: ${standings.length}</span>
                    </div>
                    <div class="space-y-2">
                        ${standings.map((user, idx) => {
                            const isMe = user.username === currentUser.username;
                            return `

        function openModal(matchId) { activeMatchModal = matches.find(m => m.id === matchId); renderModal(); }
        function closeModal() { activeMatchModal = null; renderModal(); }

        function renderModal() {
            const container = document.getElementById('modal-container');
            if (!activeMatchModal) { container.innerHTML = ''; return; }
            const pred = (predictions[currentUser.username] || {})[activeMatchModal.id] || { home: '', away: '', isCaptain: false, isTripleCaptain: false, isShield: false };
            const hVal = pred.home !== undefined ? pred.home : '';
            const aVal = pred.away !== undefined ? pred.away : '';
            
            const currentGw = Number(activeMatchModal.gw);
            const userPreds = predictions[currentUser.username] || {};
            let captainUsedInGw = false;
            let tcUsedInCurrentHalf = false;
            
            Object.entries(userPreds).forEach(([mId, p]) => {
                if (mId === activeMatchModal.id) return; 
                const m = matches.find(x => x.id === mId);
                if (m) {
                    if (Number(m.gw) === currentGw && p.isCaptain) captainUsedInGw = true;
                    if ((currentGw <= 18 && Number(m.gw) <= 18 && p.isTripleCaptain) || (currentGw >= 19 && Number(m.gw) >= 19 && p.isTripleCaptain)) tcUsedInCurrentHalf = true;
                }
            });

            const pts = calcPoints(activeMatchModal.home, activeMatchModal.away, hVal, aVal, null, null, pred.isCaptain, pred.isTripleCaptain, pred.isShield);

            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="glass max-w-sm w-full p-6 rounded-3xl shadow-2xl border border-white/10 space-y-5 animate-fade-up">
                        <div class="text-center">
                            <h3 class="text-base font-bold text-white mt-2">${getTeamName(activeMatchModal.home)} ضد ${getTeamName(activeMatchModal.away)}</h3>
                        </div>
                        <div class="flex items-center justify-center gap-4">
                            <div class="text-center">
                                <span class="text-[10px] text-slate-400 block mb-1">${getTeamName(activeMatchModal.home)}</span>
                                <input type="text" inputmode="numeric" id="modal-pred-h" value="${hVal}" oninput="this.value = this.value.replace(/[^0-9]/g, ''); updateModalCalc()" class="score-input" />
                            </div>
                            <span class="text-xl font-bold text-slate-500">:</span>
                            <div class="text-center">
                                <span class="text-[10px] text-slate-400 block mb-1">${getTeamName(activeMatchModal.away)}</span>
                                <input type="text" inputmode="numeric" id="modal-pred-a" value="${aVal}" oninput="this.value = this.value.replace(/[^0-9]/g, ''); updateModalCalc()" class="score-input" />
                            </div>
                        </div>
                        
                        <div class="space-y-2 bg-slate-900/50 p-2 rounded-2xl border border-white/5">
                            <label class="flex items-center gap-3 p-2 rounded-xl transition-all ${captainUsedInGw && !pred.isCaptain ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}">
                                <input type="radio" name="powerup" value="captain" onchange="updateModalCalc()" ${pred.isCaptain ? 'checked' : ''} ${captainUsedInGw && !pred.isCaptain ? 'disabled' : ''} class="w-4 h-4 accent-amber-500" />
                                <div class="flex-1"><span class="text-xs font-bold text-amber-400 block">C كابتن (مضاعفة x2)</span></div>
                            </label>
                            <label class="flex items-center gap-3 p-2 rounded-xl transition-all border-t border-white/5 ${tcUsedInCurrentHalf && !pred.isTripleCaptain ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}">
                                <input type="radio" name="powerup" value="triple" onchange="updateModalCalc()" ${pred.isTripleCaptain ? 'checked' : ''} ${tcUsedInCurrentHalf && !pred.isTripleCaptain ? 'disabled' : ''} class="w-4 h-4 accent-fuchsia-500" />
                                <div class="flex-1"><span class="text-xs font-bold text-fuchsia-400 block">الجوكر (مضاعفة x3)</span></div>
                            </label>
                            <label class="flex items-center gap-3 p-2 rounded-xl cursor-pointer transition-all border-t border-white/5">
                                <input type="radio" name="powerup" value="shield" onchange="updateModalCalc()" ${pred.isShield ? 'checked' : ''} class="w-4 h-4 accent-sky-500" />
                                <div class="flex-1"><span class="text-xs font-bold text-sky-400 block">درع التأمين (نقطة مضمونة)</span></div>
                            </label>
                            <label class="flex items-center gap-3 p-2 rounded-xl cursor-pointer transition-all border-t border-white/5">
                                <input type="radio" name="powerup" value="none" onchange="updateModalCalc()" ${!pred.isCaptain && !pred.isTripleCaptain && !pred.isShield ? 'checked' : ''} class="w-4 h-4 accent-slate-400" />
                                <div class="flex-1"><span class="text-xs font-bold text-slate-300 block">توقع عادي (بدون ميزات)</span></div>
                            </label>
                        </div>

                        <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-emerald-500/30 text-center">
                            <span id="modal-pts-display" class="text-2xl font-black text-emerald-400">${pts} نقطة</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="saveModalPrediction()" class="flex-1 py-3 bg-blue-600 text-white font-bold text-xs rounded-xl">حفظ التوقع</button>
                            <button onclick="closeModal()" class="px-4 py-3 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl">إلغاء</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateModalCalc() {
            const h = document.getElementById('modal-pred-h').value, a = document.getElementById('modal-pred-a').value;
            const p = document.querySelector('input[name="powerup"]:checked')?.value || 'none';
            document.getElementById('modal-pts-display').innerText = calcPoints(activeMatchModal.home, activeMatchModal.away, h, a, null, null, p==='captain', p==='triple', p==='shield') + ' نقطة';
        }

        async function saveModalPrediction() {
            const h = document.getElementById('modal-pred-h').value, a = document.getElementById('modal-pred-a').value;
            const powerup = document.querySelector('input[name="powerup"]:checked')?.value || 'none';
            if (h === '' || a === '') return;
            
            // التحديث الشكلي الفوري للواجهة
            if (!predictions[currentUser.username]) predictions[currentUser.username] = {};
            predictions[currentUser.username][activeMatchModal.id] = { 
                home: Number(h), 
                away: Number(a), 
                isCaptain: powerup === 'captain', 
                isTripleCaptain: powerup === 'triple',
                isShield: powerup === 'shield'
            };
            
            const reqMatchId = activeMatchModal.id;
            closeModal();
            render();

            try {
                // الإرسال لقاعدة البيانات السحابية
                await fetch(`${API_BASE_URL}/predict`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: currentUser.username, 
                        matchId: reqMatchId, 
                        predH: h, 
                        predA: a, 
                        isCaptain: powerup === 'captain', 
                        isTripleCaptain: powerup === 'triple'
                        // (ملاحظة: سيتم إضافة إرسال Shield و Sniper قريباً عند تحديث قاعدة البيانات)
                    })
                });
                await syncData(); // جلب البيانات المحدثة
            } catch(e) {
                console.error("Predict error:", e);
                showCustomDialog("حدث خطأ أثناء الحفظ بالسيرفر.");
            }
        }

        async function createMiniLeague() {
            const name = document.getElementById('new-ml-name').value.trim();
            if (!name) return;
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            try {
                const res = await fetch(`${API_BASE_URL}/leagues`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: 'ml_' + Date.now(), name, code, creator: currentUser.username })
                });
                const data = await res.json();
                if(data.success) {
                    showCustomDialog('تم إنشاء الدوري بنجاح! كود: ' + code);
                    await syncData();
                    render();
                } else { showCustomDialog(data.message); }
            } catch(e) { showCustomDialog("تعذر الاتصال بالسيرفر"); }
        }

        async function joinMiniLeague() {
            const code = document.getElementById('join-ml-code').value.trim().toUpperCase();
            if(!code) return;
            try {
                const res = await fetch(`${API_BASE_URL}/leagues/join`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ code, username: currentUser.username })
                });
                const data = await res.json();
                showCustomDialog(data.message || (data.success ? 'تم الانضمام بنجاح!' : 'خطأ'));
                if (data.success) { await syncData(); render(); }
            } catch(e) { showCustomDialog("تعذر الاتصال بالسيرفر"); }
        }

        async function addMatch(e) {
            e.preventDefault();
            const gw = document.getElementById('adm-gw').value, home = document.getElementById('adm-home').value;
            const away = document.getElementById('adm-away').value, dateInput = document.getElementById('adm-date').value;
            const timeInput = document.getElementById('adm-time').value;
            if(!gw || !home || !away || !dateInput || !timeInput) return;

            const formattedDate = dateInput.replace(/-/g, '/');
            let [hours, minutes] = timeInput.split(':'); hours = parseInt(hours, 10);
            let period = hours >= 12 ? 'م' : 'ص'; hours = hours % 12 || 12;
            const formattedTime = `${hours}:${minutes} ${period}`;
            
            try {
                await fetch(`${API_BASE_URL}/admin/match`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id: 'm_custom_' + Date.now(), gw: Number(gw), home, away, date: formattedDate, time: formattedTime})
                });
                showCustomDialog(`تمت إضافة المباراة بنجاح!`);
                await syncData(); render();
            } catch(e) {}
        }

        function deleteMatch(id) {
            showCustomDialog('هل أنت متأكد من حذف هذه المباراة نهائياً؟', 'confirm', async () => {
                try {
                    await fetch(`${API_BASE_URL}/admin/match/${id}`, { method: 'DELETE' });
                    await syncData(); render();
                } catch(e){}
            });
        }

        async function saveActual(id) {
            const hVal = document.getElementById(`actual-h-${id}`).value, aVal = document.getElementById(`actual-a-${id}`).value;
            if (hVal === '' || aVal === '') return;
            try {
                await fetch(`${API_BASE_URL}/admin/result`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ matchId: id, actualH: hVal, actualA: aVal })
                });
                showCustomDialog('تم تثبيت النتيجة بنجاح!', 'alert');
                await syncData(); render();
            } catch(e){}
        }

        async function clearActual(id) {
            try {
                await fetch(`${API_BASE_URL}/admin/result`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ matchId: id, actualH: null, actualA: null })
                });
                showCustomDialog('تم إلغاء النتيجة.', 'alert');
                await syncData(); render();
            } catch(e){}
        }

        function showCustomDialog(message, type = 'alert', onConfirm = null) {
            const container = document.getElementById('dialog-container');
            container.innerHTML = `
                <div class="fixed inset-0 z-[70] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="glass max-w-xs w-full p-6 rounded-3xl shadow-2xl border border-white/10 text-center animate-fade-up">
                        <div class="text-4xl mb-4 text-amber-400"><i class="fa-solid fa-${type === 'confirm' ? 'circle-question' : 'circle-exclamation'}"></i></div>
                        <h3 class="text-sm font-bold text-white mb-6">${message}</h3>
                        <div class="flex gap-3">
                            ${type === 'confirm' ? `<button id="diag-yes" class="flex-1 py-2.5 bg-rose-600 text-white font-bold text-xs rounded-xl">نعم</button>` : ''}
                            <button id="diag-close" class="flex-1 py-2.5 bg-slate-800 text-white font-bold text-xs rounded-xl">${type === 'confirm' ? 'لا' : 'حسناً'}</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('diag-close').onclick = () => { container.innerHTML = ''; };
            if (type === 'confirm' && onConfirm) { document.getElementById('diag-yes').onclick = () => { container.innerHTML = ''; onConfirm(); }; }
        }

        function setAuthMode(mode) { authMode = mode; render(); }

        async function handleAuth(e) {
            e.preventDefault();
            const name = document.getElementById('auth-name').value.trim();
            const pin = document.getElementById('auth-pin').value.trim();
            
            // إضافة التحقق من تطابق كلمة المرور في حالة إنشاء حساب جديد
            if (authMode === 'register') {
                const pinConfirm = document.getElementById('auth-pin-confirm').value.trim();
                if (pin !== pinConfirm) {
                    showCustomDialog('كلمات المرور غير متطابقة!');
                    return;
                }
            }

            if (!name || pin.length < 4) {
                showCustomDialog('يرجى إدخال اسم المستخدم وكلمة مرور لا تقل عن 4 أرقام.');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: name, pin: pin })
                });
                
                const data = await response.json();

                if (data.success) {
                    currentUser = data.user;
                    localStorage.setItem('oracle_current_user_v8', JSON.stringify(currentUser));
                    
                    document.getElementById('app').innerHTML = `
                        <div class="flex flex-col items-center justify-center min-h-screen text-slate-400 gap-4">
                            <i class="fa-solid fa-cloud-arrow-down fa-spin text-4xl text-blue-500"></i>
                            <span class="font-bold text-lg text-white">Goal Sniper</span>
                            <span class="font-bold text-sm">جاري مزامنة بياناتك من السيرفر...</span>
                        </div>`;
                    
                    await syncData(); 
                    render();    
                } else {
                    showCustomDialog(data.message || 'خطأ في الدخول.');
                }
            } catch (error) {
                console.error("Auth Error:", error);
                showCustomDialog('تعذر الاتصال بالسيرفر. تأكد من اتصال الإنترنت.');
            }
        }

        function logout() { currentUser = null; localStorage.removeItem('oracle_current_user_v8'); render(); }
        function switchTab(tab) { currentTab = tab; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function renderAuthScreen() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4 w-full">
                    <div class="glass max-w-md w-full p-6 md:p-8 rounded-3xl shadow-2xl border border-white/10 animate-fade-up">
                        <div class="text-center mb-6">
                            <div class="inline-block p-4 rounded-full bg-blue-500/10 mb-2">
                                <i class="fa-solid fa-crosshairs text-4xl text-blue-500"></i>
                            </div>
                            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-amber-400">Goal Sniper</h1>
                            <p class="text-xs text-slate-400 mt-2">منصة التوقعات الأقوى للدوري الإنجليزي</p>
                        </div>
                        
                        <div class="flex gap-2 mb-6 bg-slate-900/50 p-1.5 rounded-xl border border-white/5">
                            <button type="button" onclick="setAuthMode('login')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all ${authMode === 'login' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}">تسجيل الدخول</button>
                            <button type="button" onclick="setAuthMode('register')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all ${authMode === 'register' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}">حساب جديد</button>
                        </div>

                        <form onsubmit="handleAuth(event)" class="space-y-4">
                            <div><input type="text" id="auth-name" placeholder="اسم المستخدم" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500" required /></div>
                            <div><input type="password" id="auth-pin" placeholder="كلمة المرور (4 أرقام على الأقل)" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500" required /></div>
                            
                            ${authMode === 'register' ? `
                                <div><input type="password" id="auth-pin-confirm" placeholder="تأكيد كلمة المرور" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500" required /></div>
                            ` : ''}

                            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold rounded-xl shadow-lg mt-2 transition-transform active:scale-95">
                                ${authMode === 'login' ? 'دخول إلى المنصة' : 'إنشاء حساب جديد'}
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            if (!currentUser) { app.innerHTML = renderAuthScreen(); return; }

            app.innerHTML = `
                <header class="p-4 glass sticky top-0 z-40 border-b border-white/10 flex justify-between items-center shadow-lg">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center font-black text-blue-400">${currentUser.username.substring(0, 2).toUpperCase()}</div>
                        <div>
                            <h1 class="text-sm font-bold text-slate-200">Goal Sniper</h1>
                            <p class="text-[10px] text-emerald-400"><i class="fa-solid fa-circle text-[8px]"></i> متصل بالسيرفر المباشر</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        ${currentUser.username.toLowerCase() === 'red army' ? `<button onclick="switchTab('admin')" class="px-3 py-1.5 bg-rose-600/20 border border-rose-500/30 rounded-xl text-rose-300 text-xs font-bold"><i class="fa-solid fa-shield-halved"></i> الإدارة</button>` : ''}
                        <button onclick="logout()" class="p-2 glass text-rose-400 rounded-xl"><i class="fa-solid fa-right-from-bracket"></i></button>
                    </div>
                </header>

                <main class="flex-1 max-w-4xl w-full mx-auto p-4 animate-fade-up pb-20">
                    ${currentTab === 'home' ? renderHomeTab() : ''}
                    ${currentTab === 'matches' ? renderMatchesTab() : ''}
                    ${currentTab === 'standings' ? renderStandingsTab() : ''}
                    ${currentTab === 'minileagues' ? renderMiniLeaguesTab() : ''}
                    ${currentTab === 'rules' ? renderRulesTab() : ''}
                    ${currentTab === 'admin' && currentUser.username.toLowerCase() === 'red army' ? renderAdminTab() : ''}
                </main>

                <nav class="fixed bottom-0 left-0 right-0 glass border-t border-white/10 p-2 flex justify-around items-center z-40 bg-[#0a0e17]/95">
                    <button onclick="switchTab('home')" class="flex flex-col items-center gap-1 ${currentTab === 'home' ? 'text-blue-400' : 'text-slate-400'}"><i class="fa-solid fa-house text-base"></i><span class="text-[10px] font-bold">الرئيسية</span></button>
                    <button onclick="switchTab('matches')" class="flex flex-col items-center gap-1 ${currentTab === 'matches' ? 'text-blue-400' : 'text-slate-400'}"><i class="fa-solid fa-futbol text-base"></i><span class="text-[10px] font-bold">المباريات</span></button>
                    <button onclick="switchTab('standings')" class="flex flex-col items-center gap-1 ${currentTab === 'standings' ? 'text-blue-400' : 'text-slate-400'}"><i class="fa-solid fa-ranking-star text-base"></i><span class="text-[10px] font-bold">الترتيب</span></button>
                    <button onclick="switchTab('minileagues')" class="flex flex-col items-center gap-1 ${currentTab === 'minileagues' ? 'text-blue-400' : 'text-slate-400'}"><i class="fa-solid fa-users text-base"></i><span class="text-[10px] font-bold">الدوريات</span></button>
                    <button onclick="switchTab('rules')" class="flex flex-col items-center gap-1 ${currentTab === 'rules' ? 'text-blue-400' : 'text-slate-400'}"><i class="fa-solid fa-book-bookmark text-base"></i><span class="text-[10px] font-bold">القوانين</span></button>
                </nav>
            `;
            renderModal();
        }

        window.onload = async function() {
            currentUser = JSON.parse(localStorage.getItem('oracle_current_user_v8') || 'null');
            if (currentUser) {
                // إظهار رسالة جلب 380 مباراة للمستخدم ليعرف أن التطبيق أونلاين
                document.getElementById('app').innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-screen text-slate-400 gap-4">
                        <i class="fa-solid fa-crosshairs fa-spin text-4xl text-blue-500"></i>
                        <span class="font-bold text-lg text-white">Goal Sniper</span>
                        <span class="font-bold text-sm">جاري تحميل جدول المباريات الرسمي المحدث...</span>
                    </div>`;
                await syncData(); 
            }
            render();
        };
    </script>
</body>
</html>
