        async function syncData() {
    try {
        const res = await fetch(`${API_BASE_URL}/sync`);
        const json = await res.json();
        if (json.success) {
            users = json.data.users || [];
            
            matches = (json.data.matches || []).map(m => ({

                gw: m.gw,
                home: m.home,
                away: m.away,
                date: m.match_date || m.date,
                time: m.match_time || m.time,
                actualH: m.actual_h !== undefined ? m.actual_h : m.actualH,
                actualA: m.actual_a !== undefined ? m.actual_a : m.actualA
            }));
            
            predictions = json.data.predictions || {};
            miniLeagues = json.data.miniLeagues || [];
            
            // 👇 هذا هو السطر المنقذ الذي نسينا إضافته 👇
            sniperShots = json.data.sniperShots || []; 
        }
    } catch (e) { 
        console.warn("Sync failed:", e); 
        showCustomDialog("لا يمكن الاتصال بالسيرفر حالياً. حاول مجدداً.");
    }
}

        const calcPoints = (homeCode, awayCode, predH, predA, actualH = null, actualA = null, isCaptain = false, isTripleCaptain = false) => {
            if (predH === '' || predA === '' || predH === null || predA === null) return 0;
            const ph = Number(predH), pa = Number(predA);
            const homeIsBig = BIG_TEAMS.includes(homeCode), awayIsBig = BIG_TEAMS.includes(awayCode);
            let ah = actualH !== null ? Number(actualH) : ph;
            let aa = actualA !== null ? Number(actualA) : pa;

            const isExact = (ph === ah && pa === aa);
            const isOutcomeCorrect = (ph > pa && ah > aa) || (ph < pa && ah < aa) || (ph === pa && ah === aa);
            const isDraw = (ah === aa);
            const totalGoals = ah + aa;

            let pts = 0;
            if (isOutcomeCorrect || isExact) {
                if (!homeIsBig && !awayIsBig) {
                    if (isExact) pts = (totalGoals >= 5 || (ah === 0 && aa === 0)) ? 4 : 3;
                    else if (isOutcomeCorrect) pts = 1;
                } else if (homeIsBig && awayIsBig) {
                    if (isDraw) pts = isExact ? 3 : 2;
                    else pts = isExact ? 5 : 3;
                } else {
                    const bigWon = (homeIsBig && ah > aa) || (awayIsBig && aa > ah);
                    const bigLost = (homeIsBig && ah < aa) || (awayIsBig && aa < ah);
                    if (isDraw) pts = isExact ? 3 : 2;
                    else if (bigWon) pts = isExact ? 2 : 1;
                    else if (bigLost) pts = isExact ? 6 : 4;
                }
            }

            if (isTripleCaptain) return pts * 3; 
            if (isCaptain) return pts * 2; 
            return pts;
        };

        function getGlobalStandings() {
    // 1. استخراج كل أسماء المستخدمين الفريدة من جدول التوقعات أولاً
    const allUsernames = new Set();
    Object.keys(predictions).forEach(u => allUsernames.add(u));
    users.forEach(u => allUsernames.add(u.username));

    const statsMap = {};
    allUsernames.forEach(username => { 
        statsMap[username] = { 
            username: username, totalPts: 0, predictedCount: 0, correctOutcomes: 0, playedMatches: 0,
            teamPoints: {}, exactsPerGw: {}, gwPoints: {}, badges: { sniper: false, giantSlayer: false, motw: false }
        }; 
    });

    matches.forEach(m => {
        const isPlayed = m.actualH !== null && m.actualA !== null;
        allUsernames.forEach(username => {
            const p = (predictions[username] || {})[m.id];
            const userStats = statsMap[username];
            if (userStats && p && p.home !== '' && p.away !== '' && p.home !== null && p.away !== null) {
                userStats.predictedCount++;
                if (isPlayed) {
                    userStats.playedMatches++;
                    const pts = calcPoints(m.home, m.away, p.home, p.away, m.actualH, m.actualA, p.isCaptain, p.isTripleCaptain);
                    userStats.totalPts += pts;
                    
                    const isOutcomeCorrect = (p.home > p.away && m.actualH > m.actualA) || (p.home < p.away && m.actualH < m.actualA) || (p.home === p.away && m.actualH === m.actualA);
                    if (isOutcomeCorrect) userStats.correctOutcomes++;

                    userStats.teamPoints[m.home] = (userStats.teamPoints[m.home] || 0) + pts;
                    userStats.teamPoints[m.away] = (userStats.teamPoints[m.away] || 0) + pts;
                    userStats.gwPoints[m.gw] = (userStats.gwPoints[m.gw] || 0) + pts;
                    
                    if (Number(p.home) === m.actualH && Number(p.away) === m.actualA) {
                        userStats.exactsPerGw[m.gw] = (userStats.exactsPerGw[m.gw] || 0) + 1;
                        if (userStats.exactsPerGw[m.gw] >= 3) userStats.badges.sniper = true;
                    }

                    const homeIsBig = BIG_TEAMS.includes(m.home), awayIsBig = BIG_TEAMS.includes(m.away);
                    const bigLost = (homeIsBig && m.actualH < m.actualA) || (awayIsBig && m.actualA < m.actualH);
                    if (bigLost && isOutcomeCorrect) userStats.badges.giantSlayer = true;
                }
            }
        });
    });

    // إضافة منطق عراف الأسبوع وبقية الحسابات كما في السابق...
    const activeGw = getCurrentActiveGw();
    const prevGw = activeGw > 1 ? activeGw - 1 : 1;
    let highestGwPts = -1, motwUser = null;
    
    Object.values(statsMap).forEach(userStats => {
        const pts = userStats.gwPoints[prevGw] || 0;
        if (pts > highestGwPts && pts > 0) { highestGwPts = pts; motwUser = userStats.username; }
    });
    if (motwUser) statsMap[motwUser].badges.motw = true;

    Object.values(statsMap).forEach(userStats => {
        userStats.hitRate = userStats.playedMatches > 0 ? Math.round((userStats.correctOutcomes / userStats.playedMatches) * 100) : 0;
        let bestTeam = '-', maxTeamPts = -1;
        for (const [team, pts] of Object.entries(userStats.teamPoints)) {
            if (pts > maxTeamPts) { maxTeamPts = pts; bestTeam = getTeamName(team); }
        }
        userStats.favTeam = maxTeamPts > 0 ? bestTeam : '-';
    });

    return Object.values(statsMap).sort((a, b) => b.totalPts - a.totalPts);
}

        function getLeagueStandings(leagueCode, baseStats) {
    const activeGw = typeof getCurrentActiveGw === 'function' ? getCurrentActiveGw() : 1;
    const league = miniLeagues.find(l => l.code === leagueCode);
    if (!league) return null;

    // 1. استنساخ البيانات وعزلها عن الترتيب العام
    let leagueMembers = baseStats
        .filter(s => league.members.includes(s.username))
        .map(s => ({
            ...s,
            mlTotalPts: s.totalPts, // نقاط الدوري التي ستتأثر بالقنص
            mlGwPts: s.gwPoints[activeGw] || 0 // نقاط الجولة الحالية
        }));

    // 2. تحليل رصاصات القناص في هذا الدوري فقط
    const currentLeagueShots = (sniperShots || []).filter(shot => 
        (shot.league_code === leagueCode || shot.leagueCode === leagueCode)
    );

    const victimsLastGw = new Set(); // لتسجيل الحصانة
    const snipersThisGw = new Set(); // لتسجيل من استخدم الميزة هذه الجولة

    currentLeagueShots.forEach(shot => {
        // تطبيق الخصم من المجموع الكلي داخل الدوري فقط
        const victim = leagueMembers.find(m => m.username === shot.victim);
        if (victim) victim.mlTotalPts -= shot.points_deducted;

        // تسجيل الحصانة إذا تم قنصه في الجولة السابقة
        if (shot.gw === activeGw - 1) victimsLastGw.add(shot.victim);

        // تسجيل من أطلق النار في الجولة الحالية
        if (shot.gw === activeGw) snipersThisGw.add(shot.sniper);
    });

    // 3. إعادة ترتيب الأعضاء بناءً على نقاط الدوري (بعد الخصومات)
    leagueMembers.sort((a, b) => b.mlTotalPts - a.mlTotalPts);

    // 4. تحديد المتصدرين في الجولة الحالية (أعلى نقاط الجولة)
    let maxGwPts = -1;
    leagueMembers.forEach(m => {
        if (m.mlGwPts > maxGwPts) maxGwPts = m.mlGwPts;
    });

    // جلب أسماء المتصدرين بشرط أن تكون نقاطهم أكبر من صفر
    const topScorers = leagueMembers.filter(m => m.mlGwPts === maxGwPts && maxGwPts > 0).map(m => m.username);
    
    // تحديد قوة الرصاصة (4 للانفراد، 2 للتعادل)
    const sniperPenalty = topScorers.length > 1 ? 2 : 4; 

    return {
        members: leagueMembers,
        topScorers,
        sniperPenalty,
        victimsLastGw,
        snipersThisGw,
        activeGw
    };
}

        // 1. دالة تجميل التاريخ (تحوله إلى أرقام أنيقة وموحدة DD/MM/YYYY)
function formatMatchDate(dateStr) {
    if (!dateStr) return '';
    let str = String(dateStr);
    
    // تحويل أي شهر عربي إلى رقم في حال تم إدخاله بالخطأ
    const arabicMonths = {
        'يناير': '1', 'جانفي': '1', 'فبراير': '2', 'فيفري': '2', 'شباط': '2',
        'مارس': '3', 'آذار': '3', 'أبريل': '4', 'ابريل': '4', 'نيسان': '4',
        'مايو': '5', 'أيار': '5', 'ايار': '5', 'يونيو': '6', 'حزيران': '6',
        'يوليو': '7', 'تموز': '7', 'أغسطس': '8', 'اغسطس': '8', 'آب': '8',
        'سبتمبر': '9', 'أيلول': '9', 'ايلول': '9', 'أكتوبر': '10', 'اكتوبر': '10', 'تشرين الأول': '10',
        'نوفمبر': '11', 'تشرين الثاني': '11', 'ديسمبر': '12', 'كانون الأول': '12'
    };
    for (const [name, num] of Object.entries(arabicMonths)) {
        if (str.includes(name)) {
            str = str.replace(new RegExp(name, 'g'), num);
        }
    }
    
    // توحيد الفواصل
    str = str.replace(/[\s\.-]+/g, '/').replace(/\/+/g, '/');
    
    // تنسيق التاريخ ليظهر بشكل أرقام أنيقة (مثال: 16/08/2026)
    let parts = str.match(/\d+/g);
    if (parts && parts.length >= 2) {
        let d = parts[0].padStart(2, '0');
        let m = parts[1].padStart(2, '0');
        let y = parts[2] ? parts[2] : new Date().getFullYear();
        if (parts[0].length === 4) { // في حال كان النسق YYYY/MM/DD
            y = parts[0]; m = parts[1].padStart(2, '0'); d = parts[2].padStart(2, '0');
        }
        return `${d}/${m}/${y}`;
    }
    return str;
}

        // 2. دالة حساب الوقت (تدعم الآن نظام AM و PM بشكل مثالي)
function parseMatchDate(dateStr, timeStr) {
    try {
        let dStr = formatMatchDate(dateStr);
        let [time, period] = (timeStr || '').trim().split(/\s+/);
        let [hours, minutes] = (time || '0:0').split(':');
        hours = parseInt(hours, 10) || 0;
        minutes = parseInt(minutes, 10) || 0;
        
        // دعم اللغتين (ص/م) و (AM/PM)
        if (period) {
            period = period.toUpperCase();
            if ((period === 'م' || period === 'PM') && hours !== 12) hours += 12;
            if ((period === 'ص' || period === 'AM') && hours === 12) hours = 0;
        }
        
        let parts = dStr.match(/\d+/g);
        let y = new Date().getFullYear(), m = 0, d = 1;
        if (parts) {
            if (parts.length >= 3 && parts[0].length === 4) { 
                y = parseInt(parts[0]); m = parseInt(parts[1]) - 1; d = parseInt(parts[2]); 
            } else if (parts.length >= 2) { 
                d = parseInt(parts[0]); m = parseInt(parts[1]) - 1; if (parts[2]) y = parseInt(parts[2]); 
            }
        }
        return new Date(y, m, d, hours, minutes).getTime();
    } catch(e) { return 0; }
}

        // 3. دالة قفل المباراة (تم سد ثغرة القفل الخاطئ)
function isMatchLocked(match) {
    try {
        // التأكد 100% أن النتيجة مسجلة فعلاً وليست (فارغة أو غير معرفة)
        if (match.actualH !== undefined && match.actualH !== null && match.actualH !== '' && 
            match.actualA !== undefined && match.actualA !== null && match.actualA !== '') {
            return true; // المباراة انتهت ومسجلة لها نتيجة
        }
        
        const matchTimeMs = parseMatchDate(match.date, match.time);
        if (!matchTimeMs) return false;
        
        const now = new Date().getTime();
        return (matchTimeMs - now) <= 60 * 60 * 1000; // قفل قبل ساعة من بداية المباراة
    } catch(e) { return false; }
}

                if (gwMatches.length === 0) continue;
                if (!gwMatches.every(m => m.actualH !== null && m.actualA !== null)) return gw;
            }
            return 1;
        }

                        <div class="space-y-2 bg-slate-900/50 p-2 rounded-2xl border border-white/5">
                            <label class="flex items-center gap-3 p-2.5 rounded-xl transition-all ${captainUsedInGw && !pred.isCaptain ? 'opacity-50 cursor-not-allowed bg-slate-800' : 'cursor-pointer hover:bg-slate-800/80'}">
                                <input type="radio" name="powerup" value="captain" onchange="updateModalCalc()" ${pred.isCaptain ? 'checked' : ''} ${captainUsedInGw && !pred.isCaptain ? 'disabled' : ''} class="w-4 h-4 accent-amber-500" />
                                <div class="flex-1 flex justify-between items-center"><span class="text-xs font-bold text-amber-400 block">C كابتن (مضاعفة x2)</span> ${captainUsedInGw && !pred.isCaptain ? '<span class="text-[9px] bg-rose-500/20 text-rose-400 px-1.5 py-0.5 rounded">مُستخدمة</span>' : ''}</div>
                            </label>
                            <label class="flex items-center gap-3 p-2.5 rounded-xl transition-all border-t border-white/5 ${tcUsedInCurrentHalf && !pred.isTripleCaptain ? 'opacity-50 cursor-not-allowed bg-slate-800' : 'cursor-pointer hover:bg-slate-800/80'}">
                                <input type="radio" name="powerup" value="triple" onchange="updateModalCalc()" ${pred.isTripleCaptain ? 'checked' : ''} ${tcUsedInCurrentHalf && !pred.isTripleCaptain ? 'disabled' : ''} class="w-4 h-4 accent-fuchsia-500" />
                                <div class="flex-1 flex justify-between items-center"><span class="text-xs font-bold text-fuchsia-400 block">الجوكر (مضاعفة x3)</span> ${tcUsedInCurrentHalf && !pred.isTripleCaptain ? '<span class="text-[9px] bg-rose-500/20 text-rose-400 px-1.5 py-0.5 rounded">مُستخدمة</span>' : ''}</div>
                            </label>
                            <label class="flex items-center gap-3 p-2.5 rounded-xl cursor-pointer transition-all border-t border-white/5 hover:bg-slate-800/80">
                                <input type="radio" name="powerup" value="none" onchange="updateModalCalc()" ${!pred.isCaptain && !pred.isTripleCaptain ? 'checked' : ''} class="w-4 h-4 accent-blue-500" />
                                <div class="flex-1"><span class="text-xs font-bold text-slate-300 block">توقع عادي (بدون مضاعفات)</span></div>
                            </label>
                        </div>

                        <div class="bg-blue-900/20 p-3.5 rounded-2xl border border-blue-500/30 text-center flex flex-col items-center justify-center">
                            <span class="text-[10px] text-blue-300 font-bold mb-1">النقاط المحتملة للتوقع المثالي</span>
                            <span id="modal-pts-display" class="text-2xl font-black text-emerald-400 drop-shadow-[0_0_8px_rgba(52,211,153,0.5)]">${pts} نقطة</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="saveModalPrediction()" class="flex-1 py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-blue-500/30 transition-all">حفظ التوقع</button>
                            <button onclick="closeModal()" class="px-5 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl transition-all">إلغاء</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateModalCalc() {
            const h = document.getElementById('modal-pred-h').value, a = document.getElementById('modal-pred-a').value;
            const p = document.querySelector('input[name="powerup"]:checked')?.value || 'none';
            // نحسب النقاط بافتراض أن النتيجة الفعلية جاءت مطابقة تماماً (h, a, h, a)
            let possiblePts = calcPoints(activeMatchModal.home, activeMatchModal.away, h, a, h, a, p==='captain', p==='triple');
            if (h === '' || a === '') possiblePts = 0;
            document.getElementById('modal-pts-display').innerText = possiblePts + ' نقطة';
        }

        async function saveModalPrediction() {
            const h = document.getElementById('modal-pred-h').value, a = document.getElementById('modal-pred-a').value;
            const powerup = document.querySelector('input[name="powerup"]:checked')?.value || 'none';
            if (h === '' || a === '') return;
            
            // تحديث شكلي سريع لراحة المستخدم
            if (!predictions[currentUser.username]) predictions[currentUser.username] = {};
            predictions[currentUser.username][activeMatchModal.id] = { 
                home: Number(h), 
                away: Number(a), 
                isCaptain: powerup === 'captain', 
                isTripleCaptain: powerup === 'triple'
            };
            
            const reqMatchId = activeMatchModal.id;
            closeModal();
            render(); // إعادة رسم الشاشة لتظهر الأرقام

            // الحفظ الفعلي في السيرفر
            try {
                await fetch(`${API_BASE_URL}/predict`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: currentUser.username, 
                        matchId: reqMatchId, 
                        predH: h, 
                        predA: a, 
                        isCaptain: powerup === 'captain', 
                        isTripleCaptain: powerup === 'triple'
                    })
                });
                await syncData(); // جلب البيانات لتأكيد الحفظ
            } catch(e) {
                console.error("Predict error:", e);
                showCustomDialog("حدث خطأ أثناء الحفظ بالسيرفر. يرجى التأكد من اتصال الإنترنت.");
            }
        }

        async function createMiniLeague() {
            const name = document.getElementById('new-ml-name').value.trim();
            if (!name) { showCustomDialog('يرجى كتابة اسم الدوري أولاً.'); return; }
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            try {
                const res = await fetch(`${API_BASE_URL}/leagues`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: 'ml_' + Date.now(), name, code, creator: currentUser.username })
                });
                const data = await res.json();
                if(data.success) {
                    showCustomDialog('تم إنشاء الدوري بنجاح! كود الدعوة: ' + code);
                    await syncData();
                    render();
                } else { showCustomDialog(data.message); }
            } catch(e) { showCustomDialog("تعذر الاتصال بالسيرفر"); }
        }

        async function joinMiniLeague() {
            const code = document.getElementById('join-ml-code').value.trim().toUpperCase();
            if(!code) { showCustomDialog('يرجى إدخال كود الدوري.'); return; }
            try {
                const res = await fetch(`${API_BASE_URL}/leagues/join`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ code, username: currentUser.username })
                });
                const data = await res.json();
                showCustomDialog(data.message || (data.success ? 'تم الانضمام للدوري بنجاح!' : 'خطأ غير معروف'));
                if (data.success) { await syncData(); render(); }
            } catch(e) { showCustomDialog("تعذر الاتصال بالسيرفر"); }
        }

        async function addMatch(e) {
            e.preventDefault();
            const gw = document.getElementById('adm-gw').value, home = document.getElementById('adm-home').value;
            const away = document.getElementById('adm-away').value, dateInput = document.getElementById('adm-date').value;
            const timeInput = document.getElementById('adm-time').value;
            if(!gw || !home || !away || !dateInput || !timeInput) return;

            const formattedDate = dateInput.replace(/-/g, '/');
            let [hours, minutes] = timeInput.split(':'); hours = parseInt(hours, 10);
            let period = hours >= 12 ? 'م' : 'ص'; hours = hours % 12 || 12;
            const formattedTime = `${hours}:${minutes} ${period}`;
            
            try {
                await fetch(`${API_BASE_URL}/admin/match`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id: 'm_custom_' + Date.now(), gw: Number(gw), home, away, date: formattedDate, time: formattedTime})
                });
                showCustomDialog(`تمت إضافة المباراة بنجاح!`);
                await syncData(); render();
            } catch(e) {}
        }

        function deleteMatch(id) {
            showCustomDialog('هل أنت متأكد من حذف هذه المباراة نهائياً من قاعدة البيانات؟', 'confirm', async () => {
                try {
                    await fetch(`${API_BASE_URL}/admin/match/${id}`, { method: 'DELETE' });
                    await syncData(); render();
                } catch(e){}
            });
        }

        async function saveActual(id) {
            const hVal = document.getElementById(`actual-h-${id}`).value, aVal = document.getElementById(`actual-a-${id}`).value;
            if (hVal === '' || aVal === '') { showCustomDialog('يرجى إدخال النتيجة كاملة.'); return; }
            try {
                await fetch(`${API_BASE_URL}/admin/result`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ matchId: id, actualH: hVal, actualA: aVal })
                });
                showCustomDialog('تم تثبيت النتيجة رسمياً بنجاح!', 'alert');
                await syncData(); render();
            } catch(e){}
        }

        async function clearActual(id) {
            try {
                await fetch(`${API_BASE_URL}/admin/result`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ matchId: id, actualH: null, actualA: null })
                });
                showCustomDialog('تم إلغاء النتيجة، المباراة الآن مفتوحة للتوقعات (إذا لم يمر وقتها).', 'alert');
                await syncData(); render();
            } catch(e){}
        }

        function showCustomDialog(message, type = 'alert', onConfirm = null) {
            const container = document.getElementById('dialog-container');
            container.innerHTML = `
                <div class="fixed inset-0 z-[70] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="glass max-w-xs w-full p-6 rounded-3xl shadow-2xl border border-white/10 text-center animate-fade-up">
                        <div class="text-4xl mb-4 ${type === 'confirm' ? 'text-blue-400' : 'text-amber-400'}"><i class="fa-solid fa-${type === 'confirm' ? 'circle-question' : 'circle-exclamation'}"></i></div>
                        <h3 class="text-sm font-bold text-white mb-6 leading-relaxed">${message}</h3>
                        <div class="flex gap-3">
                            ${type === 'confirm' ? `<button id="diag-yes" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl transition-all">نعم، متأكد</button>` : ''}
                            <button id="diag-close" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs rounded-xl transition-all">${type === 'confirm' ? 'إلغاء' : 'حسناً فهمت'}</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('diag-close').onclick = () => { container.innerHTML = ''; };
            if (type === 'confirm' && onConfirm) { document.getElementById('diag-yes').onclick = () => { container.innerHTML = ''; onConfirm(); }; }
        }

        function setAuthMode(mode) { authMode = mode; render(); }

        async function handleAuth(e) {
            e.preventDefault();
            const name = document.getElementById('auth-name').value.trim();
            const pin = document.getElementById('auth-pin').value.trim();
            
            if (authMode === 'register') {
                const pinConfirm = document.getElementById('auth-pin-confirm').value.trim();
                if (pin !== pinConfirm) {
                    showCustomDialog('كلمات المرور غير متطابقة!');
                    return;
                }
            }

            if (!name || pin.length < 4) {
                showCustomDialog('يرجى إدخال اسم المستخدم وكلمة مرور لا تقل عن 4 أرقام أو حروف.');
                return;
            }

            try {
                // إظهار شاشة تحميل مؤقتة
                document.getElementById('app').innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-screen text-slate-400 gap-4">
                        <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-500"></i>
                        <span class="font-bold text-lg text-white">جاري الاتصال بالسيرفر...</span>
                    </div>`;

                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: name, pin: pin })
                });
                
                const data = await response.json();

                if (data.success) {
                    currentUser = data.user;
                    localStorage.setItem('oracle_current_user_v8', JSON.stringify(currentUser));
                    
                    document.getElementById('app').innerHTML = `
                        <div class="flex flex-col items-center justify-center min-h-screen text-slate-400 gap-4">
                            <i class="fa-solid fa-cloud-arrow-down fa-spin text-4xl text-blue-500"></i>
                            <span class="font-bold text-lg text-white">Goal Sniper</span>
                            <span class="font-bold text-sm">جاري مزامنة جدول المباريات الرسمي...</span>
                        </div>`;
                    
                    await syncData(); 
                    render();    
                } else {
                    showCustomDialog(data.message || 'خطأ في الدخول.');
                    render(); // العودة لشاشة الدخول
                }
            } catch (error) {
                console.error("Auth Error:", error);
                showCustomDialog('تعذر الاتصال بالسيرفر. تأكد من اتصال الإنترنت لديك.');
                render();
            }
        }

        function logout() { currentUser = null; localStorage.removeItem('oracle_current_user_v8'); render(); }
        function switchTab(tab) { currentTab = tab; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function renderAuthScreen() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4 w-full bg-cover bg-center relative">
                    <div class="glass max-w-md w-full p-6 md:p-8 rounded-3xl shadow-2xl border border-white/10 animate-fade-up relative z-10">
                        <div class="text-center mb-6">
                            <div class="inline-block p-4 rounded-full bg-blue-500/10 mb-3 border border-blue-500/30">
                                <i class="fa-solid fa-crosshairs text-4xl text-blue-500"></i>
                            </div>
                            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-amber-400 tracking-wider">Goal Sniper</h1>
                            <p class="text-xs text-slate-400 mt-2 font-bold">منصة التوقعات الأقوى للدوري الإنجليزي الممتاز</p>
                        </div>
                        
                        <div class="flex gap-2 mb-6 bg-slate-900/50 p-1.5 rounded-xl border border-white/5">
                            <button type="button" onclick="setAuthMode('login')" class="flex-1 py-2.5 text-xs font-bold rounded-lg transition-all ${authMode === 'login' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}">تسجيل الدخول</button>
                            <button type="button" onclick="setAuthMode('register')" class="flex-1 py-2.5 text-xs font-bold rounded-lg transition-all ${authMode === 'register' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}">حساب جديد</button>
                        </div>

                        <form onsubmit="handleAuth(event)" class="space-y-4">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 mb-1">اسم المستخدم</label>
                                <input type="text" id="auth-name" placeholder="مثال: Ahmed99" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500 transition-all" required />
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 mb-1">كلمة المرور (الرمز السري)</label>
                                <input type="password" id="auth-pin" placeholder="4 أرقام أو حروف على الأقل" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500 transition-all" required />
                            </div>
                            
                            ${authMode === 'register' ? `
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-400 mb-1">تأكيد كلمة المرور</label>
                                    <input type="password" id="auth-pin-confirm" placeholder="أعد كتابة الرمز السري" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500 transition-all" required />
                                </div>
                            ` : ''}

                            <button type="submit" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-blue-500/20 mt-4 transition-all active:scale-95 text-sm tracking-wide">
                                ${authMode === 'login' ? 'دخول إلى المنصة <i class="fa-solid fa-arrow-left mr-2"></i>' : 'إنشاء الحساب والبدء <i class="fa-solid fa-check mr-2"></i>'}
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            if (!currentUser) { app.innerHTML = renderAuthScreen(); return; }

            app.innerHTML = `
                <header class="p-4 glass sticky top-0 z-40 border-b border-white/10 flex justify-between items-center shadow-lg bg-[#0a0e17]/90 backdrop-blur-xl">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center font-black text-white shadow-lg shadow-blue-500/30 text-lg border border-white/10">${currentUser.username.substring(0, 1).toUpperCase()}</div>
                        <div>
                            <h1 class="text-sm font-bold text-slate-200 tracking-wide">Goal Sniper</h1>
                            <p class="text-[9px] text-emerald-400 font-bold"><i class="fa-solid fa-circle text-[6px] animate-pulse"></i> متصل بالسيرفر المباشر</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        ${currentUser.username.toLowerCase() === 'red army' ? `<button onclick="switchTab('admin')" class="px-3 py-1.5 bg-rose-600/20 border border-rose-500/30 rounded-xl text-rose-300 text-xs font-bold hover:bg-rose-600 hover:text-white transition-all"><i class="fa-solid fa-shield-halved"></i> الإدارة</button>` : ''}
                        <button onclick="logout()" class="p-2 glass text-rose-400 rounded-xl hover:bg-rose-600 hover:text-white transition-all border-rose-500/20"><i class="fa-solid fa-power-off"></i></button>
                    </div>
                </header>

                <main class="flex-1 max-w-4xl w-full mx-auto p-4 animate-fade-up pb-20">
                    ${currentTab === 'home' ? renderHomeTab() : ''}
                    ${currentTab === 'matches' ? renderMatchesTab() : ''}
                    ${currentTab === 'standings' ? renderStandingsTab() : ''}
                    ${currentTab === 'minileagues' ? renderMiniLeaguesTab() : ''}
                    ${currentTab === 'rules' ? renderRulesTab() : ''}
                    ${currentTab === 'admin' && currentUser.username.toLowerCase() === 'red army' ? renderAdminTab() : ''}
                </main>

                <nav class="fixed bottom-0 left-0 right-0 glass border-t border-white/10 p-2 flex justify-around items-center z-40 bg-[#060b19]/95 backdrop-blur-xl pb-[calc(8px+env(safe-area-inset-bottom))] pt-2">
                    <button onclick="switchTab('home')" class="flex flex-col items-center gap-1.5 px-3 py-1 rounded-xl transition-all ${currentTab === 'home' ? 'text-blue-400 bg-blue-500/10' : 'text-slate-400 hover:text-slate-200'}"><i class="fa-solid fa-house text-lg"></i><span class="text-[9px] font-bold">الرئيسية</span></button>
                    <button onclick="switchTab('matches')" class="flex flex-col items-center gap-1.5 px-3 py-1 rounded-xl transition-all ${currentTab === 'matches' ? 'text-blue-400 bg-blue-500/10' : 'text-slate-400 hover:text-slate-200'}"><i class="fa-solid fa-calendar-days text-lg"></i><span class="text-[9px] font-bold">المباريات</span></button>
                    <button onclick="switchTab('standings')" class="flex flex-col items-center gap-1.5 px-3 py-1 rounded-xl transition-all ${currentTab === 'standings' ? 'text-blue-400 bg-blue-500/10' : 'text-slate-400 hover:text-slate-200'}"><i class="fa-solid fa-trophy text-lg"></i><span class="text-[9px] font-bold">الترتيب</span></button>
                    <button onclick="switchTab('minileagues')" class="flex flex-col items-center gap-1.5 px-3 py-1 rounded-xl transition-all ${currentTab === 'minileagues' ? 'text-blue-400 bg-blue-500/10' : 'text-slate-400 hover:text-slate-200'}"><i class="fa-solid fa-users text-lg"></i><span class="text-[9px] font-bold">الدوريات</span></button>
                    <button onclick="switchTab('rules')" class="flex flex-col items-center gap-1.5 px-3 py-1 rounded-xl transition-all ${currentTab === 'rules' ? 'text-blue-400 bg-blue-500/10' : 'text-slate-400 hover:text-slate-200'}"><i class="fa-solid fa-scale-balanced text-lg"></i><span class="text-[9px] font-bold">القوانين</span></button>
                </nav>
            `;
            renderModal();
        }

        window.onload = async function() {
            currentUser = JSON.parse(localStorage.getItem('oracle_current_user_v8') || 'null');
            if (currentUser) {
                document.getElementById('app').innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-screen text-slate-400 gap-4">
                        <i class="fa-solid fa-satellite-dish fa-spin text-4xl text-blue-500"></i>
                        <span class="font-bold text-lg text-white">Goal Sniper</span>
                        <span class="font-bold text-sm">جاري تحميل جدول المباريات الرسمي...</span>
                    </div>`;
                await syncData(); 
            }
            render();
        };
        async function fireSniper(leagueCode, victimName, penaltyPoints, gw) {
    const confirmShot = confirm(`🎯 تأكيد القنص:\nهل أنت متأكد أنك تريد قنص [ ${victimName} ] وخصم ${penaltyPoints} نقاط منه؟\n\nتذكر: الميزة تستخدم مرة واحدة فقط في الجولة!`);
    
    if (!confirmShot) return;

    try {
        const res = await fetch(`${API_BASE_URL}/sniper/shoot`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                leagueCode: leagueCode,
                gw: gw,
                sniper: currentUser.username,
                victim: victimName,
                pointsDeducted: penaltyPoints
            })
        });
        
        const json = await res.json();
        if (json.success) {
            alert(`🔥 تمت العملية بنجاح!\nتم إرسال رصاصة القناص نحو ${victimName}.`);
            if(typeof syncData === 'function') syncData(); 
        } else {
            alert(json.message || "⚠️ فشلت عملية القنص، ربما استخدمته مسبقاً!");
        }
    } catch (e) {
        alert("❌ لا يمكن الاتصال بالسيرفر حالياً. جرب لاحقاً.");
    }
}
    </script>
