<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عرّاف الدوري - نظام التوقعات الذكي</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        deep: '#0a0e17', card: '#131b2e', primary: '#3b82f6',
                        crimson: '#8b0000', gold: '#f59e0b', accent: '#10b981'
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0a0e17; color: #f8fafc;
            background-image: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 90% 95%, rgba(139, 0, 0, 0.3) 0%, transparent 50%);
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
        }
        .glass {
            background: rgba(19, 27, 46, 0.75); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .score-input {
            width: 48px; height: 48px; text-align: center; font-size: 1.2rem; font-weight: bold;
            background: #0a0e17; border: 1px solid rgba(255, 255, 255, 0.15); color: white;
            border-radius: 12px; outline: none; transition: all 0.3s;
        }
        .score-input:focus { border-color: #3b82f6; box-shadow: 0 0 12px rgba(59, 130, 246, 0.4); }
        .bottom-nav-pb { padding-bottom: calc(95px + env(safe-area-inset-bottom)); }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.35s ease forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col bottom-nav-pb">

    <div id="app" class="flex-1 flex flex-col">
        <div class="flex items-center justify-center min-h-screen text-slate-400">جاري تحميل عرّاف الدوري الإنجليزي...</div>
    </div>

    <!-- Modal Container -->
    <div id="modal-container"></div>
    
    <!-- Custom Dialog Container -->
    <div id="dialog-container"></div>

    <script>
        // 👇=== ضع رقم الـ IP الخاص بسيرفر Contabo هنا ===👇
        const API_BASE_URL = 'http://5.189.138.161:5000/api'; 

        const TEAMS = [
            { code: 'ARS', name: 'آرسنال' }, { code: 'MCI', name: 'مانشستر سيتي' },
            { code: 'LIV', name: 'ليفربول' }, { code: 'MUN', name: 'مانشستر يونايتد' },
            { code: 'CHE', name: 'تشيلسي' }, { code: 'TOT', name: 'توتنهام' },
            { code: 'NEW', name: 'نيوكاسل يونايتد' }, { code: 'AVL', name: 'أستون فيلا' },
            { code: 'BHA', name: 'برايتون' }, { code: 'COV', name: 'كوفنتري سيتي' },
            { code: 'HUL', name: 'هال سيتي' }, { code: 'NFO', name: 'نوتينغهام فورست' },
            { code: 'LEE', name: 'ليدز يونايتد' }, { code: 'IPS', name: 'إيبسويتش تاون' },
            { code: 'SUN', name: 'سندرلاند' }, { code: 'CRY', name: 'كريستال بالاس' },
            { code: 'BRE', name: 'برينتفورد' }, { code: 'FUL', name: 'فولهام' },
            { code: 'BOU', name: 'بورنموث' }, { code: 'EVE', name: 'إيفرتون' }
        ];
        const BIG_TEAMS = ['ARS', 'MCI', 'LIV', 'MUN', 'CHE', 'TOT'];

        const getTeamName = (code) => TEAMS.find(t => t.code === code)?.name || code;
        
        const getMatchType = (h, a) => {
            const hB = BIG_TEAMS.includes(h), aB = BIG_TEAMS.includes(a);
            if (hB && aB) return { label: '👑 قمة الكبار', color: 'text-yellow-400' };
            if (!hB && !aB) return { label: '⚽ مباراة متكافئة', color: 'text-gray-400' };
            return { label: '🌟 الكبار ضد الطموحين', color: 'text-blue-400' };
        };

        const INITIAL_MATCHES = [
            { id: 'm1_1', gw: 1, home: 'ARS', away: 'COV', date: '2026/08/21', time: '10:00 م', actualH: null, actualA: null },
            { id: 'm1_2', gw: 1, home: 'HUL', away: 'MUN', date: '2026/08/22', time: '2:30 م', actualH: null, actualA: null },
            { id: 'm1_3', gw: 1, home: 'NFO', away: 'LEE', date: '2026/08/22', time: '5:00 م', actualH: null, actualA: null },
            { id: 'm1_4', gw: 1, home: 'IPS', away: 'SUN', date: '2026/08/22', time: '5:00 م', actualH: null, actualA: null },
            { id: 'm1_5', gw: 1, home: 'EVE', away: 'CRY', date: '2026/08/22', time: '5:00 م', actualH: null, actualA: null },
            { id: 'm1_6', gw: 1, home: 'BRE', away: 'TOT', date: '2026/08/22', time: '7:30 م', actualH: null, actualA: null },
            { id: 'm1_7', gw: 1, home: 'MCI', away: 'BOU', date: '2026/08/23', time: '4:00 م', actualH: null, actualA: null },
            { id: 'm1_8', gw: 1, home: 'BHA', away: 'AVL', date: '2026/08/23', time: '4:00 م', actualH: null, actualA: null },
            { id: 'm1_9', gw: 1, home: 'NEW', away: 'LIV', date: '2026/08/23', time: '6:30 م', actualH: null, actualA: null },
            { id: 'm1_10', gw: 1, home: 'FUL', away: 'CHE', date: '2026/08/24', time: '10:00 م', actualH: null, actualA: null },
            
            { id: 'm2_1', gw: 2, home: 'CRY', away: 'MCI', date: '2026/08/28', time: '10:00 م', actualH: null, actualA: null },
            { id: 'm2_2', gw: 2, home: 'LIV', away: 'NFO', date: '2026/08/29', time: '2:30 م', actualH: null, actualA: null },
            { id: 'm2_3', gw: 2, home: 'COV', away: 'HUL', date: '2026/08/29', time: '5:00 م', actualH: null, actualA: null },
            { id: 'm2_4', gw: 2, home: 'BOU', away: 'EVE', date: '2026/08/29', time: '5:00 م', actualH: null, actualA: null },
            { id: 'm2_5', gw: 2, home: 'TOT', away: 'NEW', date: '2026/08/29', time: '7:30 م', actualH: null, actualA: null },
            { id: 'm2_6', gw: 2, home: 'SUN', away: 'FUL', date: '2026/08/30', time: '4:00 م', actualH: null, actualA: null },
            { id: 'm2_7', gw: 2, home: 'LEE', away: 'BRE', date: '2026/08/30', time: '4:00 م', actualH: null, actualA: null },
            { id: 'm2_8', gw: 2, home: 'CHE', away: 'BHA', date: '2026/08/30', time: '4:00 م', actualH: null, actualA: null },
            { id: 'm2_9', gw: 2, home: 'MUN', away: 'IPS', date: '2026/08/30', time: '6:30 م', actualH: null, actualA: null },
            { id: 'm2_10', gw: 2, home: 'AVL', away: 'ARS', date: '2026/08/31', time: '10:00 م', actualH: null, actualA: null }
        ];

        let users = [], currentUser = null, matches = INITIAL_MATCHES, predictions = {}, miniLeagues = [];
        try {
            // استرداد البيانات المحلية لتشغيل الواجهة مؤقتاً
            users = JSON.parse(localStorage.getItem('oracle_users_v8') || 'null') || [];
            currentUser = JSON.parse(localStorage.getItem('oracle_current_user_v8') || 'null');
            matches = JSON.parse(localStorage.getItem('oracle_matches_v8') || 'null') || INITIAL_MATCHES;
            predictions = JSON.parse(localStorage.getItem('oracle_predictions_v8') || 'null') || {};
            miniLeagues = JSON.parse(localStorage.getItem('oracle_minileagues_v8') || 'null') || [];
        } catch (e) {
            console.error('Storage error:', e);
        }

        let currentTab = 'home';
        let authMode = 'login';
        let activeMatchModal = null;

        function saveState() {
            try {
                // دمج البيانات مع LocalStorage للعمل المؤقت لحين استكمال برمجة قاعدة البيانات
                if (currentUser && !users.find(u => u.username === currentUser.username)) {
                    users.push(currentUser);
                }
                localStorage.setItem('oracle_users_v8', JSON.stringify(users));
                localStorage.setItem('oracle_current_user_v8', JSON.stringify(currentUser));
                localStorage.setItem('oracle_matches_v8', JSON.stringify(matches));
                localStorage.setItem('oracle_predictions_v8', JSON.stringify(predictions));
                localStorage.setItem('oracle_minileagues_v8', JSON.stringify(miniLeagues));
            } catch (e) {
                console.error('Save state error:', e);
            }
        }

        const calcPoints = (homeCode, awayCode, predH, predA, actualH = null, actualA = null, isCaptain = false, isTripleCaptain = false, isShield = false) => {
            if (predH === '' || predA === '' || predH === null || predA === null) return 0;
            const ph = Number(predH), pa = Number(predA);
            const homeIsBig = BIG_TEAMS.includes(homeCode);
            const awayIsBig = BIG_TEAMS.includes(awayCode);

            let ah = actualH !== null ? Number(actualH) : ph;
            let aa = actualA !== null ? Number(actualA) : pa;

            const isExact = (ph === ah && pa === aa);
            const isOutcomeCorrect = (ph > pa && ah > aa) || (ph < pa && ah < aa) || (ph === pa && ah === aa);
            const isDraw = (ah === aa);
            const totalGoals = ah + aa;

            let pts = 0;

            if (isOutcomeCorrect || isExact) {
                if (!homeIsBig && !awayIsBig) {
                    if (isExact) pts = (totalGoals >= 5 || (ah === 0 && aa === 0)) ? 4 : 3;
                    else if (isOutcomeCorrect) pts = 1;
                } else if (homeIsBig && awayIsBig) {
                    if (isDraw) pts = isExact ? 3 : 2;
                    else pts = isExact ? 5 : 3;
                } else {
                    const bigWon = (homeIsBig && ah > aa) || (awayIsBig && aa > ah);
                    const bigLost = (homeIsBig && ah < aa) || (awayIsBig && aa < ah);
                    if (isDraw) pts = isExact ? 3 : 2;
                    else if (bigWon) pts = isExact ? 2 : 1;
                    else if (bigLost) pts = isExact ? 6 : 4;
                }
            }

            if (pts === 0 && isShield) return 1; 
            if (isTripleCaptain) return pts * 3; 
            if (isCaptain) return pts * 2; 
            
            return pts;
        };

        function getGlobalStandings() {
            const statsMap = {};
            users.forEach(u => { 
                statsMap[u.username] = { 
                    username: u.username, totalPts: 0, predictedCount: 0,
                    correctOutcomes: 0, playedMatches: 0,
                    teamPoints: {}, exactsPerGw: {}, gwPoints: {},
                    badges: { sniper: false, giantSlayer: false, motw: false }
                }; 
            });

            matches.forEach(m => {
                const isPlayed = m.actualH !== null && m.actualA !== null;
                users.forEach(u => {
                    const p = (predictions[u.username] || {})[m.id];
                    const userStats = statsMap[u.username];
                    if (userStats && p && p.home !== '' && p.away !== '') {
                        userStats.predictedCount++;
                        if (isPlayed) {
                            userStats.playedMatches++;
                            const pts = calcPoints(m.home, m.away, p.home, p.away, m.actualH, m.actualA, p.isCaptain, p.isTripleCaptain, p.isShield);
                            userStats.totalPts += pts;
                            
                            const isOutcomeCorrect = (p.home > p.away && m.actualH > m.actualA) || (p.home < p.away && m.actualH < m.actualA) || (p.home === p.away && m.actualH === m.actualA);
                            if (isOutcomeCorrect) userStats.correctOutcomes++;

                            userStats.teamPoints[m.home] = (userStats.teamPoints[m.home] || 0) + pts;
                            userStats.teamPoints[m.away] = (userStats.teamPoints[m.away] || 0) + pts;
                            userStats.gwPoints[m.gw] = (userStats.gwPoints[m.gw] || 0) + pts;
                            
                            if (Number(p.home) === m.actualH && Number(p.away) === m.actualA) {
                                userStats.exactsPerGw[m.gw] = (userStats.exactsPerGw[m.gw] || 0) + 1;
                                if (userStats.exactsPerGw[m.gw] >= 3) userStats.badges.sniper = true;
                            }

                            const homeIsBig = BIG_TEAMS.includes(m.home), awayIsBig = BIG_TEAMS.includes(m.away);
                            const bigLost = (homeIsBig && m.actualH < m.actualA) || (awayIsBig && m.actualA < m.actualH);
                            if (bigLost && isOutcomeCorrect) userStats.badges.giantSlayer = true;
                        }
                    }
                });
            });

            const activeGw = getCurrentActiveGw();
            const prevGw = activeGw > 1 ? activeGw - 1 : 1;
            let highestGwPts = -1;
            let motwUser = null;
            
            Object.values(statsMap).forEach(userStats => {
                const pts = userStats.gwPoints[prevGw] || 0;
                if (pts > highestGwPts && pts > 0) { highestGwPts = pts; motwUser = userStats.username; }
            });
            if (motwUser) statsMap[motwUser].badges.motw = true;

            Object.values(statsMap).forEach(userStats => {
                userStats.hitRate = userStats.playedMatches > 0 ? Math.round((userStats.correctOutcomes / userStats.playedMatches) * 100) : 0;
                let bestTeam = '-', maxTeamPts = -1;
                for (const [team, pts] of Object.entries(userStats.teamPoints)) {
                    if (pts > maxTeamPts) { maxTeamPts = pts; bestTeam = getTeamName(team); }
                }
                userStats.favTeam = maxTeamPts > 0 ? bestTeam : '-';
            });

            return Object.values(statsMap).sort((a, b) => b.totalPts - a.totalPts);
        }

        function isMatchLocked(match) {
            try {
                if (match.actualH !== null && match.actualA !== null) return true;
                const [year, month, day] = match.date.split('/');
                let [timeStr, period] = match.time.split(' ');
                let [hours, minutes] = timeStr.split(':');
                hours = parseInt(hours, 10);
                if (period === 'م' && hours !== 12) hours += 12;
                if (period === 'ص' && hours === 12) hours = 0;
                const matchDate = new Date(year, month - 1, day, hours, minutes);
                const now = new Date();
                return (matchDate - now) <= 60 * 60 * 1000;
            } catch(e) { return false; }
        }

        function getCurrentActiveGw() {
            for (let gw = 1; gw <= 38; gw++) {
                const gwMatches = matches.filter(m => m.gw === gw);
                if (gwMatches.length === 0) continue;
                if (!gwMatches.every(m => m.actualH !== null && m.actualA !== null)) return gw;
            }
            return 1;
        }

        function renderHomeTab() {
            const activeGw = getCurrentActiveGw();
            const prevGw = activeGw > 1 ? activeGw - 1 : null;
            const gwMatches = matches.filter(m => m.gw === activeGw);
            const userPreds = predictions[currentUser.username] || {};
            const standings = getGlobalStandings();
            const myStats = standings.find(u => u.username === currentUser.username) || { totalPts: 0, hitRate: 0, favTeam: '-', badges: {} };
            const myRank = standings.findIndex(u => u.username === currentUser.username) + 1 || '-';
            const motw = prevGw ? standings.find(u => u.badges.motw) : null;

            return `
                <div class="space-y-6">
                    ${motw ? `
                        <div class="glass p-4 rounded-3xl bg-gradient-to-r from-amber-500/20 to-amber-700/20 border border-amber-500/30 flex items-center justify-between shadow-[0_0_15px_rgba(245,158,11,0.2)]">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 bg-amber-500 rounded-full flex items-center justify-center text-xl shadow-lg shadow-amber-500/40">👑</div>
                                <div>
                                    <h3 class="text-xs font-bold text-amber-500">عراف الأسبوع (الجولة ${prevGw})</h3>
                                    <span class="text-base font-black text-white">${motw.username}</span>
                                </div>
                            </div>
                            <div class="text-center">
                                <span class="block text-2xl font-black text-amber-400">${motw.gwPoints[prevGw]}</span>
                                <span class="text-[10px] text-slate-300">نقطة</span>
                            </div>
                        </div>
                    ` : ''}

                    <div class="glass p-5 md:p-6 rounded-3xl relative overflow-hidden border border-blue-500/20 shadow-xl bg-gradient-to-br from-indigo-950/60 via-[#131b2e] to-blue-950/50">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <span class="text-xs font-bold text-blue-400 bg-blue-600/20 px-3 py-1 rounded-full border border-blue-500/30">بطاقة العرّاف الشخصية</span>
                                <h2 class="text-xl md:text-2xl font-black mt-2 text-white flex items-center gap-2">
                                    ${currentUser.username}
                                    ${myStats.badges.motw ? '<span title="عراف الأسبوع" class="text-amber-400 text-lg"><i class="fa-solid fa-fire"></i></span>' : ''}
                                    ${myStats.badges.sniper ? '<span title="القناص" class="text-emerald-400 text-lg"><i class="fa-solid fa-crosshairs"></i></span>' : ''}
                                    ${myStats.badges.giantSlayer ? '<span title="قاهر الكبار" class="text-rose-400 text-lg"><i class="fa-solid fa-shield-halved"></i></span>' : ''}
                                </h2>
                            </div>
                            <div class="text-left">
                                <span class="text-[10px] text-slate-400 block">الترتيب العام</span>
                                <span class="text-lg md:text-xl font-black text-amber-400">#${myRank}</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center mb-3">
                            <div class="bg-slate-900/60 p-3 rounded-2xl border border-white/5">
                                <span class="text-[10px] text-slate-400 block mb-1">المجموع الكلي</span>
                                <span class="text-lg font-black text-amber-400">${myStats.totalPts}</span>
                            </div>
                            <div class="bg-slate-900/60 p-3 rounded-2xl border border-white/5">
                                <span class="text-[10px] text-slate-400 block mb-1">معدل الدقة</span>
                                <span class="text-lg font-black text-emerald-400">${myStats.hitRate}%</span>
                            </div>
                            <div class="bg-slate-900/60 p-3 rounded-2xl border border-white/5 col-span-2">
                                <span class="text-[10px] text-slate-400 block mb-1">الفريق المفضل للتوقع</span>
                                <span class="text-base font-black text-blue-300 truncate block">${myStats.favTeam}</span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-base md:text-lg flex items-center gap-2"><i class="fa-solid fa-fire text-amber-400"></i> مباريات الجولة الحالية (${activeGw})</h3>
                            <button onclick="switchTab('matches')" class="text-xs text-blue-400 hover:underline font-semibold">عرض كل الجولات <i class="fa-solid fa-arrow-left mr-1"></i></button>
                        </div>
                        <div class="space-y-3">
                            ${gwMatches.map(match => {
                                const pred = userPreds[match.id] || { home: '', away: '', isCaptain: false, isTripleCaptain: false, isShield: false };
                                const matchType = getMatchType(match.home, match.away);
                                const isPredicted = pred.home !== '' && pred.away !== '' && pred.home !== null && pred.away !== null;
                                const isLocked = isMatchLocked(match);
                                let badgeHtml = '';
                                if (pred.isTripleCaptain) badgeHtml = `<div class="absolute top-3 left-3 bg-fuchsia-600 text-white px-2 py-0.5 rounded-lg font-black text-[10px]"><i class="fa-solid fa-bolt"></i> x3</div>`;
                                else if (pred.isShield) badgeHtml = `<div class="absolute top-3 left-3 bg-sky-500 text-white w-6 h-6 rounded-full flex justify-center items-center font-black text-[10px]"><i class="fa-solid fa-shield"></i></div>`;
                                else if (pred.isCaptain) badgeHtml = `<div class="absolute top-3 left-3 bg-amber-500 text-black w-6 h-6 rounded-full flex justify-center items-center font-black text-xs">C</div>`;
                                return `
                                    <div class="glass p-4 rounded-2xl flex flex-col gap-3 shadow-md relative ${isLocked ? 'opacity-80' : ''}">
                                        ${badgeHtml}
                                        <div class="flex justify-between items-center text-xs text-slate-400 border-b border-white/5 pb-2">
                                            <span class="font-bold ${matchType.color}">${matchType.label}</span>
                                            <span class="${isLocked ? 'text-rose-400' : ''}"><i class="far fa-${isLocked ? 'lock' : 'calendar-alt'} ml-1"></i> ${isLocked ? 'مقفلة' : `${match.date} - ${match.time}`}</span>
                                        </div>
                                        <div class="flex items-center justify-between">
                                            <div class="flex-1 text-left font-bold text-sm text-slate-200">${getTeamName(match.home)}</div>
                                            <div class="px-3">
                                                <button ${isLocked ? 'disabled' : `onclick="openModal('${match.id}')"`} class="px-4 py-2 ${isPredicted ? 'bg-blue-600/20 text-blue-300' : 'bg-blue-600 text-white'} ${isLocked ? 'opacity-50 cursor-not-allowed bg-slate-800' : ''} font-bold text-xs rounded-xl transition-all">
                                                    ${isPredicted ? `${pred.home} - ${pred.away}` : (isLocked ? '<i class="fa-solid fa-lock"></i>' : 'توقع الآن')}
                                                </button>
                                            </div>
                                            <div class="flex-1 text-right font-bold text-sm text-slate-200">${getTeamName(match.away)}</div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMatchesTab() {
            const userPreds = predictions[currentUser.username] || {};
            return `
                <div class="space-y-6">
                    <div class="glass p-4 rounded-2xl">
                        <h2 class="text-lg font-bold mb-1 flex items-center gap-2"><i class="fa-solid fa-calendar-days text-blue-400"></i> جدول مباريات الدوري (38 جولة)</h2>
                    </div>
                    ${Array.from({ length: 38 }, (_, i) => i + 1).map(gw => {
                        const gwMatches = matches.filter(m => m.gw === gw);
                        if (gwMatches.length === 0) return '';
                        return `
                            <div class="glass p-4 rounded-2xl space-y-3">
                                <h3 class="font-black text-sm text-blue-400 border-b border-white/10 pb-2">الجولة ${gw}</h3>
                                <div class="space-y-2">
                                    ${gwMatches.map(match => {
                                        const pred = userPreds[match.id] || { home: '', away: '' };
                                        const isPredicted = pred.home !== '' && pred.away !== '' && pred.home !== null;
                                        const isLocked = isMatchLocked(match);
                                        return `
                                            <div class="bg-slate-900/60 p-3 rounded-xl flex items-center justify-between border border-white/5 ${isLocked ? 'opacity-70' : ''}">
                                                <div class="flex-1 text-left font-bold text-xs text-slate-200">${getTeamName(match.home)}</div>
                                                <div class="px-2">
                                                    <button ${isLocked ? 'disabled' : `onclick="openModal('${match.id}')"`} class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${isPredicted ? 'bg-blue-600/20 text-blue-300' : 'bg-slate-800 text-slate-300'}">
                                                        ${isPredicted ? `${pred.home} - ${pred.away}` : (isLocked ? '<i class="fa-solid fa-lock"></i>' : 'توقع')}
                                                    </button>
                                                </div>
                                                <div class="flex-1 text-right font-bold text-xs text-slate-200">${getTeamName(match.away)}</div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderStandingsTab() {
            const standings = getGlobalStandings();
            return `
                <div class="glass p-4 rounded-3xl space-y-4">
                    <h2 class="text-lg font-bold flex items-center gap-2 border-b border-white/10 pb-3"><i class="fa-solid fa-trophy text-amber-400"></i> الترتيب العام</h2>
                    <div class="space-y-2">
                        ${standings.map((user, idx) => `
                            <div class="p-3 rounded-2xl flex items-center justify-between border ${user.username === currentUser.username ? 'bg-blue-600/20 border-blue-500/50' : 'bg-slate-900/60 border-white/5'}">
                                <div class="flex items-center gap-3">
                                    <span class="w-8 h-8 rounded-xl flex items-center justify-center font-black text-xs bg-slate-800 text-slate-300">#${idx + 1}</span>
                                    <div>
                                        <h4 class="font-bold text-sm text-slate-100 flex items-center gap-1.5">
                                            ${user.username}
                                            ${user.badges.motw ? '<span class="text-amber-400"><i class="fa-solid fa-fire"></i></span>' : ''}
                                            ${user.badges.sniper ? '<span class="text-emerald-400"><i class="fa-solid fa-crosshairs"></i></span>' : ''}
                                            ${user.badges.giantSlayer ? '<span class="text-rose-400"><i class="fa-solid fa-shield-halved"></i></span>' : ''}
                                        </h4>
                                        <span class="text-[10px] text-slate-400">دقة: ${user.hitRate}%</span>
                                    </div>
                                </div>
                                <div class="text-left">
                                    <span class="text-base font-black text-amber-400">${user.totalPts}</span>
                                    <span class="text-[10px] text-slate-400 block">نقطة</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderMiniLeaguesTab() {
            const myLeagues = miniLeagues.filter(ml => ml.members.includes(currentUser.username));
            return `
                <div class="space-y-6">
                    <div class="glass p-5 rounded-2xl space-y-4">
                        <h2 class="text-lg font-bold flex items-center gap-2 text-blue-400"><i class="fa-solid fa-users-rectangle"></i> الدوريات المصغرة</h2>
                        <div class="grid grid-cols-1 gap-4 pt-2">
                            <div class="bg-slate-900/60 p-4 rounded-2xl border border-white/5">
                                <input type="text" id="new-ml-name" placeholder="اسم الدوري" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white mb-2" />
                                <button onclick="createMiniLeague()" class="w-full py-2 bg-blue-600 text-white font-bold text-xs rounded-xl">إنشاء وتوليد الكود</button>
                            </div>
                            <div class="bg-slate-900/60 p-4 rounded-2xl border border-white/5">
                                <input type="text" id="join-ml-code" placeholder="أدخل كود الدوري" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white uppercase mb-2" />
                                <button onclick="joinMiniLeague()" class="w-full py-2 bg-emerald-600 text-white font-bold text-xs rounded-xl">الانضمام</button>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <h3 class="font-bold text-sm text-slate-300">دورياتي</h3>
                        ${myLeagues.map(ml => `
                            <div class="glass p-5 rounded-2xl">
                                <div class="flex justify-between items-center border-b border-white/10 pb-2 mb-2">
                                    <h4 class="font-bold text-base text-white">${ml.name}</h4>
                                    <span class="bg-blue-600/20 px-3 py-1 rounded-xl text-xs font-mono text-blue-300">${ml.code}</span>
                                </div>
                                ${ml.members.map(m => `<div class="text-xs text-slate-300 py-1"><i class="fa-solid fa-user mr-2"></i>${m}</div>`).join('')}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderRulesTab() {
            return `
                <div class="glass p-6 rounded-3xl space-y-4">
                    <h2 class="text-xl font-bold flex items-center gap-2 text-amber-400"><i class="fa-solid fa-book-bookmark"></i> قوانين احتساب النقاط</h2>
                    <div class="space-y-3 pt-2">
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-white/5">
                            <h3 class="font-bold text-sm text-slate-200 mb-2">1- مباريات الفرق العادية (عادي ضد عادي)</h3>
                            <ul class="text-xs text-slate-400 space-y-1.5 list-disc list-inside">
                                <li>توقع النتيجة (فوز/تعادل): 1 نقطة</li>
                                <li>النتيجة الرقمية: 3 نقاط (أو 4 نقاط لـ 0-0 ومجموع 5+)</li>
                            </ul>
                        </div>
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-white/5">
                            <h3 class="font-bold text-sm text-blue-400 mb-2">2- الكبار ضد العاديين</h3>
                            <ul class="text-xs text-slate-400 space-y-1.5 list-disc list-inside">
                                <li>فوز الكبير: 1 نقطة | الرقمية: 2 نقطة</li>
                                <li>التعادل: 2 نقطة | الرقمية: 3 نقاط</li>
                                <li>خسارة الكبير: 4 نقاط | الرقمية: 6 نقاط</li>
                            </ul>
                        </div>
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-white/5">
                            <h3 class="font-bold text-sm text-rose-400 mb-2">3- الكبار ضد بعضهم</h3>
                            <ul class="text-xs text-slate-400 space-y-1.5 list-disc list-inside">
                                <li>التعادل: 2 نقطة | الرقمية: 3 نقاط</li>
                                <li>فوز أحدهما: 3 نقاط | الرقمية: 5 نقاط</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAdminTab() {
            const sortedMatches = [...matches].sort((a, b) => a.gw - b.gw);
            return `
                <div class="space-y-6">
                    <div class="glass p-6 rounded-3xl border border-rose-500/30">
                        <h2 class="text-lg font-bold text-rose-400 mb-4"><i class="fa-solid fa-shield-halved"></i> لوحة الإدارة</h2>
                        <div class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                            ${sortedMatches.map(m => `
                                <div class="bg-slate-900/60 p-3 rounded-xl flex items-center justify-between border border-white/5 flex-wrap gap-2">
                                    <div class="text-[10px] text-slate-400 w-full md:w-auto bg-slate-800 rounded px-2 py-1">GW ${m.gw}</div>
                                    <div class="flex-1 flex justify-between items-center gap-2">
                                        <div class="flex-1 text-left font-bold text-xs text-slate-200">${getTeamName(m.home)}</div>
                                        <div class="flex items-center gap-1.5">
                                            <input type="text" id="actual-h-${m.id}" value="${m.actualH !== null ? m.actualH : ''}" class="w-10 h-8 text-center bg-slate-950 border border-white/20 rounded-lg text-xs text-white" />
                                            <span>:</span>
                                            <input type="text" id="actual-a-${m.id}" value="${m.actualA !== null ? m.actualA : ''}" class="w-10 h-8 text-center bg-slate-950 border border-white/20 rounded-lg text-xs text-white" />
                                        </div>
                                        <div class="flex-1 text-right font-bold text-xs text-slate-200">${getTeamName(m.away)}</div>
                                    </div>
                                    <div class="flex items-center gap-1 w-full md:w-auto justify-center">
                                        <button onclick="saveActual('${m.id}')" class="px-3 py-1.5 bg-emerald-600/20 text-emerald-400 rounded-lg text-xs font-bold">تثبيت</button>
                                        <button onclick="clearActual('${m.id}')" class="px-3 py-1.5 bg-slate-700/50 text-slate-300 rounded-lg text-xs font-bold">إلغاء</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function openModal(matchId) { activeMatchModal = matches.find(m => m.id === matchId); renderModal(); }
        function closeModal() { activeMatchModal = null; renderModal(); }

        function renderModal() {
            const container = document.getElementById('modal-container');
            if (!activeMatchModal) { container.innerHTML = ''; return; }
            const pred = (predictions[currentUser.username] || {})[activeMatchModal.id] || { home: '', away: '', isCaptain: false, isTripleCaptain: false, isShield: false };
            
            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="glass max-w-sm w-full p-6 rounded-3xl animate-fade-up space-y-4">
                        <h3 class="text-center font-bold text-white">${getTeamName(activeMatchModal.home)} ضد ${getTeamName(activeMatchModal.away)}</h3>
                        <div class="flex items-center justify-center gap-4">
                            <input type="text" id="modal-pred-h" value="${pred.home !== undefined ? pred.home : ''}" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="score-input" />
                            <span class="text-xl font-bold text-slate-500">:</span>
                            <input type="text" id="modal-pred-a" value="${pred.away !== undefined ? pred.away : ''}" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="score-input" />
                        </div>
                        <div class="space-y-2 bg-slate-900/50 p-3 rounded-2xl border border-white/5">
                            <label class="flex items-center gap-3 cursor-pointer"><input type="radio" name="powerup" value="captain" ${pred.isCaptain ? 'checked' : ''} class="w-4 h-4 accent-amber-500"> <span class="text-xs font-bold text-amber-400">C كابتن (x2)</span></label>
                            <label class="flex items-center gap-3 cursor-pointer"><input type="radio" name="powerup" value="triple" ${pred.isTripleCaptain ? 'checked' : ''} class="w-4 h-4 accent-fuchsia-500"> <span class="text-xs font-bold text-fuchsia-400">الجوكر (x3)</span></label>
                            <label class="flex items-center gap-3 cursor-pointer"><input type="radio" name="powerup" value="shield" ${pred.isShield ? 'checked' : ''} class="w-4 h-4 accent-sky-500"> <span class="text-xs font-bold text-sky-400">درع التأمين</span></label>
                            <label class="flex items-center gap-3 cursor-pointer"><input type="radio" name="powerup" value="none" ${!pred.isCaptain && !pred.isTripleCaptain && !pred.isShield ? 'checked' : ''} class="w-4 h-4 accent-slate-400"> <span class="text-xs font-bold text-slate-300">بدون بطاقات</span></label>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="saveModalPrediction()" class="flex-1 py-3 bg-blue-600 text-white font-bold text-xs rounded-xl">حفظ التوقع</button>
                            <button onclick="closeModal()" class="px-4 py-3 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl">إلغاء</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveModalPrediction() {
            const h = document.getElementById('modal-pred-h').value, a = document.getElementById('modal-pred-a').value;
            const powerup = document.querySelector('input[name="powerup"]:checked')?.value || 'none';
            if (h === '' || a === '') return;
            if (!predictions[currentUser.username]) predictions[currentUser.username] = {};
            
            if (powerup === 'captain') {
                const currentGw = activeMatchModal.gw;
                matches.filter(m => m.gw === currentGw).forEach(m => {
                    if (predictions[currentUser.username][m.id]) predictions[currentUser.username][m.id].isCaptain = false;
                });
            }

            predictions[currentUser.username][activeMatchModal.id] = { 
                home: Number(h), away: Number(a),
                isCaptain: powerup === 'captain', isTripleCaptain: powerup === 'triple', isShield: powerup === 'shield'
            };
            saveState(); closeModal(); render();
        }

        // 👇 اتصال حقيقي بخادم CONTABO للمصادقة 👇
        async function handleAuth(e) {
            e.preventDefault();
            const name = document.getElementById('auth-name').value.trim();
            const pin = document.getElementById('auth-pin').value.trim();
            if (!name || pin.length < 4) { showCustomDialog('أدخل اسم مستخدم وكلمة مرور من 4 أرقام على الأقل'); return; }

            const endpoint = authMode === 'register' ? '/auth/register' : '/auth/login';

            try {
                const response = await fetch(`${API_BASE_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: name, pin: pin })
                });
                
                const data = await response.json();

                if (data.success) {
                    currentUser = data.user;
                    saveState(); // الحفظ المحلي لتشغيل باقي الواجهات مؤقتاً
                    render();
                } else {
                    showCustomDialog(data.message || 'حدث خطأ في التسجيل.');
                }
            } catch (error) {
                console.error("API Error:", error);
                showCustomDialog('لا يمكن الاتصال بالسيرفر. يرجى التأكد من أن سيرفر Contabo يعمل والرقم صحيح.');
            }
        }

        function renderAuthScreen() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4 w-full">
                    <div class="glass max-w-md w-full p-8 rounded-3xl animate-fade-up">
                        <div class="text-center mb-6">
                            <h1 class="text-2xl font-black text-blue-400">عرّاف الدوري</h1>
                            <p class="text-slate-400 text-xs mt-1">متصل بخوادم Contabo الآمنة <i class="fa-solid fa-server text-emerald-400 ml-1"></i></p>
                        </div>
                        <div class="flex bg-slate-900/80 p-1 rounded-xl mb-6">
                            <button onclick="authMode='login'; render();" class="flex-1 py-2 text-xs font-bold rounded-lg ${authMode === 'login' ? 'bg-blue-600 text-white' : 'text-slate-400'}">دخول</button>
                            <button onclick="authMode='register'; render();" class="flex-1 py-2 text-xs font-bold rounded-lg ${authMode === 'register' ? 'bg-blue-600 text-white' : 'text-slate-400'}">جديد</button>
                        </div>
                        <form onsubmit="handleAuth(event)" class="space-y-4">
                            <input type="text" id="auth-name" placeholder="اسم المستخدم" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500" required />
                            <input type="password" id="auth-pin" placeholder="كلمة المرور" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500" required />
                            <button type="submit" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-xl transition-all">${authMode === 'login' ? 'دخول' : 'إنشاء'}</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function logout() { currentUser = null; saveState(); render(); }
        function switchTab(tab) { currentTab = tab; render(); window.scrollTo(0,0); }
        
        function createMiniLeague() {
            const name = document.getElementById('new-ml-name').value.trim();
            if (!name) return;
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            miniLeagues.push({ id: 'ml_' + Date.now(), name, code, creator: currentUser.username, members: [currentUser.username] });
            saveState(); showCustomDialog('كود الدوري: ' + code); render();
        }
        function joinMiniLeague() {
            const code = document.getElementById('join-ml-code').value.trim().toUpperCase();
            const ml = miniLeagues.find(l => l.code === code);
            if (ml && !ml.members.includes(currentUser.username)) { ml.members.push(currentUser.username); saveState(); showCustomDialog('تم الانضمام!'); render(); }
        }
        function saveActual(id) {
            const hVal = document.getElementById(`actual-h-${id}`).value, aVal = document.getElementById(`actual-a-${id}`).value;
            if (hVal !== '' && aVal !== '') {
                const m = matches.find(item => item.id === id);
                if (m) { m.actualH = parseInt(hVal, 10); m.actualA = parseInt(aVal, 10); saveState(); render(); }
            }
        }
        function clearActual(id) {
            const m = matches.find(item => item.id === id);
            if (m) { m.actualH = null; m.actualA = null; saveState(); render(); }
        }
        function showCustomDialog(message, type = 'alert', onConfirm = null) {
            const container = document.getElementById('dialog-container');
            container.innerHTML = `<div class="fixed inset-0 z-[70] bg-black/80 flex items-center justify-center p-4"><div class="glass max-w-xs w-full p-6 text-center"><h3 class="text-sm font-bold text-white mb-6">${message}</h3><button id="diag-close" class="w-full py-2 bg-slate-800 text-white font-bold text-xs rounded-xl">حسناً</button></div></div>`;
            document.getElementById('diag-close').onclick = () => container.innerHTML = '';
        }

        function render() {
            const app = document.getElementById('app');
            if (!currentUser) { app.innerHTML = renderAuthScreen(); return; }

            app.innerHTML = `
                <header class="p-4 glass sticky top-0 z-40 border-b border-white/10 flex justify-between items-center shadow-lg">
                    <div>
                        <h1 class="text-sm font-bold text-slate-200">مرحباً، ${currentUser.username}</h1>
                        <span class="text-[10px] text-emerald-400"><i class="fa-solid fa-server text-[10px]"></i> متصل بـ Contabo</span>
                    </div>
                    <button onclick="logout()" class="p-2 text-rose-400 text-xs"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
                </header>

                <main class="flex-1 max-w-4xl w-full mx-auto p-4 animate-fade-up">
                    ${currentTab === 'home' ? renderHomeTab() : ''}
                    ${currentTab === 'matches' ? renderMatchesTab() : ''}
                    ${currentTab === 'standings' ? renderStandingsTab() : ''}
                    ${currentTab === 'minileagues' ? renderMiniLeaguesTab() : ''}
                    ${currentTab === 'rules' ? renderRulesTab() : ''}
                    ${currentTab === 'admin' && currentUser.username.toLowerCase() === 'red army' ? renderAdminTab() : ''}
                </main>

                <nav class="fixed bottom-0 left-0 right-0 glass border-t border-white/10 p-2 flex justify-around items-center z-40 bg-[#0a0e17]/95">
                    <button onclick="switchTab('home')" class="${currentTab === 'home' ? 'text-blue-400' : 'text-slate-400'} flex flex-col items-center gap-1"><i class="fa-solid fa-house"></i><span class="text-[10px]">الرئيسية</span></button>
                    <button onclick="switchTab('matches')" class="${currentTab === 'matches' ? 'text-blue-400' : 'text-slate-400'} flex flex-col items-center gap-1"><i class="fa-solid fa-futbol"></i><span class="text-[10px]">المباريات</span></button>
                    <button onclick="switchTab('standings')" class="${currentTab === 'standings' ? 'text-blue-400' : 'text-slate-400'} flex flex-col items-center gap-1"><i class="fa-solid fa-ranking-star"></i><span class="text-[10px]">الترتيب</span></button>
                    <button onclick="switchTab('minileagues')" class="${currentTab === 'minileagues' ? 'text-blue-400' : 'text-slate-400'} flex flex-col items-center gap-1"><i class="fa-solid fa-users"></i><span class="text-[10px]">الدوريات</span></button>
                    ${currentUser.username.toLowerCase() === 'red army' ? `<button onclick="switchTab('admin')" class="${currentTab === 'admin' ? 'text-rose-400' : 'text-slate-400'} flex flex-col items-center gap-1"><i class="fa-solid fa-shield-halved"></i><span class="text-[10px]">الإدارة</span></button>` : `<button onclick="switchTab('rules')" class="${currentTab === 'rules' ? 'text-blue-400' : 'text-slate-400'} flex flex-col items-center gap-1"><i class="fa-solid fa-book"></i><span class="text-[10px]">القوانين</span></button>`}
                </nav>
            `;
            renderModal();
        }

        window.onload = render;
    </script>
</body>
</html>
