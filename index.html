<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goal Sniper</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: { deep: '#0a0e17', card: '#131b2e', primary: '#3b82f6' }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #0a0e17; color: #f8fafc; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(19, 27, 46, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .bottom-nav-pb { padding-bottom: calc(95px + env(safe-area-inset-bottom)); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.35s ease forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col bottom-nav-pb">

    <div id="app" class="flex-1 flex flex-col">
        <div class="flex items-center justify-center min-h-screen text-slate-400 gap-3">
            <i class="fa-solid fa-spinner fa-spin text-blue-500 text-2xl"></i> جاري تحميل Goal Sniper...
        </div>
    </div>

    <div id="modal-container"></div>
    <div id="dialog-container"></div>

    <script>
        const API_BASE_URL = 'http://5.189.138.161:5000/api'; 

        const TEAMS = [
            { code: 'ARS', name: 'آرسنال' }, { code: 'MCI', name: 'مانشستر سيتي' },
            { code: 'LIV', name: 'ليفربول' }, { code: 'MUN', name: 'مانشستر يونايتد' },
            { code: 'CHE', name: 'تشيلسي' }, { code: 'TOT', name: 'توتنهام' },
            { code: 'NEW', name: 'نيوكاسل يونايتد' }, { code: 'AVL', name: 'أستون فيلا' },
            { code: 'BHA', name: 'برايتون' }, { code: 'COV', name: 'كوفنتري سيتي' },
            { code: 'HUL', name: 'هال سيتي' }, { code: 'NFO', name: 'نوتينغهام فورست' },
            { code: 'LEE', name: 'ليدز يونايتد' }, { code: 'IPS', name: 'إيبسويتش تاون' },
            { code: 'SUN', name: 'سندرلاند' }, { code: 'CRY', name: 'كريستال بالاس' },
            { code: 'BRE', name: 'برينتفورد' }, { code: 'FUL', name: 'فولهام' },
            { code: 'BOU', name: 'بورنموث' }, { code: 'EVE', name: 'إيفرتون' }
        ];
        const BIG_TEAMS = ['ARS', 'MCI', 'LIV', 'MUN', 'CHE', 'TOT'];
        const getTeamName = (code) => TEAMS.find(t => t.code === code)?.name || code;

        let INITIAL_MATCHES = [];
        let mIdCounter = 1;
        for(let gw = 1; gw <= 38; gw++) {
            let gwTeams = [...TEAMS];
            for(let i = 0; i < 10; i++) {
                INITIAL_MATCHES.push({
                    id: `m${gw}_${i+1}`, gw: gw,
                    home: gwTeams[i*2].code, away: gwTeams[i*2+1].code,
                    date: '2026-08-21', time: '18:00',
                    actualH: null, actualA: null
                });
            }
        }

        let users = [], currentUser = null, matches = INITIAL_MATCHES, predictions = {};
        try {
            users = JSON.parse(localStorage.getItem('oracle_users_v8') || 'null') || [];
            currentUser = JSON.parse(localStorage.getItem('oracle_current_user_v8') || 'null');
            matches = JSON.parse(localStorage.getItem('oracle_matches_v8') || 'null') || INITIAL_MATCHES;
            predictions = JSON.parse(localStorage.getItem('oracle_predictions_v8') || 'null') || {};
        } catch (e) { console.error('Storage error:', e); }

        let currentTab = 'home', activeGwFilter = 1;

        function saveState() {
            try {
                if (currentUser && !users.find(u => u.username === currentUser.username)) users.push(currentUser);
                localStorage.setItem('oracle_users_v8', JSON.stringify(users));
                localStorage.setItem('oracle_current_user_v8', JSON.stringify(currentUser));
                localStorage.setItem('oracle_matches_v8', JSON.stringify(matches));
                localStorage.setItem('oracle_predictions_v8', JSON.stringify(predictions));
            } catch (e) { console.error('Save state error:', e); }
        }

        const getCurrentActiveGw = () => {
            const played = matches.filter(m => m.actualH !== null);
            if(played.length === 0) return 1;
            const maxGw = Math.max(...played.map(m => m.gw));
            const unplayedInMax = matches.filter(m => m.gw === maxGw && m.actualH === null);
            return unplayedInMax.length === 0 ? Math.min(maxGw + 1, 38) : maxGw;
        };

        const calcPoints = (homeCode, awayCode, predH, predA, actualH = null, actualA = null, isCaptain = false, isTripleCaptain = false) => {
            if (predH === '' || predA === '' || predH === null || predA === null) return 0;
            const ph = Number(predH), pa = Number(predA);
            const homeIsBig = BIG_TEAMS.includes(homeCode), awayIsBig = BIG_TEAMS.includes(awayCode);

            let ah = actualH !== null ? Number(actualH) : ph;
            let aa = actualA !== null ? Number(actualA) : pa;

            const isExact = (ph === ah && pa === aa);
            const isOutcomeCorrect = (ph > pa && ah > aa) || (ph < pa && ah < aa) || (ph === pa && ah === aa);
            const isDraw = (ah === aa);
            const totalGoals = ah + aa;

            let pts = 0;
            if (isOutcomeCorrect || isExact) {
                if (!homeIsBig && !awayIsBig) {
                    if (isExact) pts = (totalGoals >= 5 || (ah === 0 && aa === 0)) ? 4 : 3;
                    else if (isOutcomeCorrect) pts = 1;
                } else if (homeIsBig && awayIsBig) {
                    if (isDraw) pts = isExact ? 3 : 2;
                    else pts = isExact ? 5 : 3;
                } else {
                    const bigWon = (homeIsBig && ah > aa) || (awayIsBig && aa > ah);
                    const bigLost = (homeIsBig && ah < aa) || (awayIsBig && aa < ah);
                    if (isDraw) pts = isExact ? 3 : 2;
                    else if (bigWon) pts = isExact ? 2 : 1;
                    else if (bigLost) pts = isExact ? 6 : 4;
                }
            }
            if (isTripleCaptain) return pts * 3; 
            if (isCaptain) return pts * 2; 
            return pts;
        };

        function getGlobalStandings() {
            const statsMap = {};
            users.forEach(u => { 
                statsMap[u.username] = { 
                    username: u.username, totalPts: 0, predictedCount: 0,
                    correctOutcomes: 0, playedMatches: 0, teamPoints: {}, exactsPerGw: {}, gwPoints: {},
                    badges: { sniper: false, giantSlayer: false, motw: false }
                }; 
            });

            matches.forEach(m => {
                const isPlayed = m.actualH !== null && m.actualA !== null;
                users.forEach(u => {
                    const p = (predictions[u.username] || {})[m.id];
                    const userStats = statsMap[u.username];
                    if (userStats && p && p.home !== '' && p.away !== '') {
                        userStats.predictedCount++;
                        if (isPlayed) {
                            userStats.playedMatches++;
                            const pts = calcPoints(m.home, m.away, p.home, p.away, m.actualH, m.actualA, p.isCaptain, p.isTripleCaptain);
                            userStats.totalPts += pts;
                            
                            const ph = Number(p.home), pa = Number(p.away);
                            const isOutcomeCorrect = (ph > pa && m.actualH > m.actualA) || (ph < pa && m.actualH < m.actualA) || (ph === pa && m.actualH === m.actualA);
                            if (isOutcomeCorrect) userStats.correctOutcomes++;

                            userStats.teamPoints[m.home] = (userStats.teamPoints[m.home] || 0) + pts;
                            userStats.teamPoints[m.away] = (userStats.teamPoints[m.away] || 0) + pts;
                            userStats.gwPoints[m.gw] = (userStats.gwPoints[m.gw] || 0) + pts;
                            
                            if (ph === m.actualH && pa === m.actualA) {
                                userStats.exactsPerGw[m.gw] = (userStats.exactsPerGw[m.gw] || 0) + 1;
                                if (userStats.exactsPerGw[m.gw] >= 3) userStats.badges.sniper = true;
                            }

                            const homeIsBig = BIG_TEAMS.includes(m.home), awayIsBig = BIG_TEAMS.includes(m.away);
                            const bigLost = (homeIsBig && m.actualH < m.actualA) || (awayIsBig && m.actualA < m.actualH);
                            if (bigLost && isOutcomeCorrect) userStats.badges.giantSlayer = true;
                        }
                    }
                });
            });

            const activeGw = getCurrentActiveGw();
            const prevGw = activeGw > 1 ? activeGw - 1 : null;
            if (prevGw) {
                let highestGwPts = 0;
                Object.values(statsMap).forEach(s => { if (s.gwPoints[prevGw] > highestGwPts) highestGwPts = s.gwPoints[prevGw]; });
                if (highestGwPts > 0) {
                    Object.values(statsMap).forEach(s => { if ((s.gwPoints[prevGw] || 0) === highestGwPts) s.badges.motw = true; });
                }
            }

            Object.values(statsMap).forEach(userStats => {
                userStats.hitRate = userStats.playedMatches > 0 ? Math.round((userStats.correctOutcomes / userStats.playedMatches) * 100) : 0;
                let bestTeam = '-', maxTeamPts = -1;
                for (const [team, pts] of Object.entries(userStats.teamPoints)) {
                    if (pts > maxTeamPts) { maxTeamPts = pts; bestTeam = getTeamName(team); }
                }
                userStats.favTeam = maxTeamPts > 0 ? bestTeam : '-';
            });

            return Object.values(statsMap).sort((a, b) => b.totalPts - a.totalPts);
        }

        function getUsage(gw) {
            let capUsed = false, tc1Used = false, tc2Used = false;
            Object.keys(predictions[currentUser.username] || {}).forEach(mId => {
                const m = matches.find(x => x.id === mId);
                if(m) {
                    const p = predictions[currentUser.username][mId];
                    if (m.gw === gw && p.isCaptain) capUsed = true;
                    if (m.gw <= 18 && p.isTripleCaptain) tc1Used = true;
                    if (m.gw >= 19 && p.isTripleCaptain) tc2Used = true;
                }
            });
            return { capUsed, tc1Used, tc2Used };
        }

        // --- Dialogs ---
        function showCustomDialog(message, onConfirm = null, showCancel = false, confirmText = 'موافق', cancelText = 'إلغاء') {
            const container = document.getElementById('dialog-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div class="glass p-6 max-w-sm w-full rounded-2xl text-center border border-white/10 shadow-2xl animate-fade-up">
                        <p class="text-slate-200 mb-6 font-bold text-sm leading-relaxed">${message}</p>
                        <div class="flex gap-3 justify-center">
                            <button id="dialog-confirm" class="flex-1 py-2.5 ${showCancel ? 'bg-rose-600 hover:bg-rose-700' : 'bg-blue-600 hover:bg-blue-700'} text-white rounded-xl text-sm font-bold transition-colors">${confirmText}</button>
                            ${showCancel ? `<button id="dialog-cancel" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-bold transition-colors">${cancelText}</button>` : ''}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('dialog-confirm').onclick = () => { container.innerHTML = ''; if (onConfirm) onConfirm(); };
            if (showCancel) document.getElementById('dialog-cancel').onclick = () => { container.innerHTML = ''; };
        }

        function closeMatchModal() { document.getElementById('modal-container').innerHTML = ''; }

        function openMatchModal(mId) {
            const match = matches.find(m => m.id === mId);
            if (!match) return;
            const existing = (predictions[currentUser.username] || {})[match.id] || { home: '', away: '', isCaptain: false, isTripleCaptain: false };
            
            const usage = getUsage(match.gw);
            const canCaptain = existing.isCaptain || !usage.capUsed;
            const tcUsedPhase = match.gw <= 18 ? usage.tc1Used : usage.tc2Used;
            const canTriple = existing.isTripleCaptain || !tcUsedPhase;

            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-40" onclick="if(event.target === this) closeMatchModal()">
                    <div class="glass p-6 w-full max-w-sm rounded-3xl border border-white/10 shadow-2xl relative animate-fade-up">
                        <button onclick="closeMatchModal()" class="absolute top-4 left-4 w-8 h-8 flex items-center justify-center rounded-full bg-white/5 text-slate-400 hover:text-white hover:bg-white/10 transition-colors"><i class="fa-solid fa-xmark"></i></button>
                        <div class="text-center mb-6 mt-2">
                            <span class="inline-block px-3 py-1 bg-blue-500/20 text-blue-400 rounded-full text-xs font-bold mb-2">الجولة ${match.gw}</span>
                        </div>
                        <div class="flex items-center justify-between mb-6">
                            <div class="flex-1 text-center"><div class="font-bold text-slate-200 text-sm mb-2 truncate">${getTeamName(match.home)}</div><input type="text" inputmode="numeric" id="pred-h" value="${existing.home}" oninput="updateModalCalc('${match.home}', '${match.away}')" class="w-16 h-16 text-center bg-slate-900 border border-white/10 rounded-2xl text-2xl text-white font-black outline-none focus:border-blue-500 transition-all mx-auto shadow-inner" placeholder="0"></div>
                            <div class="w-8 text-center text-slate-500 font-bold text-xl">-</div>
                            <div class="flex-1 text-center"><div class="font-bold text-slate-200 text-sm mb-2 truncate">${getTeamName(match.away)}</div><input type="text" inputmode="numeric" id="pred-a" value="${existing.away}" oninput="updateModalCalc('${match.home}', '${match.away}')" class="w-16 h-16 text-center bg-slate-900 border border-white/10 rounded-2xl text-2xl text-white font-black outline-none focus:border-blue-500 transition-all mx-auto shadow-inner" placeholder="0"></div>
                        </div>

                        <div class="space-y-2 mb-6">
                            <label class="flex items-center gap-3 p-3 rounded-xl border ${canCaptain ? 'bg-slate-800/50 border-white/10' : 'bg-slate-900/50 border-white/5 opacity-50'}">
                                <input type="checkbox" id="pred-cap" onchange="updateModalCalc('${match.home}', '${match.away}')" class="w-5 h-5 rounded accent-blue-500" ${existing.isCaptain ? 'checked' : ''} ${canCaptain ? '' : 'disabled'}>
                                <div class="flex-1">
                                    <div class="text-sm font-bold text-white flex items-center gap-2">الكابتن (x2) <i class="fa-solid fa-copyright text-blue-400"></i></div>
                                    <div class="text-[10px] text-slate-400">متاح مرة واحدة لكل جولة</div>
                                </div>
                            </label>
                            
                            <label class="flex items-center gap-3 p-3 rounded-xl border ${canTriple ? 'bg-slate-800/50 border-white/10' : 'bg-slate-900/50 border-white/5 opacity-50'}">
                                <input type="checkbox" id="pred-tc" onchange="updateModalCalc('${match.home}', '${match.away}')" class="w-5 h-5 rounded accent-amber-500" ${existing.isTripleCaptain ? 'checked' : ''} ${canTriple ? '' : 'disabled'}>
                                <div class="flex-1">
                                    <div class="text-sm font-bold text-white flex items-center gap-2">الجوكر (x3) <i class="fa-solid fa-star text-amber-400"></i></div>
                                    <div class="text-[10px] text-slate-400">متاح مرة في الذهاب ومرة في الإياب</div>
                                </div>
                            </label>
                        </div>

                        <div class="text-center mb-6 border-t border-white/10 pt-4">
                            <div class="text-xs text-slate-400 mb-1">النقاط المحتملة (إذا أصبت بدقة):</div>
                            <div id="dynamic-pts" class="text-3xl font-black text-emerald-400">0</div>
                        </div>

                        <button onclick="savePrediction('${match.id}')" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition-all text-sm mb-2">حفظ التوقع</button>
                    </div>
                </div>
            `;
            setTimeout(() => updateModalCalc(match.home, match.away), 50);
        }

        window.updateModalCalc = function(h, a) {
            const hVal = document.getElementById('pred-h').value.replace(/[^0-9]/g, '');
            const aVal = document.getElementById('pred-a').value.replace(/[^0-9]/g, '');
            document.getElementById('pred-h').value = hVal; document.getElementById('pred-a').value = aVal;
            
            const cap = document.getElementById('pred-cap')?.checked || false;
            const tc = document.getElementById('pred-tc')?.checked || false;
            
            let pts = calcPoints(h, a, hVal, aVal, null, null, cap, tc);
            document.getElementById('dynamic-pts').innerText = pts;
        }

        window.savePrediction = function(mId) {
            const h = document.getElementById('pred-h').value;
            const a = document.getElementById('pred-a').value;
            if (h === '' || a === '') { showCustomDialog('يرجى إدخال توقعك لكلا الفريقين'); return; }
            
            if (!predictions[currentUser.username]) predictions[currentUser.username] = {};
            
            const cap = document.getElementById('pred-cap')?.checked || false;
            const tc = document.getElementById('pred-tc')?.checked || false;

            if (cap && tc) { showCustomDialog('لا يمكن استخدام الكابتن والجوكر في نفس المباراة!'); return; }

            predictions[currentUser.username][mId] = { home: h, away: a, isCaptain: cap, isTripleCaptain: tc };
            saveState();
            closeMatchModal();
            render();
            showCustomDialog('تم حفظ توقعك بنجاح!', null);
        }

        // --- Auth ---
        async function handleAuth(e) {
            e.preventDefault();
            const name = document.getElementById('auth-name').value.trim();
            const pin = document.getElementById('auth-pin').value.trim();
            if (!name || pin.length < 4) { showCustomDialog('يرجى إدخال اسم المستخدم وكلمة مرور صحيحة'); return; }
            
            try {
                const res = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: name, pin: pin })
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = data.user; saveState(); currentTab = 'home'; render();
                } else showCustomDialog(data.message || 'خطأ في الدخول');
            } catch (err) {
                // Fallback to local storage
                currentUser = { username: name, role: name.toLowerCase() === 'red army' ? 'admin' : 'user' };
                saveState(); currentTab = 'home'; render();
                showCustomDialog('تم تسجيل الدخول محلياً لتجربة التطبيق!');
            }
        }

        // --- Render Functions ---
        function renderHeader(title) {
            return `
                <header class="p-4 glass sticky top-0 z-20 flex justify-between items-center shadow-lg border-b border-white/5">
                    <div>
                        <h1 class="text-sm font-bold text-slate-200">Goal Sniper</h1>
                        <span class="text-[10px] text-emerald-400"><i class="fa-solid fa-circle text-[8px]"></i> ${title}</span>
                    </div>
                    <button onclick="localStorage.removeItem('oracle_current_user_v8'); window.location.reload();" class="w-8 h-8 flex items-center justify-center rounded-full bg-rose-500/20 text-rose-400 hover:bg-rose-500 hover:text-white transition-colors"><i class="fa-solid fa-power-off text-sm"></i></button>
                </header>
            `;
        }

        function renderBottomNav() {
            if (!currentUser) return '';
            const isAdmin = currentUser.role === 'admin';
            const tabs = [
                { id: 'home', icon: 'fa-house', label: 'الرئيسية' },
                { id: 'matches', icon: 'fa-futbol', label: 'المباريات' },
                { id: 'standings', icon: 'fa-trophy', label: 'الترتيب' },
                { id: 'rules', icon: 'fa-book', label: 'القوانين' },
            ];
            if (isAdmin) tabs.push({ id: 'admin', icon: 'fa-gear', label: 'الإدارة' });

            return `
                <nav class="fixed bottom-0 w-full glass border-t border-white/10 pb-safe pt-2 px-2 z-30 shadow-[0_-10px_20px_rgba(0,0,0,0.3)]">
                    <div class="flex justify-around items-center max-w-md mx-auto mb-2">
                        ${tabs.map(t => `
                            <button onclick="currentTab='${t.id}'; render();" class="flex flex-col items-center p-2 w-16 transition-all duration-300 ${currentTab === t.id ? 'text-blue-400 scale-110' : 'text-slate-500 hover:text-slate-300'}">
                                <i class="fa-solid ${t.icon} text-xl mb-1 drop-shadow-md"></i>
                                <span class="text-[10px] font-bold">${t.label}</span>
                                ${currentTab === t.id ? '<div class="w-1 h-1 bg-blue-400 rounded-full mt-1"></div>' : ''}
                            </button>
                        `).join('')}
                    </div>
                </nav>
            `;
        }

        function renderAuthScreen() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4 w-full">
                    <div class="glass max-w-md w-full p-8 rounded-3xl shadow-2xl animate-fade-up text-center">
                        <h1 class="text-3xl font-black text-blue-500 mb-2">Goal Sniper</h1>
                        <p class="text-slate-400 text-sm mb-8">سجل دخولك لتوقع المباريات</p>
                        <form onsubmit="handleAuth(event)" class="space-y-4">
                            <input type="text" id="auth-name" placeholder="اسم المستخدم" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-white outline-none" required />
                            <input type="password" id="auth-pin" placeholder="كلمة المرور" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-white outline-none" required />
                            <button type="submit" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-xl mt-4">دخول</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderHomeTab() {
            const app = document.getElementById('app');
            const activeGw = getCurrentActiveGw();
            const standings = getGlobalStandings();
            const myStats = standings.find(s => s.username === currentUser.username) || { totalPts: 0, hitRate: 0, favTeam: '-', playedMatches: 0 };

            const prevGw = activeGw > 1 ? activeGw - 1 : null;
            let motwHtml = '';
            if (prevGw) {
                const motwUsers = standings.filter(s => s.badges.motw);
                if (motwUsers.length > 0) {
                    const maxPts = motwUsers[0].gwPoints[prevGw];
                    const names = motwUsers.map(u => u.username).join(' و ');
                    motwHtml = `
                        <div class="mb-6 bg-gradient-to-r from-yellow-600/20 to-yellow-900/20 border border-yellow-500/30 rounded-2xl p-4 flex items-center gap-4 relative overflow-hidden">
                            <div class="w-12 h-12 bg-yellow-500/20 rounded-full flex shrink-0 items-center justify-center text-2xl border border-yellow-500/50 shadow-[0_0_15px_rgba(234,179,8,0.3)]">👑</div>
                            <div>
                                <h3 class="text-yellow-400 font-bold text-sm mb-1">عرّاف الجولة ${prevGw}</h3>
                                <div class="flex flex-wrap items-baseline gap-2">
                                    <span class="text-white font-black text-lg">${names}</span>
                                    <span class="text-yellow-500/80 text-xs bg-yellow-500/10 px-2 py-0.5 rounded">${maxPts} نقطة</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }

            app.innerHTML = `
                ${renderHeader('الرئيسية')}
                <div class="p-4 overflow-y-auto pb-24 hide-scrollbar">
                    ${motwHtml}
                    <div class="glass p-5 rounded-2xl mb-6 relative overflow-hidden animate-fade-up border-blue-500/30">
                        <h2 class="text-slate-400 text-sm font-bold mb-1">نقاطي الكلية</h2>
                        <div class="flex items-end gap-3"><span class="text-5xl font-black text-white">${myStats.totalPts}</span><span class="text-blue-400 font-bold mb-1">نقطة</span></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="glass p-4 rounded-xl animate-fade-up text-center">
                            <div class="text-emerald-400 mb-2"><i class="fa-solid fa-bullseye text-xl"></i></div>
                            <div class="text-xs text-slate-400 mb-1">نسبة النجاح</div>
                            <div class="text-xl font-bold text-white">${myStats.hitRate}%</div>
                        </div>
                        <div class="glass p-4 rounded-xl animate-fade-up text-center">
                            <div class="text-rose-400 mb-2"><i class="fa-solid fa-heart text-xl"></i></div>
                            <div class="text-xs text-slate-400 mb-1">أكثر فريق فضّلته</div>
                            <div class="text-xl font-bold text-white truncate">${myStats.favTeam}</div>
                        </div>
                    </div>
                </div>
                ${renderBottomNav()}
            `;
        }

        function renderMatchesTab() {
            const app = document.getElementById('app');
            const rounds = [...new Set(matches.map(m => m.gw))].sort((a,b)=>a-b);
            const filteredMatches = matches.filter(m => m.gw === activeGwFilter);
            
            app.innerHTML = `
                ${renderHeader('المباريات')}
                <div class="bg-slate-900/80 border-b border-white/5 p-2 sticky top-[61px] z-10">
                    <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1 px-2 snap-x">
                        ${rounds.map(r => `<button onclick="activeGwFilter=${r}; render()" class="snap-start shrink-0 px-4 py-1.5 rounded-full text-xs font-bold transition-all ${activeGwFilter === r ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}">الجولة ${r}</button>`).join('')}
                    </div>
                </div>
                <div class="p-4 overflow-y-auto pb-24 hide-scrollbar space-y-4">
                    ${filteredMatches.map(m => {
                        const isPlayed = m.actualH !== null;
                        const p = (predictions[currentUser.username] || {})[m.id];
                        const hasPred = p && p.home !== '';
                        return `
                            <div class="glass rounded-xl p-4 animate-fade-up">
                                <div class="flex justify-between items-center mb-3 border-b border-white/5 pb-2">
                                    <span class="text-[10px] bg-slate-800 px-2 py-1 rounded text-slate-300 font-bold"><i class="fa-regular fa-calendar ml-1 text-slate-400"></i>${m.date} | ${m.time}</span>
                                    ${isPlayed ? '<span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded font-bold">منتهية</span>' : '<span class="text-[10px] bg-blue-500/20 text-blue-400 px-2 py-1 rounded font-bold">قادمة</span>'}
                                </div>
                                <div class="flex justify-between items-center px-2 mb-4">
                                    <div class="w-24 text-center"><div class="font-bold text-slate-200 text-sm truncate">${getTeamName(m.home)}</div></div>
                                    <div class="flex-1 flex justify-center items-center gap-3">
                                        <div class="w-10 h-10 bg-slate-900 rounded-lg flex items-center justify-center font-bold text-white border border-white/10">${isPlayed ? m.actualH : '-'}</div>
                                        <div class="text-slate-500 text-xs font-bold">:</div>
                                        <div class="w-10 h-10 bg-slate-900 rounded-lg flex items-center justify-center font-bold text-white border border-white/10">${isPlayed ? m.actualA : '-'}</div>
                                    </div>
                                    <div class="w-24 text-center"><div class="font-bold text-slate-200 text-sm truncate">${getTeamName(m.away)}</div></div>
                                </div>
                                ${!isPlayed ? `<button onclick="openMatchModal('${m.id}')" class="w-full py-2.5 rounded-lg text-xs font-bold transition-all ${hasPred ? 'bg-emerald-600/20 text-emerald-400 border border-emerald-500/30' : 'bg-blue-600 hover:bg-blue-700 text-white shadow-lg'}">${hasPred ? `<i class="fa-solid fa-pen mr-1"></i> تعديل توقعي (${p.home} - ${p.away})` : 'توقع الآن'}</button>` : ''}
                            </div>
                        `
                    }).join('')}
                </div>
                ${renderBottomNav()}
            `;
        }

        function renderStandingsTab() {
            const app = document.getElementById('app');
            const standings = getGlobalStandings();
            
            app.innerHTML = `
                ${renderHeader('الترتيب العام')}
                <div class="p-4 overflow-y-auto pb-24 hide-scrollbar">
                    <div class="glass rounded-2xl overflow-hidden animate-fade-up border border-white/5">
                        <div class="bg-slate-800/80 px-4 py-3 border-b border-white/5 flex text-xs font-bold text-slate-400">
                            <div class="w-8 text-center">#</div><div class="flex-1 text-right">العرّاف</div><div class="w-16 text-center">النقاط</div>
                        </div>
                        <div class="divide-y divide-white/5">
                            ${standings.map((s, idx) => `
                                <div class="px-4 py-3 flex items-center ${s.username === currentUser.username ? 'bg-blue-900/20' : ''}">
                                    <div class="w-8 text-center font-black ${idx<3?'text-yellow-400':'text-slate-400'} text-sm">${idx + 1}</div>
                                    <div class="flex-1 text-right">
                                        <div class="font-bold text-sm text-slate-200 flex items-center gap-1">${s.username} 
                                            ${s.badges.sniper ? '<span title="القناص">🎯</span>' : ''}
                                            ${s.badges.giantSlayer ? '<span title="قاهر الكبار">🛡️</span>' : ''}
                                            ${s.badges.motw ? '<span title="قناص الأسبوع">🔥</span>' : ''}
                                        </div>
                                    </div>
                                    <div class="w-16 text-center font-black text-lg text-blue-400">${s.totalPts}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
                ${renderBottomNav()}
            `;
        }

        function renderRulesTab() {
            document.getElementById('app').innerHTML = `
                ${renderHeader('قوانين النقاط')}
                <div class="p-4 overflow-y-auto pb-24 hide-scrollbar space-y-3 text-sm text-slate-300 leading-relaxed">
                    <div class="glass p-4 rounded-xl"><h3 class="text-blue-400 font-bold mb-2 border-b border-white/10 pb-1">مباريات الفرق العادية (ليست قمة):</h3>
                        <p>🎯 توقع النتيجة بدقة: <span class="text-emerald-400 font-bold">3 نقاط</span> (4 نقاط إذا مجموع الأهداف 5+ أو تعادل سلبي)</p>
                        <p>✅ توقع الفائز أو التعادل فقط: <span class="text-emerald-400 font-bold">1 نقطة</span></p>
                    </div>
                    <div class="glass p-4 rounded-xl"><h3 class="text-blue-400 font-bold mb-2 border-b border-white/10 pb-1">قمة الكبار (الفريقين من الستة الكبار):</h3>
                        <p>🎯 توقع نتيجة فوز بدقة: <span class="text-emerald-400 font-bold">5 نقاط</span> (3 نقاط للمجرد الفوز)</p>
                        <p>🤝 توقع نتيجة تعادل بدقة: <span class="text-emerald-400 font-bold">3 نقاط</span> (2 نقطة لمجرد التعادل)</p>
                    </div>
                    <div class="glass p-4 rounded-xl"><h3 class="text-blue-400 font-bold mb-2 border-b border-white/10 pb-1">الكبير ضد الطموح:</h3>
                        <p>🔥 فوز الفريق غير الكبير (مفاجأة) بدقة: <span class="text-emerald-400 font-bold">6 نقاط</span> (4 نقاط لمجرد الفوز)</p>
                        <p>✅ فوز الفريق الكبير بدقة: <span class="text-emerald-400 font-bold">2 نقطة</span> (1 نقطة لمجرد الفوز)</p>
                        <p>🤝 توقع التعادل بدقة: <span class="text-emerald-400 font-bold">3 نقاط</span> (2 نقطة لمجرد التعادل)</p>
                    </div>
                    <div class="glass p-4 rounded-xl"><h3 class="text-yellow-400 font-bold mb-2 border-b border-white/10 pb-1">الميزات الإضافية (Boosts):</h3>
                        <p>الكابتن (x2): متاح مرة واحدة فقط في كل جولة ويضاعف نقاط المباراة.</p>
                        <p>الجوكر (x3): متاح مرتين بالموسم (مرة من جولة 1 لـ 18، ومرة من 19 لـ 38).</p>
                    </div>
                </div>
                ${renderBottomNav()}
            `;
        }

        function renderAdminTab() {
            if (currentUser?.role !== 'admin') { currentTab = 'home'; render(); return; }
            const app = document.getElementById('app');
            app.innerHTML = `
                ${renderHeader('لوحة الإدارة')}
                <div class="p-4 overflow-y-auto pb-24 hide-scrollbar space-y-6">
                    <div class="glass p-5 rounded-2xl border-blue-500/30">
                        <h3 class="font-bold text-sm text-blue-400 mb-4 border-b border-white/10 pb-2">إضافة مباراة جديدة</h3>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <select id="new-match-home" class="bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white"><option value="" disabled selected>المضيف</option>${TEAMS.map(t=>`<option value="${t.code}">${t.name}</option>`).join('')}</select>
                            <select id="new-match-away" class="bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white"><option value="" disabled selected>الضيف</option>${TEAMS.map(t=>`<option value="${t.code}">${t.name}</option>`).join('')}</select>
                        </div>
                        <div class="grid grid-cols-3 gap-3 mb-4">
                            <input type="number" id="new-match-gw" placeholder="الجولة" class="bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white text-center">
                            <input type="date" id="new-match-date" class="bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white">
                            <input type="time" id="new-match-time" class="bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white">
                        </div>
                        <button onclick="adminAddMatch()" class="w-full py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold">إضافة المباراة</button>
                    </div>
                    
                    <div class="glass p-5 rounded-2xl">
                        <h3 class="font-bold text-sm text-slate-200 mb-4 border-b border-white/10 pb-2">إدارة نتائج المباريات المضافة</h3>
                        <div class="space-y-3">
                            ${matches.map(m => `
                                <div class="bg-slate-800/50 p-3 rounded-xl border border-white/5 flex flex-col md:flex-row justify-between items-center gap-3">
                                    <div class="flex-1 w-full flex items-center justify-between">
                                        <div class="text-xs text-slate-400 w-12 shrink-0">ج ${m.gw}</div>
                                        <div class="flex-1 flex justify-center items-center gap-2">
                                            <span class="text-xs font-bold truncate">${getTeamName(m.home)}</span>
                                            <input type="number" id="actual-h-${m.id}" value="${m.actualH??''}" class="w-10 h-8 text-center bg-slate-900 border rounded text-xs text-white" placeholder="-">
                                            <span class="text-slate-500">:</span>
                                            <input type="number" id="actual-a-${m.id}" value="${m.actualA??''}" class="w-10 h-8 text-center bg-slate-900 border rounded text-xs text-white" placeholder="-">
                                            <span class="text-xs font-bold truncate">${getTeamName(m.away)}</span>
                                        </div>
                                    </div>
                                    <div class="flex gap-2 w-full md:w-auto justify-center">
                                        <button onclick="saveActual('${m.id}')" class="px-3 py-1.5 bg-emerald-600 text-white rounded text-xs font-bold">تثبيت</button>
                                        <button onclick="clearActual('${m.id}')" class="px-3 py-1.5 bg-slate-600 text-white rounded text-xs font-bold">إلغاء</button>
                                        <button onclick="adminDeleteMatch('${m.id}')" class="px-3 py-1.5 bg-rose-600 text-white rounded text-xs font-bold"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
                ${renderBottomNav()}
            `;
        }

        window.adminAddMatch = function() {
            const h = document.getElementById('new-match-home').value;
            const a = document.getElementById('new-match-away').value;
            const gw = document.getElementById('new-match-gw').value;
            const d = document.getElementById('new-match-date').value;
            const t = document.getElementById('new-match-time').value;
            
            if(!h || !a || !gw || !d || !t) { showCustomDialog('يرجى تعبئة جميع الحقول'); return; }
            if(h === a) { showCustomDialog('لا يمكن اختيار نفس الفريقين'); return; }

            matches.unshift({ id: `m_new_${Date.now()}`, gw: Number(gw), home: h, away: a, date: d, time: t, actualH: null, actualA: null });
            saveState(); showCustomDialog('تمت إضافة المباراة بنجاح', () => render());
        }

        window.adminDeleteMatch = function(mId) {
            showCustomDialog('هل أنت متأكد من حذف هذه المباراة نهائياً؟', () => {
                matches = matches.filter(m => m.id !== mId);
                saveState(); render(); showCustomDialog('تم الحذف بنجاح');
            }, true, 'نعم متأكد', 'لا');
        }

        window.saveActual = function(mId) {
            const hVal = document.getElementById(`actual-h-${mId}`).value;
            const aVal = document.getElementById(`actual-a-${mId}`).value;
            if(hVal === '' || aVal === '') { showCustomDialog('يرجى إدخال أهداف الفريقين'); return; }
            const m = matches.find(x => x.id === mId);
            if(m) {
                m.actualH = Number(hVal); m.actualA = Number(aVal);
                saveState(); showCustomDialog('تم تثبيت النتيجة واحتساب النقاط!', () => render());
            }
        }
        
        window.clearActual = function(mId) {
            const m = matches.find(x => x.id === mId);
            if(m) {
                m.actualH = null; m.actualA = null;
                saveState(); showCustomDialog('تم إلغاء نتيجة المباراة', () => render());
            }
        }

        function render() {
            if(currentTab === 'home') renderHomeTab();
            else if(currentTab === 'matches') renderMatchesTab();
            else if(currentTab === 'standings') renderStandingsTab();
            else if(currentTab === 'rules') renderRulesTab();
            else if(currentTab === 'admin') renderAdminTab();
        }

        window.onload = () => {
            if (currentUser) render(); else renderAuthScreen();
        };
    </script>
</body>
</html>
