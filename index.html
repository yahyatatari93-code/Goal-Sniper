        // 🌟 محرك الصوت الفوري (بدون ملفات انترنت، وبدون تأخير نهائياً) 🌟
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        // تهيئة محرك الصوت (لتجاوز حظر المتصفحات للصوت التلقائي)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            try {
                initAudio(); // التأكد من تفعيل المحرك
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                const now = audioCtx.currentTime;
                
                if (type === 'success') {
                    // 🎵 صوت حفظ التوقع (نغمة تأكيد احتفالية قصيرة)
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // نغمة 1
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // نغمة 2 أعلى
                    
                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.5, now + 0.05);
                    gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                    
                    osc.start(now);
                    osc.stop(now + 0.3);
                    
                } else if (type === 'captain') {
                    // 🔫 صوت اختيار الكابتن (ضغطة ميكانيكية ثقيلة مثل تذخير السلاح)
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                    
                    gainNode.gain.setValueAtTime(0.7, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    
                    osc.start(now);
                    osc.stop(now + 0.15);
                    
                } else if (type === 'sniper') {
                    // 🎯 صوت القناص (رصاصة ليزر سريعة)
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.3);
                    
                    gainNode.gain.setValueAtTime(0.7, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) {
                console.error("Audio engine skipped", e); // صمت تام في حال الرفض
            }
        }
        
        // ربط المحرك بأول لمسة للشاشة لتفعيله إجبارياً
        document.addEventListener('click', initAudio, { once: true });
        document.addEventListener('touchstart', initAudio, { once: true });

        const calcPoints = (homeCode, awayCode, predH, predA, actualH = null, actualA = null, isCaptain = false, isTripleCaptain = false, matchLeague = 'EPL') => {
            if (predH === '' || predA === '' || predH === null || predA === null) return 0;
            const ph = Number(predH), pa = Number(predA);
            let ah = actualH !== null ? Number(actualH) : ph;
            let aa = actualA !== null ? Number(actualA) : pa;

            const isExact = (ph === ah && pa === aa);
            const isOutcomeCorrect = (ph > pa && ah > aa) || (ph < pa && ah < aa) || (ph === pa && ah === aa);
            const isDraw = (ah === aa);
            
            let pts = 0;

            // 🛑 إذا كان التوقع خاطئاً بالكامل، لا داعي للحساب
            if (!isOutcomeCorrect && !isExact) return 0;

            // 🌟 1. نظام نقاط دوري أبطال أوروبا (صراع المستويات) 🌟
            if (matchLeague === 'UCL') {
                const tH = TEAMS.find(t => t.code === homeCode);
                const tA = TEAMS.find(t => t.code === awayCode);
                // جلب المستويات (لو حدث خطأ ولم يوجد مستوى، نعتبره 2 احتياطياً)
                const lH = tH && tH.uclLevel ? tH.uclLevel : 2; 
                const lA = tA && tA.uclLevel ? tA.uclLevel : 2;

                const levelDiff = Math.abs(lH - lA);

                if (isDraw) {
                    if (levelDiff === 0) pts = isExact ? 5 : 3;
                    else if (levelDiff === 1) pts = isExact ? 4 : 2;
                    else pts = isExact ? 5 : 3; // تعادل مفاجئ جداً بين مستويات متباعدة
                } else {
                    const homeWon = ah > aa;
                    const winnerLevel = homeWon ? lH : lA;
                    const loserLevel = homeWon ? lA : lH;

                    if (winnerLevel === loserLevel) {
                        // متكافئين (نفس المستوى)
                        pts = isExact ? 5 : 3;
                    } else if (winnerLevel < loserLevel) {
                        // المنطق السائد (الأقوى تصنيفاً فاز) - تذكر: الرقم الأصغر يعني مستوى أقوى
                        pts = isExact ? 3 : 1;
                    } else {
                        // مفاجأة (الأضعف تصنيفاً فاز)
                        const upsetDiff = winnerLevel - loserLevel;
                        if (upsetDiff === 1) pts = isExact ? 5 : 3; // مفاجأة عادية
                        else pts = isExact ? 7 : 4; // قاهر أوروبا (مفاجأة كبرى بمستويين أو 3)
                    }
                }
            } 
            // ⚽ 2. نظام نقاط الدوري الإنجليزي (الكلاسيكي) ⚽
            else {
                const homeIsBig = BIG_TEAMS.includes(homeCode), awayIsBig = BIG_TEAMS.includes(awayCode);
                const totalGoals = ah + aa;

                if (!homeIsBig && !awayIsBig) {
                    if (isExact) pts = (totalGoals >= 5 || (ah === 0 && aa === 0)) ? 5 : (isDraw ? 3 : 3);
                    else if (isOutcomeCorrect) pts = 1;
                } else if (homeIsBig && awayIsBig) {
                    if (isDraw) pts = isExact ? 3 : 2;
                    else pts = isExact ? 5 : 3;
                } else {
                    const bigWon = (homeIsBig && ah > aa) || (awayIsBig && aa > ah);
                    const bigLost = (homeIsBig && ah < aa) || (awayIsBig && aa < ah);
                    if (isDraw) pts = isExact ? 4 : 3;
                    else if (bigWon) pts = isExact ? 3 : 1;
                    else if (bigLost) pts = isExact ? 6 : 4;
                }
            }

            // مضاعفات الكابتن والجوكر تطبق على كلا البطولتين
            if (isTripleCaptain) return pts * 3; 
            if (isCaptain) return pts * 2; 
            return pts;
        };

        // 🌟 دالة محدثة: تدعم كابتن واحد في الإنجليزي، وكابتن لكل يوم في الأبطال
        function getActiveCaptains(username, gw) {
            const gwMatches = matches.filter(m => Number(m.gw) === Number(gw)).sort((a, b) => parseMatchDate(a.date, a.time) - parseMatchDate(b.date, b.time));
            if (gwMatches.length === 0) return [];
            
            const userP = predictions[username] || {};
            const isUCL = Number(gw) >= 101;

            if (isUCL) {
                const captains = [];
                const dates = [...new Set(gwMatches.map(m => formatMatchDate(m.date)))];
                dates.forEach(date => {
                    const dateMatches = gwMatches.filter(m => formatMatchDate(m.date) === date);
                    const explicitCap = dateMatches.find(m => userP[m.id] && userP[m.id].isCaptain);
                    if (explicitCap) captains.push(explicitCap.id);
                    else if (dateMatches.length > 0) captains.push(dateMatches[0].id); // كابتن افتراضي لأول مباراة باليوم
                });
                return captains;
            } else {
                const explicitCap = gwMatches.find(m => userP[m.id] && userP[m.id].isCaptain);
                if (explicitCap) return [explicitCap.id];
                return [gwMatches[0].id];
            }
        }

        function getMonthlyStandings(month, year, leagueFilter = 'EPL') {
            const allUsernames = new Set();
            Object.keys(predictions).forEach(u => allUsernames.add(u));
            users.forEach(u => allUsernames.add(u.username));

            const statsMap = {};
            allUsernames.forEach(username => { 
                statsMap[username] = { username: username, totalPts: 0, badges: {} }; 
            });

            const monthlyMatches = matches.filter(m => {
                if ((m.league || 'EPL') !== leagueFilter) return false;
                const dateStr = formatMatchDate(m.date);
                if (!dateStr) return false;
                const parts = dateStr.split('/');
                if (parts.length >= 3) {
                    return parseInt(parts[1], 10) === month && parseInt(parts[2], 10) === year;
                }
                return false;
            });

            const userActiveCaptains = {};
            const uniqueGws = [...new Set(monthlyMatches.map(m => Number(m.gw)))];
            
            allUsernames.forEach(username => {
                userActiveCaptains[username] = {};
                uniqueGws.forEach(g => {
                    userActiveCaptains[username][g] = getActiveCaptains(username, g);
                });
            });

            monthlyMatches.forEach(m => {
                const isPlayed = m.actualH !== null && m.actualA !== null;
                if (!isPlayed) return;

                allUsernames.forEach(username => {
                    const p = (predictions[username] || {})[m.id];
                    if (p && p.home !== '' && p.away !== '' && p.home !== null && p.away !== null) {
                        const isEffectiveCaptain = userActiveCaptains[username][m.gw] && userActiveCaptains[username][m.gw].includes(m.id);

                    victimsThisGw.add(shot.victim); // 🌟 إضافة الضحية
                }
            });

            leagueMembers.sort((a, b) => b.mlTotalPts - a.mlTotalPts);

                sniperEligibilityGw 
            };
        }

        // 1. دالة تجميل التاريخ (تحوله إلى أرقام أنيقة وموحدة DD/MM/YYYY)
function formatMatchDate(dateStr) {
    if (!dateStr) return '';
    let str = String(dateStr);
    
    // تحويل أي شهر عربي إلى رقم في حال تم إدخاله بالخطأ
    const arabicMonths = {
        'يناير': '1', 'جانفي': '1', 'فبراير': '2', 'فيفري': '2', 'شباط': '2',
        'مارس': '3', 'آذار': '3', 'أبريل': '4', 'ابريل': '4', 'نيسان': '4',
        'مايو': '5', 'أيار': '5', 'ايار': '5', 'يونيو': '6', 'حزيران': '6',
        'يوليو': '7', 'تموز': '7', 'أغسطس': '8', 'اغسطس': '8', 'آب': '8',
        'سبتمبر': '9', 'أيلول': '9', 'ايلول': '9', 'أكتوبر': '10', 'اكتوبر': '10', 'تشرين الأول': '10',
        'نوفمبر': '11', 'تشرين الثاني': '11', 'ديسمبر': '12', 'كانون الأول': '12'
    };
    for (const [name, num] of Object.entries(arabicMonths)) {
        if (str.includes(name)) {
            str = str.replace(new RegExp(name, 'g'), num);
        }
    }
    
    // توحيد الفواصل
    str = str.replace(/[\s\.-]+/g, '/').replace(/\/+/g, '/');
    
    // تنسيق التاريخ ليظهر بشكل أرقام أنيقة (مثال: 16/08/2026)
    let parts = str.match(/\d+/g);
    if (parts && parts.length >= 2) {
        let d = parts[0].padStart(2, '0');
        let m = parts[1].padStart(2, '0');
        let y = parts[2] ? parts[2] : new Date().getFullYear();
        if (parts[0].length === 4) { // في حال كان النسق YYYY/MM/DD
            y = parts[0]; m = parts[1].padStart(2, '0'); d = parts[2].padStart(2, '0');
        }
        return `${d}/${m}/${y}`;
    }
    return str;
}

        // 2. دالة حساب الوقت (تدعم الآن نظام AM و PM بشكل مثالي)
function parseMatchDate(dateStr, timeStr) {
    try {
        let dStr = formatMatchDate(dateStr);
        let [time, period] = (timeStr || '').trim().split(/\s+/);
        let [hours, minutes] = (time || '0:0').split(':');
        hours = parseInt(hours, 10) || 0;
        minutes = parseInt(minutes, 10) || 0;
        
        // دعم اللغتين (ص/م) و (AM/PM)
        if (period) {
            period = period.toUpperCase();
            if ((period === 'م' || period === 'PM') && hours !== 12) hours += 12;
            if ((period === 'ص' || period === 'AM') && hours === 12) hours = 0;
        }
        
        let parts = dStr.match(/\d+/g);
        let y = new Date().getFullYear(), m = 0, d = 1;
        if (parts) {
            if (parts.length >= 3 && parts[0].length === 4) { 
                y = parseInt(parts[0]); m = parseInt(parts[1]) - 1; d = parseInt(parts[2]); 
            } else if (parts.length >= 2) { 
                d = parseInt(parts[0]); m = parseInt(parts[1]) - 1; if (parts[2]) y = parseInt(parts[2]); 
            }
        }
        return new Date(y, m, d, hours, minutes).getTime();
    } catch(e) { return 0; }
}

        // 3. دالة قفل المباراة (تم سد ثغرة القفل الخاطئ)
function isMatchLocked(match) {
    try {
        // التأكد 100% أن النتيجة مسجلة فعلاً وليست (فارغة أو غير معرفة)
        if (match.actualH !== undefined && match.actualH !== null && match.actualH !== '' && 
            match.actualA !== undefined && match.actualA !== null && match.actualA !== '') {
            return true; // المباراة انتهت ومسجلة لها نتيجة
        }
        
        const matchTimeMs = parseMatchDate(match.date, match.time);
        if (!matchTimeMs) return false;
        
        const now = new Date().getTime();
        return (matchTimeMs - now) <= 60 * 60 * 1000; // قفل قبل ساعة من بداية المباراة
    } catch(e) { return false; }
}

        // 🌟 دالة مساعدة لجلب أرقام الجولات المتاحة ديناميكياً
        function getAvailableGws(leagueFilter = null) {
            let fMatches = matches;
            if (leagueFilter) fMatches = matches.filter(m => (m.league || 'EPL') === leagueFilter);
            const unique = [...new Set(fMatches.map(m => Number(m.gw)))];
            if (unique.length === 0) return [1];
            return unique.sort((a, b) => a - b);
        }
        
        function getCurrentActiveGw() {
            const uniqueGws = getAvailableGws();
            
            // ترتيب الجولات زمنياً بناءً على تاريخ أول مباراة في الجولة
            uniqueGws.sort((gwA, gwB) => {
                const matchesA = matches.filter(m => Number(m.gw) === gwA).sort((a, b) => parseMatchDate(a.date, a.time) - parseMatchDate(b.date, b.time));
                const matchesB = matches.filter(m => Number(m.gw) === gwB).sort((a, b) => parseMatchDate(a.date, a.time) - parseMatchDate(b.date, b.time));
                const timeA = matchesA.length > 0 ? parseMatchDate(matchesA[0].date, matchesA[0].time) : 0;
                const timeB = matchesB.length > 0 ? parseMatchDate(matchesB[0].date, matchesB[0].time) : 0;
                return timeA - timeB;
            });

            // البحث عن أول جولة في التقويم الزمني لم تكتمل مبارياتها بعد
            for (const gw of uniqueGws) {
                const gwMatches = matches.filter(m => Number(m.gw) === gw);
                if (gwMatches.length === 0) continue;
                if (!gwMatches.every(m => m.actualH !== null && m.actualA !== null && m.actualH !== '' && m.actualA !== '')) return gw;
            }
            return uniqueGws.length > 0 ? uniqueGws[uniqueGws.length - 1] : 1;
        }

        function renderAdminTab() {
            // تحديد الجولة الحالية في قسم الإدارة
            if (!selectedAdminGw) {
                selectedAdminGw = typeof getCurrentActiveGw === 'function' ? getCurrentActiveGw() : 1;
            }
            const activeAdminGw = selectedAdminGw;

            // فلترة المباريات لجلب جولة الإدارة المحددة فقط
            const adminMatches = matches.filter(m => Number(m.gw) === activeAdminGw).sort((a, b) => {
                const dateA = String(a.date || "");
                const dateB = String(b.date || "");
                if (dateA !== dateB) return dateA.localeCompare(dateB);
                const timeA = String(a.time || "");
                const timeB = String(b.time || "");
                return timeA.localeCompare(timeB);
            });

            // 🌟 حساب الإحصائيات التحليلية (خاصة بالجولة المحددة فقط) 🌟
            let bestExactMatch = null, maxExactPct = -1;
            let mostDefyingMatch = null, maxWrongPct = -1;
            let mostCaptainedMatch = null, maxCapPct = -1;

            // حساب عدد اللاعبين النشطين في هذه الجولة لضمان دقة نسبة الكابتن
            const activeUsersInGw = new Set();
            adminMatches.forEach(m => {
                Object.keys(predictions).forEach(username => {
                    const p = (predictions[username] || {})[m.id];
                    if (p && p.home !== '' && p.away !== '' && p.home !== null && p.away !== null) {
                        activeUsersInGw.add(username);
                    }
                });
            });
            const totalGwPlayers = activeUsersInGw.size;

            // تحليل مباريات الجولة الحالية فقط
            adminMatches.forEach(m => {
                const isPlayed = m.actualH !== null && m.actualA !== null && m.actualH !== '' && m.actualA !== '';
                let totalPreds = 0, exacts = 0, wrongs = 0, captains = 0;
                
                Object.keys(predictions).forEach(username => {
                    const p = (predictions[username] || {})[m.id];
                    if (p && p.home !== '' && p.away !== '' && p.home !== null && p.away !== null) {
                        totalPreds++; 
                        
                        if (isPlayed) {
                            const ph = Number(p.home), pa = Number(p.away);
                            const ah = Number(m.actualH), aa = Number(m.actualA);
                            const isExact = (ph === ah && pa === aa);
                            const isOutcomeCorrect = (ph > pa && ah > aa) || (ph < pa && ah < aa) || (ph === pa && ah === aa);
                            
                            if (isExact) exacts++;
                            if (!isOutcomeCorrect) wrongs++; 
                        }
                        
                        // التحقق من الكابتن
                        if (getActiveCaptains(username, m.gw).includes(m.id)) {
                            captains++;
                        }
                    }
                });

                if (totalPreds > 0) {
                    if (isPlayed) {
                        const exactPct = (exacts / totalPreds) * 100;
                        const wrongPct = (wrongs / totalPreds) * 100;
                        if (exactPct > maxExactPct) { maxExactPct = exactPct; bestExactMatch = m; }
                        if (wrongPct > maxWrongPct) { maxWrongPct = wrongPct; mostDefyingMatch = m; }
                    }
                }
                
                // حساب نسبة الكابتن من إجمالي اللاعبين الذين شاركوا في الجولة
                if (totalGwPlayers > 0) {
                    const capPct = (captains / totalGwPlayers) * 100;
                    if (capPct > maxCapPct) { maxCapPct = capPct; mostCaptainedMatch = m; }
                }
            });

        function updateModalCalc() {
            const h = document.getElementById('modal-pred-h').value, a = document.getElementById('modal-pred-a').value;
            const p = document.querySelector('input[name="powerup"]:checked')?.value || 'none';
            let possiblePts = calcPoints(activeMatchModal.home, activeMatchModal.away, h, a, h, a, p==='captain', p==='triple', activeMatchModal.league || 'EPL');
            if (h === '' || a === '') possiblePts = 0;
            document.getElementById('modal-pts-display').innerText = possiblePts + ' نقطة';
        }

        async function saveModalPrediction() {
            const h = document.getElementById('modal-pred-h').value, a = document.getElementById('modal-pred-a').value;
            const powerup = document.querySelector('input[name="powerup"]:checked')?.value || 'none';
            if (h === '' || a === '') return;
            
            if (isMatchLocked(activeMatchModal)) {
                showCustomDialog("عذراً، انتهى الوقت وأُقفلت هذه المباراة!");
                closeModal(); render(); return;
            }

            const currentGw = Number(activeMatchModal.gw);
            const isUCL = currentGw >= 101;
            const matchDate = formatMatchDate(activeMatchModal.date);
            
            const isCap = (powerup === 'captain');
            const isTC = (powerup === 'triple') && !isUCL; 
            const userPreds = predictions[currentUser.username] || {};
            const activeCaps = getActiveCaptains(currentUser.username, currentGw);

            if (isCap) {
                let dateCapId = null;
                if (isUCL) {
                    const dateMatches = matches.filter(m => Number(m.gw) === currentGw && formatMatchDate(m.date) === matchDate);
                    dateCapId = dateMatches.find(m => activeCaps.includes(m.id))?.id;
                } else {
                    dateCapId = activeCaps[0];
                }
                
                if (dateCapId && dateCapId !== activeMatchModal.id) {
                    const capMatch = matches.find(m => m.id === dateCapId);
                    if (capMatch && isMatchLocked(capMatch)) {
                        showCustomDialog("لا يمكنك سحب شارة الكابتن لأن مباراة الكابتن الحالي قد أُقفلت!");
                        closeModal(); render(); return;
                    }
                }
            }

            if (isTC) {
                let isTcLocked = false;
                Object.entries(userPreds).forEach(([mId, p]) => {
                    if (mId !== activeMatchModal.id && p.isTripleCaptain) {
                        const m = matches.find(x => x.id === mId);
                        if (m && ((currentGw <= 18 && Number(m.gw) <= 18) || (currentGw >= 19 && Number(m.gw) >= 19))) {
                            if (isMatchLocked(m)) isTcLocked = true;
                        }
                    }
                });
                if (isTcLocked) { showCustomDialog("لا يمكنك سحب الجوكر لأنه مرتبط بمباراة مقفلة!"); closeModal(); render(); return; }
            }

            if (isCap || isTC) playSound('captain'); else playSound('success'); 

            setTimeout(async () => {
                let oldExplicitCapId = null;
                const gwMatches = matches.filter(m => Number(m.gw) === currentGw);
                gwMatches.forEach(m => {
                    if (m.id !== activeMatchModal.id && predictions[currentUser.username]?.[m.id]?.isCaptain) {
                        if (isUCL) {
                            if (formatMatchDate(m.date) === matchDate) oldExplicitCapId = m.id;
                        } else {
                            oldExplicitCapId = m.id;
                        }
                    }
                });

                const reqMatchId = activeMatchModal.id;
                closeModal();
                showCustomDialog("جاري إرسال التوقع للقاعدة...", "alert");

                try {
                    const token = localStorage.getItem('oracle_token_v8');
                    const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };

                    if (isCap && oldExplicitCapId) {
                        const oldPred = predictions[currentUser.username][oldExplicitCapId];
                        await fetch(`${API_BASE_URL}/predict`, {
                            method: 'POST', headers,
                            body: JSON.stringify({ 
                                username: currentUser.username, matchId: oldExplicitCapId, 
                                predH: oldPred.home, predA: oldPred.away, 
                                isCaptain: false, isTripleCaptain: oldPred.isTripleCaptain
                            })
                        });
                    }

                    const response = await fetch(`${API_BASE_URL}/predict`, {
                        method: 'POST', headers,
                        body: JSON.stringify({ 
                            username: currentUser.username, matchId: reqMatchId, 
                            predH: h, predA: a, isCaptain: isCap, isTripleCaptain: isTC
                        })
                    });
                    
                    const data = await response.json();
                
                    if(!data.success) {
                        showCustomDialog(data.message || "حدث خطأ أثناء حفظ التوقع.");
                    } else {
                        document.getElementById('dialog-container').innerHTML = '';
                    }
                    await syncData(); render();
                } catch(e) {
                    showCustomDialog("حدث خطأ أثناء الحفظ بالسيرفر. يرجى التأكد من اتصال الإنترنت.");
                    await syncData(); render();
                }
            }, 50); 
        }

        async function addMatch(e) {
            e.preventDefault();
            const league = document.getElementById('adm-league').value;
            // اختيار رقم الجولة بناءً على القائمة الظاهرة
            const gw = league === 'UCL' ? document.getElementById('adm-gw-ucl').value : document.getElementById('adm-gw-epl').value;
            
            const home = document.getElementById('adm-home').value;
            const away = document.getElementById('adm-away').value;
            const dateInput = document.getElementById('adm-date').value;
            const timeInput = document.getElementById('adm-time').value;
            
            if(!gw || !home || !away || !dateInput || !timeInput) return;

            const formattedDate = dateInput.replace(/-/g, '/');
            let [hours, minutes] = timeInput.split(':'); hours = parseInt(hours, 10);
            let period = hours >= 12 ? 'م' : 'ص'; hours = hours % 12 || 12;
            const formattedTime = `${hours}:${minutes} ${period}`;
            
            try {
                await fetch(`${API_BASE_URL}/admin/match`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id: 'm_custom_' + Date.now(), gw: Number(gw), home, away, date: formattedDate, time: formattedTime, league: league})
                });
                showCustomDialog(`تمت إضافة المباراة بنجاح!`);
                await syncData(); render();
            } catch(e) {}
        }

                } catch(e){}
            });
        }

        async function deleteUserByAdmin() {
    const username = document.getElementById('admin-delete-username').value;
    const adminPass = document.getElementById('admin-pass-1').value;

    if (!username || !adminPass) return alert('يرجى ملء جميع الحقول!');
    if (!confirm(`هل أنت متأكد 100% أنك تريد مسح اللاعب ${username}؟`)) return;

    try {
        // نجهز الرابط ليتطابق مع ما هو مكتوب في ملف السيرفر تماماً
        const baseUrl = API_BASE_URL.replace('/api', '');
        let url = `${baseUrl}/admin/delete-user`;

        let response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminPassword: adminPass, targetUsername: username })
        });

        // إذا كان المسار يعطي 404 (غير موجود)، نجرب المسار الآخر احتياطياً
        if (response.status === 404) {
            url = `${API_BASE_URL}/admin/delete-user`;
            response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminPassword: adminPass, targetUsername: username })
            });

        async function handleAuth(e) {
            e.preventDefault();
            const name = document.getElementById('auth-name').value.trim();
            const pin = document.getElementById('auth-pin').value.trim();
            
            if (authMode === 'register') {
                const pinConfirm = document.getElementById('auth-pin-confirm').value.trim();
                if (pin !== pinConfirm) {
                    showCustomDialog('كلمات المرور غير متطابقة!');
                    return;
                }
            }

            if (!name || pin.length < 4) {
                showCustomDialog('يرجى إدخال اسم المستخدم وكلمة مرور لا تقل عن 4 أرقام أو حروف.');
                return;
            }

            try {
                document.getElementById('app').innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-screen text-slate-400 gap-4">
                        <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-500"></i>
                        <span class="font-bold text-lg text-white">جاري الاتصال بالسيرفر...</span>
                    </div>`;

                const endpoint = authMode === 'register' ? '/auth/register' : '/auth/login';

                const response = await fetch(`${API_BASE_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: name, pin: pin })
                });
                
                const data = await response.json();

                if (data.success) {
                    currentUser = data.user;
                    localStorage.setItem('oracle_current_user_v8', JSON.stringify(currentUser));

                    localStorage.setItem('oracle_token_v8', data.token);
                    
                    document.getElementById('app').innerHTML = `
                        <div class="flex flex-col items-center justify-center min-h-screen text-slate-400 gap-4">
                            <i class="fa-solid fa-cloud-arrow-down fa-spin text-4xl text-blue-500"></i>
                            <span class="font-bold text-lg text-white">Goal Sniper</span>
                            <span class="font-bold text-sm">جاري مزامنة جدول المباريات الرسمي...</span>
                        </div>`;
                    
                    await syncData(); 
                    render();    
                    
                    // 🌟 التعديل هنا: استدعاء الرسالة الترحيبية مباشرة بعد الدخول الناجح 🌟
                    setTimeout(() => {
                        if (typeof showWelcomeMessage === 'function') {
                            showWelcomeMessage();
                        }
                    }, 800);

                } else {
                    showCustomDialog(data.message || 'خطأ في الدخول.');
                    render(); 
                }
            } catch (error) {
                console.error("Auth Error:", error);
                showCustomDialog('تعذر الاتصال بالسيرفر. تأكد من اتصال الإنترنت لديك.');
                render();
            }
        }

                    <div id="layout-wrapper" class="flex-1 flex flex-col w-full">
                        <div class="sticky top-0 z-50 w-full flex flex-col shadow-[0_10px_30px_rgba(0,0,0,0.3)]">
                            <header class="p-4 glass rounded-none border-x-0 border-t-0 border-b border-white/10 flex justify-between items-center bg-[#0a0e17]/95 backdrop-blur-xl">
                                
                                <!-- 🌟 التعديل: زر واتساب الجديد في الهيدر 🌟 -->
                                <button onclick="contactSupport()" class="flex items-center gap-3 group cursor-pointer bg-slate-800/40 hover:bg-slate-700/60 p-1.5 pr-4 rounded-full transition-all border border-emerald-500/20 shadow-lg shadow-emerald-500/5">
                                    <div class="w-9 h-9 rounded-full bg-emerald-500/20 flex items-center justify-center border border-emerald-500/40 group-hover:bg-emerald-500 hover:scale-105 transition-all duration-300">
                                        <i class="fa-brands fa-whatsapp text-emerald-400 group-hover:text-white text-xl"></i>
                                    </div>
                                    <div class="flex flex-col items-start leading-none">
                                        <span class="text-xs font-black text-emerald-400 group-hover:text-emerald-300 transition-colors">${typeof t === 'function' ? t('contactUs') : 'تواصل معنا'}</span>
                                        <span class="text-[9px] text-slate-400 font-bold mt-1">${typeof t === 'function' ? t('mgmtGoalSniper') : 'إدارة Goal Sniper'}</span>
                                    </div>
                                </button>
                                
                                <div class="flex items-center gap-2">
                                    ${currentUser.username.toLowerCase() === 'red army' ? `<button onclick="switchTab('admin')" class="px-3 py-1.5 bg-rose-600/20 border border-rose-500/30 rounded-xl text-rose-300 text-xs font-bold hover:bg-rose-600 hover:text-white transition-all"><i class="fa-solid fa-shield-halved"></i> الإدارة</button>` : ''}
                                    <div class="flex items-center gap-2">
                                        <div class="flex items-center bg-slate-900/80 border border-white/10 rounded-lg p-0.5 shadow-lg">
                                            <button onclick="changeLanguage('ar')" class="px-1.5 py-1 text-[10px] font-bold text-slate-300 hover:text-white hover:bg-slate-700 rounded transition-all">عربي</button>
                                            <span class="text-white/20 text-[10px] px-0.5">|</span>
                                            <button onclick="changeLanguage('en')" class="px-1.5 py-1 text-[10px] font-bold text-slate-300 hover:text-white hover:bg-slate-700 rounded transition-all">EN</button>
                                            <span class="text-white/20 text-[10px] px-0.5">|</span>
                                            <button onclick="changeLanguage('tr')" class="px-1.5 py-1 text-[10px] font-bold text-slate-300 hover:text-white hover:bg-slate-700 rounded transition-all">TR</button>
                                        </div>
                                        <!-- زر المزامنة اليدوية -->
                                        <button onclick="manualSync()" class="p-1.5 glass text-emerald-400 rounded-lg hover:bg-emerald-500 hover:text-white transition-all border-emerald-500/20" title="${typeof t === 'function' ? t('refresh') || 'تحديث البيانات' : 'تحديث البيانات'}">
                                            <i id="sync-icon" class="fa-solid fa-arrows-rotate text-sm"></i>
                                        </button>
                                        <button onclick="logout()" class="p-1.5 glass text-rose-400 rounded-lg hover:bg-rose-600 hover:text-white transition-all border-rose-500/20">
                                            <i class="fa-solid fa-power-off text-sm"></i>
                                        </button>
                                    </div>
                                </div>
                            </header>

                            <div id="marquee-wrapper">
                                ${marqueeTexts[currentLang] ? `
                                <div class="marquee-container" dir="${currentLang === 'ar' ? 'rtl' : 'ltr'}">
                                    <div class="marquee-content ${currentLang === 'ar' ? 'marquee-ltr' : 'marquee-rtl'}">
                                        ${marqueeTexts[currentLang]}
                                    </div>
                                </div>
                                ` : ''}
                            </div>
                        </div>

                        <main id="main-content" class="flex-1 max-w-4xl w-full mx-auto p-4 animate-fade-up pb-20"></main>

                        <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 glass border-t border-white/10 p-2 flex justify-around items-center z-40 bg-[#060b19]/95 backdrop-blur-xl pb-[calc(8px+env(safe-area-inset-bottom))] pt-2"></nav>
                    </div>
                `;
            }

            // 🌟 تحديث المحتوى الداخلي فقط عند التنقل بين الصفحات (لا نقترب من الشريط المتحرك) 🌟
            const mainContent = document.getElementById('main-content');
            if (currentTab === 'home') mainContent.innerHTML = renderHomeTab();
            else if (currentTab === 'matches') mainContent.innerHTML = renderMatchesTab();
            else if (currentTab === 'standings') mainContent.innerHTML = renderStandingsTab();
            else if (currentTab === 'prizes') mainContent.innerHTML = renderPrizesTab();
            else if (currentTab === 'minileagues') mainContent.innerHTML = renderMiniLeaguesTab();
            else if (currentTab === 'rules') mainContent.innerHTML = renderRulesTab();
            else if (currentTab === 'admin' && currentUser.username.toLowerCase() === 'red army') mainContent.innerHTML = renderAdminTab();

            // 🌟 تحديث ألوان الأزرار في الشريط السفلي لتمييز الصفحة النشطة 🌟
            const bottomNav = document.getElementById('bottom-nav');
            bottomNav.innerHTML = `
                <button onclick="switchTab('home')" class="flex flex-col items-center gap-1.5 px-2 py-1 rounded-xl transition-all ${currentTab === 'home' ? 'text-blue-400 bg-blue-500/10' : 'text-slate-400 hover:text-slate-200'}">
                    <i class="fa-solid fa-house text-lg"></i>
                    <span class="text-[9px] font-bold">${typeof t === 'function' ? t('navHome') : 'الرئيسية'}</span>
                </button>
                <button onclick="switchTab('matches')" class="flex flex-col items-center gap-1.5 px-2 py-1 rounded-xl transition-all ${currentTab === 'matches' ? 'text-blue-400 bg-blue-500/10' : 'text-slate-400 hover:text-slate-200'}">
                    <i class="fa-solid fa-calendar-days text-lg"></i>
                    <span class="text-[9px] font-bold">${typeof t === 'function' ? t('navMatches') : 'المباريات'}</span>
                </button>
                <button onclick="switchTab('standings')" class="flex flex-col items-center gap-1.5 px-2 py-1 rounded-xl transition-all ${currentTab === 'standings' ? 'text-blue-400 bg-blue-500/10' : 'text-slate-400 hover:text-slate-200'}">
                    <i class="fa-solid fa-trophy text-lg"></i>
                    <span class="text-[9px] font-bold">${typeof t === 'function' ? t('navStandings') : 'الترتيب'}</span>
                </button>
                
                <button onclick="switchTab('prizes')" class="flex flex-col items-center gap-1.5 px-2 py-1 rounded-xl transition-all ${currentTab === 'prizes' ? 'text-amber-400 bg-amber-500/10' : 'text-slate-400 hover:text-slate-200'}">
                    <i class="fa-solid fa-gift text-lg"></i>
                    <span class="text-[9px] font-bold">${typeof t === 'function' ? t('navPrizes') : 'الجوائز'}</span>
                </button>

                <button onclick="switchTab('minileagues')" class="flex flex-col items-center gap-1.5 px-2 py-1 rounded-xl transition-all ${currentTab === 'minileagues' ? 'text-blue-400 bg-blue-500/10' : 'text-slate-400 hover:text-slate-200'}">
                    <i class="fa-solid fa-users text-lg"></i>
                    <span class="text-[9px] font-bold">${typeof t === 'function' ? t('navLeagues') : 'الدوريات'}</span>
                </button>
                <button onclick="switchTab('rules')" class="flex flex-col items-center gap-1.5 px-2 py-1 rounded-xl transition-all ${currentTab === 'rules' ? 'text-blue-400 bg-blue-500/10' : 'text-slate-400 hover:text-slate-200'}">
                    <i class="fa-solid fa-scale-balanced text-lg"></i>
                    <span class="text-[9px] font-bold">${typeof t === 'function' ? t('navRules') : 'القوانين'}</span>
                </button>
            `;

            renderModal();
        }

        window.onload = async function() {
            currentUser = JSON.parse(localStorage.getItem('oracle_current_user_v8') || 'null');
            fetchMarquee(); // جلب الإعلان عند فتح التطبيق
            if (currentUser) {
                document.getElementById('app').innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-screen text-slate-400 gap-4">
                        <i class="fa-solid fa-satellite-dish fa-spin text-4xl text-blue-500"></i>
                        <span class="font-bold text-lg text-white">Goal Sniper</span>
                        <span class="font-bold text-sm">جاري تحميل جدول المباريات الرسمي...</span>
                    </div>`;
                await syncData(); 
            }
            render();
            
            // 🌟 السحر هنا: استدعاء الرسالة الترحيبية بلمسة تأخير أنيقة 🌟
            setTimeout(() => {
                showWelcomeMessage();
            }, 800); // تأخير 0.8 ثانية لتعطي فرصة للواجهة لتظهر بشكل جميل أولاً
        };
        
        async function fireSniper(leagueCode, victimName, penaltyPoints, gw) {
            // 🎯 استخدام نافذة الحوار الاحترافية بدلاً من رسائل المتصفح البدائية
            showCustomDialog(
                `🎯 <b>تأكيد القنص</b><br><br>هل أنت متأكد أنك تريد قنص <span class="text-rose-400 font-bold">[ ${victimName} ]</span> وخصم <span class="text-amber-400 font-bold">${penaltyPoints} نقاط</span> منه؟<br><br><span class="text-[11px] text-slate-400">تذكر: الميزة تستخدم مرة واحدة فقط في الجولة!</span>`,
                'confirm',
                async () => {
                    // 🎵 تشغيل الصوت فوراً بمجرد تأكيد الضربة
                    playSound('sniper');

                    try {
                        const token = localStorage.getItem('oracle_token_v8');
                        const headers = { 
                            'Content-Type': 'application/json', 
                            'Authorization': `Bearer ${token}` 
                        };

                        const res = await fetch(`${API_BASE_URL}/sniper/shoot`, {
                            method: 'POST',
                            headers: headers,
                            body: JSON.stringify({
                                leagueCode: leagueCode,
                                gw: gw,
                                sniper: currentUser.username,
                                victim: victimName,
                                pointsDeducted: penaltyPoints
                            })
                        });
                       
                        const json = await res.json();
                        if (json.success) {
                            showCustomDialog(`🔥 <b>تمت العملية بنجاح!</b><br><br>تم إرسال رصاصة القناص نحو <span class="text-emerald-400 font-bold">${victimName}</span> بدقة.`);
                            await syncData(); 
                            render(); 
                        } else {
                            showCustomDialog(json.message || "⚠️ فشلت عملية القنص، ربما استخدمته مسبقاً!");
                        }
                    } catch (e) {
                        showCustomDialog("❌ لا يمكن الاتصال بالسيرفر حالياً. جرب لاحقاً.");
                    }
                }
            );
        }
    </script>
</body>
</html>
