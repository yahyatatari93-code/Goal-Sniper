<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goal Sniper</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9;
            --secondary: #38bdf8;
            --dark: #060b19;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --success: #10b981;
            --danger: #e11d48;
            --gold: #fbbf24;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--dark);
            color: var(--text);
            padding-bottom: 70px;
        }

        .header {
            background: rgba(30, 41, 59, 0.95);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: center;
        }

        .app-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
        }

        .app-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(14, 165, 233, 0.5);
        }

        .container { padding: 15px; max-width: 800px; margin: 0 auto; }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .match-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-left: 4px solid var(--primary);
        }

        .match-date-time {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.2);
            padding: 4px;
            border-radius: 5px;
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .team {
            text-align: center;
            flex: 1;
        }

        .team img {
            width: 40px;
            height: 40px;
            margin-bottom: 5px;
        }

        .vs { font-weight: bold; color: var(--primary); margin: 0 15px; font-size: 1.2rem; }

        .prediction-inputs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .pred-input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 10px;
        }
        
        .pred-input:focus { border-color: var(--primary); outline: none; }
        .pred-input:disabled { background: rgba(0,0,0,0.3); color: #64748b; }

        .power-ups {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-outline.active { background: var(--primary); color: white; }
        .btn-triple { border-color: var(--gold); color: var(--gold); }
        .btn-triple.active { background: var(--gold); color: var(--dark); border-color: var(--gold); }
        
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(30, 41, 59, 0.95);
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .nav-item {
            color: #64748b;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 20px; }

        .standings-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .standings-table th, .standings-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .standings-table th { background: rgba(0,0,0,0.2); color: var(--primary); }
        
        .badge {
            font-size: 16px;
            margin: 0 2px;
            cursor: help;
        }

        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 8px;
        }

        .tabs { display: flex; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; cursor: pointer; border-bottom: 2px solid transparent; color: #64748b; }
        .tab.active { border-color: var(--primary); color: white; }

        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .sniper-box { background: rgba(225, 29, 72, 0.1); border: 1px solid var(--danger); border-radius: 10px; padding: 15px; margin-top: 15px; }
        
        .rules-list li { margin-bottom: 10px; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="loadingScreen" class="loading-screen">
        <div class="spinner"></div>
        <h2 style="color: var(--primary);">Goal Sniper</h2>
        <p style="margin-top: 10px; color: #94a3b8;">جاري الاتصال بالسيرفر...</p>
    </div>

    <div id="authApp" style="display: none;" class="auth-container fade-in">
        <div class="auth-box">
            <h1 style="color: var(--primary); margin-bottom: 20px;">Goal Sniper</h1>
            <div class="tabs">
                <div class="tab active" onclick="switchAuthTab('login')" id="tabLogin">تسجيل الدخول</div>
                <div class="tab" onclick="switchAuthTab('register')" id="tabRegister">حساب جديد</div>
            </div>
            
            <div id="loginForm">
                <input type="text" id="loginUsername" class="input-field" placeholder="اسم المستخدم">
                <input type="password" id="loginPin" class="input-field" placeholder="كلمة المرور">
                <button class="btn" style="width: 100%; justify-content: center; margin-top: 10px;" onclick="handleAuth('login')">دخول</button>
            </div>

            <div id="registerForm" style="display: none;">
                <input type="text" id="regUsername" class="input-field" placeholder="اسم المستخدم">
                <input type="password" id="regPin" class="input-field" placeholder="كلمة المرور">
                <input type="password" id="regPinConfirm" class="input-field" placeholder="تأكيد كلمة المرور">
                <button class="btn" style="width: 100%; justify-content: center; margin-top: 10px;" onclick="handleAuth('register')">إنشاء حساب</button>
            </div>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <div class="header">
            <div class="app-title-container">
                <!-- يمكنك استبدال الرابط أدناه بمسار صورتك المحلية، مثلاً: src="./logo.png" -->
                <img src="https://placehold.co/150x150/060b19/0ea5e9?text=GS" alt="Logo" class="app-logo" id="appLogo">
                <span class="app-title">Goal Sniper</span>
            </div>
            <i class="fas fa-sign-out-alt" style="color: var(--danger); cursor: pointer; font-size: 20px;" onclick="logout()"></i>
        </div>

        <div id="content" class="container"></div>

        <div class="nav-bar">
            <a class="nav-item active" onclick="showHome()"><i class="fas fa-home"></i>الرئيسية</a>
            <a class="nav-item" onclick="showMatches()"><i class="fas fa-futbol"></i>المباريات</a>
            <a class="nav-item" onclick="showGlobalStandings()"><i class="fas fa-trophy"></i>الترتيب العام</a>
            <a class="nav-item" onclick="showMiniLeagues()"><i class="fas fa-users"></i>الدوريات</a>
            <a class="nav-item" onclick="showRules()"><i class="fas fa-book"></i>القوانين</a>
            <a class="nav-item" id="navAdmin" style="display:none;" onclick="showAdmin()"><i class="fas fa-cog"></i>الإدارة</a>
        </div>
    </div>

<script>
// ================= المتغيرات والإعدادات =================
const API_URL = 'http://154.53.59.88:5000'; // رابط سيرفرك
let currentUser = null;
let matches = [];
let predictions = {};
let users = [];
let miniLeagues = [];
let sniperShots = []; // تخزين الرصاصات المطلقة

const BIG_TEAMS = ['ARS', 'MCI', 'LIV', 'MUN', 'CHE', 'TOT'];
const TEAM_NAMES = {
    'ARS': 'آرسنال', 'MCI': 'مان سيتي', 'LIV': 'ليفربول', 'MUN': 'مان يونايتد', 
    'CHE': 'تشيلسي', 'TOT': 'توتنهام', 'NEW': 'نيوكاسل', 'AVL': 'أستون فيلا',
    'BHA': 'برايتون', 'WHU': 'وست هام', 'CRY': 'كريستال بالاس', 'BOU': 'بورنموث',
    'FUL': 'فولهام', 'WOL': 'ولفرهامبتون', 'EVE': 'إيفرتون', 'BRE': 'برينتفورد',
    'NFO': 'نوتنغهام', 'LEE': 'ليدز يونايتد', 'IPS': 'إيبسويتش تاون', 'SUN': 'سندرلاند',
    'COV': 'كوفنتري سيتي', 'HUL': 'هال سيتي'
};

// ================= دوال مساعدة =================
function getTeamName(code) { return TEAM_NAMES[code] || code; }

function getTeamLogo(code) {
    const cleanCode = code.toLowerCase();
    return `https://resources.premierleague.com/premierleague/badges/50/t${getApiTeamId(cleanCode)}.png`;
}

function getApiTeamId(code) {
    const map = {
        'ars': '3', 'mci': '43', 'liv': '14', 'mun': '1', 'che': '8', 'tot': '6',
        'new': '4', 'avl': '7', 'bha': '36', 'whu': '21', 'cry': '31', 'bou': '91',
        'ful': '54', 'wol': '39', 'eve': '11', 'bre': '94', 'nfo': '17', 'lee': '2',
        'ips': '80', 'sun': '56', 'cov': '110', 'hul': '12'
    };
    return map[code] || '1';
}

function convertDateToNumber(dateStr) {
    if (!dateStr) return '';
    const months = {'يناير':1, 'فبراير':2, 'مارس':3, 'أبريل':4, 'مايو':5, 'يونيو':6, 'يوليو':7, 'أغسطس':8, 'سبتمبر':9, 'أكتوبر':10, 'نوفمبر':11, 'ديسمبر':12};
    let d = dateStr;
    for (let m in months) { d = d.replace(m, months[m]); }
    return d;
}

// ================= الاتصال بالسيرفر والتزامن =================
async function syncData() {
    try {
        const res = await fetch(`${API_URL}/api/sync`);
        const result = await res.json();
        if (result.success) {
            users = result.data.users || [];
            matches = result.data.matches || [];
            predictions = result.data.predictions || {};
            miniLeagues = result.data.miniLeagues || [];
            sniperShots = result.data.sniperShots || [];
            
            // تحويل التواريخ للأرقام وترتيبها زمنياً
            matches = matches.map(m => {
                m.match_date = convertDateToNumber(m.match_date);
                return m;
            }).sort((a, b) => {
                const dateA = new Date(a.match_date + ' ' + (a.match_time || '00:00')).getTime();
                const dateB = new Date(b.match_date + ' ' + (b.match_time || '00:00')).getTime();
                return dateA - dateB;
            });
        }
    } catch (e) {
        console.error("Sync error:", e);
    }
}

// ================= التوثيق (تسجيل الدخول / إنشاء حساب) =================
function switchAuthTab(tab) {
    document.getElementById('tabLogin').classList.remove('active');
    document.getElementById('tabRegister').classList.remove('active');
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'none';

    if (tab === 'login') {
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('loginForm').style.display = 'block';
    } else {
        document.getElementById('tabRegister').classList.add('active');
        document.getElementById('registerForm').style.display = 'block';
    }
}

async function handleAuth(type) {
    let username, pin;
    if (type === 'login') {
        username = document.getElementById('loginUsername').value.trim();
        pin = document.getElementById('loginPin').value.trim();
    } else {
        username = document.getElementById('regUsername').value.trim();
        pin = document.getElementById('regPin').value.trim();
        const pinConfirm = document.getElementById('regPinConfirm').value.trim();
        if (pin !== pinConfirm) return alert('كلمتا المرور غير متطابقتين!');
    }

    if (!username || !pin) return alert('الرجاء إدخال جميع البيانات');

    document.getElementById('loadingScreen').style.display = 'flex';
    try {
        const res = await fetch(`${API_URL}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, pin })
        });
        const data = await res.json();
        
        if (data.success) {
            currentUser = data.user;
            localStorage.setItem('goalSniperUser', JSON.stringify(currentUser));
            await syncData();
            document.getElementById('authApp').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            if (currentUser.role === 'admin') document.getElementById('navAdmin').style.display = 'flex';
            showHome();
        } else {
            alert(data.message);
        }
    } catch (e) {
        alert('خطأ في الاتصال بالسيرفر');
    }
    document.getElementById('loadingScreen').style.display = 'none';
}

function logout() {
    localStorage.removeItem('goalSniperUser');
    location.reload();
}

// ================= الحسابات ونقاط القناص =================
function calcPoints(home, away, predH, predA, actH, actA, isCap, isTC) {
    if (actH === null || actA === null || predH === '' || predA === '') return 0;
    predH = Number(predH); predA = Number(predA); actH = Number(actH); actA = Number(actA);
    let pts = 0;
    const isOutcomeCorrect = (predH > predA && actH > actA) || (predH < predA && actH < actA) || (predH === predA && actH === actA);
    const isExact = (predH === actH && predA === actA);
    
    if (isExact) pts = 3;
    else if (isOutcomeCorrect) pts = 1;

    let multiplier = 1;
    if (isTC) multiplier = 3;
    else if (isCap) multiplier = 2;

    return pts * multiplier;
}

function getCurrentActiveGw() {
    let activeGw = 1;
    for (let i = 1; i <= 38; i++) {
        const gwMatches = matches.filter(m => m.gw === i);
        if (gwMatches.length > 0) {
            const allPlayed = gwMatches.every(m => m.actual_h !== null && m.actual_a !== null);
            if (!allPlayed) {
                activeGw = i;
                break;
            }
        }
    }
    return activeGw;
}

function checkGwStarted(gw) {
    const gwMatches = matches.filter(m => m.gw === gw);
    if (gwMatches.length === 0) return false;
    const firstMatchDate = new Date(gwMatches[0].match_date + ' ' + (gwMatches[0].match_time || '00:00')).getTime();
    return new Date().getTime() >= firstMatchDate;
}

function getGlobalStandings() {
    const allUsernames = new Set();
    Object.keys(predictions).forEach(u => allUsernames.add(u));
    users.forEach(u => allUsernames.add(u.username));

    const statsMap = {};
    allUsernames.forEach(username => { 
        statsMap[username] = { 
            username: username, totalPts: 0, predictedCount: 0, correctOutcomes: 0, playedMatches: 0,
            teamPoints: {}, exactsPerGw: {}, gwPoints: {}, badges: { sniper: false, giantSlayer: false, motw: false }
        }; 
    });

    matches.forEach(m => {
        const isPlayed = m.actual_h !== null && m.actual_a !== null;
        allUsernames.forEach(username => {
            const p = (predictions[username] || {})[m.id];
            const userStats = statsMap[username];
            if (userStats && p && p.home !== '' && p.away !== '' && p.home !== null && p.away !== null) {
                userStats.predictedCount++;
                if (isPlayed) {
                    userStats.playedMatches++;
                    const pts = calcPoints(m.home, m.away, p.home, p.away, m.actual_h, m.actual_a, p.isCaptain, p.isTripleCaptain);
                    userStats.totalPts += pts;
                    
                    const isOutcomeCorrect = (p.home > p.away && m.actual_h > m.actual_a) || (p.home < p.away && m.actual_h < m.actual_a) || (p.home === p.away && m.actual_h === m.actual_a);
                    if (isOutcomeCorrect) userStats.correctOutcomes++;

                    userStats.teamPoints[m.home] = (userStats.teamPoints[m.home] || 0) + pts;
                    userStats.teamPoints[m.away] = (userStats.teamPoints[m.away] || 0) + pts;
                    userStats.gwPoints[m.gw] = (userStats.gwPoints[m.gw] || 0) + pts;
                    
                    if (Number(p.home) === m.actual_h && Number(p.away) === m.actual_a) {
                        userStats.exactsPerGw[m.gw] = (userStats.exactsPerGw[m.gw] || 0) + 1;
                        if (userStats.exactsPerGw[m.gw] >= 3) userStats.badges.sniper = true;
                    }

                    const homeIsBig = BIG_TEAMS.includes(m.home), awayIsBig = BIG_TEAMS.includes(m.away);
                    const bigLost = (homeIsBig && m.actual_h < m.actual_a) || (awayIsBig && m.actual_a < m.actual_h);
                    if (bigLost && isOutcomeCorrect) userStats.badges.giantSlayer = true;
                }
            }
        });
    });

    const activeGw = getCurrentActiveGw();
    const prevGw = activeGw > 1 ? activeGw - 1 : 1;
    let highestGwPts = -1, motwUser = null;
    
    Object.values(statsMap).forEach(userStats => {
        const pts = userStats.gwPoints[prevGw] || 0;
        if (pts > highestGwPts && pts > 0) { highestGwPts = pts; motwUser = userStats.username; }
    });
    if (motwUser) statsMap[motwUser].badges.motw = true;

    Object.values(statsMap).forEach(userStats => {
        userStats.hitRate = userStats.playedMatches > 0 ? Math.round((userStats.correctOutcomes / userStats.playedMatches) * 100) : 0;
        let bestTeam = '-', maxTeamPts = -1;
        for (const [team, pts] of Object.entries(userStats.teamPoints)) {
            if (pts > maxTeamPts) { maxTeamPts = pts; bestTeam = getTeamName(team); }
        }
        userStats.favTeam = maxTeamPts > 0 ? bestTeam : '-';
    });

    return Object.values(statsMap).sort((a, b) => b.totalPts - a.totalPts);
}

// ================= حفظ التوقع =================
async function savePrediction(matchId, predH, predA, isCap, isTC) {
    if (predH === '' || predA === '') return;
    try {
        await fetch(`${API_URL}/api/predict`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: currentUser.username, matchId, predH, predA, isCaptain: isCap, isTripleCaptain: isTC })
        });
        if (!predictions[currentUser.username]) predictions[currentUser.username] = {};
        predictions[currentUser.username][matchId] = { home: predH, away: predA, isCaptain: isCap, isTripleCaptain: isTC };
    } catch (e) { console.error(e); }
}

function togglePowerUp(matchId, type) {
    const p = (predictions[currentUser.username] || {})[matchId] || { home: '', away: '' };
    if (p.home === '' || p.away === '') return alert('يرجى إدخال التوقع أولاً');
    
    let isCap = p.isCaptain || false;
    let isTC = p.isTripleCaptain || false;

    if (type === 'cap') { isCap = !isCap; if (isCap) isTC = false; }
    if (type === 'tc') {
        let tcUsed = 0;
        Object.values(predictions[currentUser.username]).forEach(pred => { if (pred.isTripleCaptain) tcUsed++; });
        if (!isTC && tcUsed >= 2) return alert('لقد استنفدت بطاقتي الكابتن الثلاثي لهذا الموسم!');
        isTC = !isTC; if (isTC) isCap = false;
    }

    savePrediction(matchId, p.home, p.away, isCap, isTC);
    renderMatchesList();
}

// ================= عرض المباريات =================
function renderMatchCard(m, p) {
    const isPlayed = m.actual_h !== null && m.actual_a !== null;
    const isStarted = new Date().getTime() >= new Date(m.match_date + ' ' + (m.match_time || '00:00')).getTime();
    const disabled = isPlayed || isStarted ? 'disabled' : '';
    
    let html = `
    <div class="card match-card fade-in">
        <div class="match-date-time">${m.match_date || ''} - ${m.match_time || ''}</div>
        <div class="match-teams">
            <div class="team">
                <img src="${getTeamLogo(m.home)}" alt="${m.home}">
                <div>${getTeamName(m.home)}</div>
            </div>
            <div class="vs">${isPlayed ? `${m.actual_h} - ${m.actual_a}` : 'VS'}</div>
            <div class="team">
                <img src="${getTeamLogo(m.away)}" alt="${m.away}">
                <div>${getTeamName(m.away)}</div>
            </div>
        </div>
        <div class="prediction-inputs">
            <input type="number" class="pred-input" id="h_${m.id}" value="${p.home !== undefined ? p.home : ''}" min="0" ${disabled} 
                   onchange="savePrediction('${m.id}', this.value, document.getElementById('a_${m.id}').value, ${p.isCaptain||false}, ${p.isTripleCaptain||false})">
            <input type="number" class="pred-input" id="a_${m.id}" value="${p.away !== undefined ? p.away : ''}" min="0" ${disabled}
                   onchange="savePrediction('${m.id}', document.getElementById('h_${m.id}').value, this.value, ${p.isCaptain||false}, ${p.isTripleCaptain||false})">
        </div>
    `;

    if (!isPlayed && !isStarted && p.home !== undefined && p.home !== '') {
        html += `<div class="power-ups">
            <button class="btn btn-outline ${p.isCaptain ? 'active' : ''}" onclick="togglePowerUp('${m.id}', 'cap')">© كابتن (x2)</button>
            <button class="btn btn-outline btn-triple ${p.isTripleCaptain ? 'active' : ''}" onclick="togglePowerUp('${m.id}', 'tc')">Ⓣ كابتن ثلاثي (x3)</button>
        </div>`;
    }

    if (isPlayed && p.home !== undefined && p.home !== '') {
        const pts = calcPoints(m.home, m.away, p.home, p.away, m.actual_h, m.actual_a, p.isCaptain, p.isTripleCaptain);
        html += `<div style="text-align:center; color: var(--gold); font-weight:bold; margin-top:10px;">النقاط: +${pts}</div>`;
    }
    
    html += `</div>`;
    return html;
}

// ================= الدوريات المصغرة وميزة القناص =================
async function fireSniper(leagueCode, gw, points) {
    const victim = document.getElementById(`sniperTarget_${leagueCode}`).value;
    if (!victim) return alert('الرجاء اختيار الضحية!');
    
    try {
        const res = await fetch(`${API_URL}/api/sniper/shoot`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ leagueCode, gw, sniper: currentUser.username, victim, pointsDeducted: points })
        });
        const data = await res.json();
        if (data.success) {
            alert('تم قنص الهدف بنجاح! 🎯');
            await syncData();
            showLeagueDetails(leagueCode);
        } else {
            alert(data.message);
        }
    } catch (e) {
        alert('حدث خطأ في الاتصال');
    }
}

function showLeagueDetails(code) {
    const league = miniLeagues.find(l => l.code === code);
    if (!league) return;

    const allStats = getGlobalStandings();
    const activeGw = getCurrentActiveGw();
    const prevGw = activeGw > 1 ? activeGw - 1 : 1;
    const isStarted = checkGwStarted(activeGw);
    const evalGw = isStarted ? prevGw : (activeGw > 1 ? activeGw - 2 : 0);

    let membersStats = league.members.map(username => {
        const gStat = allStats.find(s => s.username === username) || { totalPts: 0, gwPoints: {} };
        const originalTotal = gStat.totalPts || 0;
        const prevPts = gStat.gwPoints[evalGw] || 0;
        
        // حساب خصومات هذا الدوري فقط
        const deductions = sniperShots.filter(s => s.league_code === code && s.victim === username).reduce((sum, s) => sum + s.points_deducted, 0);
        const leagueTotal = originalTotal - deductions;

        return { username, prevPts, leagueTotal };
    });

    membersStats.sort((a, b) => b.leagueTotal - a.leagueTotal);

    let html = `
        <div class="card fade-in">
            <button onclick="showMiniLeagues()" class="btn" style="margin-bottom: 15px;">🔙 العودة</button>
            <h2>دوري: ${league.name}</h2>
            <p>كود الانضمام: <strong>${league.code}</strong></p>
            <table class="standings-table">
                <thead><tr><th>#</th><th>الاسم</th><th>نقاط الجولة</th><th>النقاط الكلية</th></tr></thead>
                <tbody>
    `;

    membersStats.forEach((m, index) => {
        html += `<tr>
            <td>${index + 1}</td>
            <td>${m.username} ${m.username === currentUser.username ? '(أنت)' : ''}</td>
            <td>${m.prevPts}</td>
            <td style="font-weight:bold; color:var(--primary);">${m.leagueTotal}</td>
        </tr>`;
    });
    html += `</tbody></table></div>`;

    // نظام القناص 🎯
    if (evalGw > 0) {
        const highestPts = Math.max(...membersStats.map(m => m.prevPts));
        const topScorers = membersStats.filter(m => m.prevPts === highestPts && highestPts > 0);
        const isCurrentUserTop = topScorers.some(m => m.username === currentUser.username);
        const deductionPoints = topScorers.length > 1 ? 2 : 4;
        
        const immuneUsers = sniperShots.filter(s => s.league_code === code && s.gw === evalGw - 1).map(s => s.victim);
        const hasShot = sniperShots.some(s => s.league_code === code && s.gw === evalGw && s.sniper === currentUser.username);

        if (topScorers.length > 0) {
            html += `<div class="card sniper-box fade-in">
                <h3 style="color: var(--danger); margin-bottom:10px;">🎯 رصاصة القناص (الجولة ${evalGw})</h3>`;
            
            if (isCurrentUserTop) {
                if (hasShot) {
                    html += `<p style="color: var(--success); font-weight:bold;">لقد قمت بإطلاق رصاصتك بنجاح في هذه الجولة! 🔫</p>`;
                } else {
                    html += `<p>أنت متصدر الجولة السابقة! يحق لك خصم <strong>${deductionPoints} نقاط</strong> من أي منافس.</p>
                             <select id="sniperTarget_${code}" class="input-field">
                                <option value="">-- اختر الضحية --</option>`;
                    membersStats.forEach(m => {
                        if (m.username !== currentUser.username) {
                            const isImmune = immuneUsers.includes(m.username);
                            html += `<option value="${m.username}" ${isImmune ? 'disabled' : ''}>${m.username} ${isImmune ? '(محمي 🛡️)' : ''}</option>`;
                        }
                    });
                    html += `</select><button class="btn" style="background: var(--danger); margin-top:10px;" onclick="fireSniper('${code}', ${evalGw}, ${deductionPoints})">إطلاق الرصاصة 🔥</button>`;
                }
            } else {
                const topNames = topScorers.map(t => t.username).join(' و ');
                html += `<p>المتصدر والقناص الحالي هو: <strong>${topNames}</strong></p>
                         <p style="color:#94a3b8; font-size:12px; margin-top:5px;">احذر! رصاصة القناص قادمة... 👀</p>`;
            }
            html += `</div>`;
        }
    }
    document.getElementById('content').innerHTML = html;
}

    setActiveNav(3);
    const myLeagues = miniLeagues.filter(l => l.members.includes(currentUser.username));
    
    let html = `<h2 style="margin-bottom:15px;">الدوريات الخاصة</h2>
        <div class="card fade-in">
            <h3>إنشاء دوري جديد</h3>
            <input type="text" id="newLeagueName" class="input-field" placeholder="اسم الدوري">

        </div>

async function createLeague() {
    const name = document.getElementById('newLeagueName').value;
    const code = document.getElementById('newLeagueCode').value;
    if (!name || !code) return alert('أدخل البيانات المطلوبة');
    try {
        const res = await fetch(`${API_URL}/api/leagues`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: 'L'+Date.now(), name, code, creator: currentUser.username })
        });
        const data = await res.json();
        if (data.success) { await syncData(); showMiniLeagues(); }
        else alert(data.message);
    } catch(e) { alert('خطأ في السيرفر'); }
}

async function joinLeague() {
    const code = document.getElementById('joinLeagueCode').value;
    if (!code) return alert('أدخل الكود');
    try {
        const res = await fetch(`${API_URL}/api/leagues/join`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, username: currentUser.username })
        });
        const data = await res.json();
        if (data.success) { await syncData(); showMiniLeagues(); }
        else alert(data.message);
    } catch(e) { alert('خطأ في السيرفر'); }
}

async function saveAdminResult() {
    const matchId = document.getElementById('adminMatchSelect').value;
    const actualH = document.getElementById('adminActH').value;
    const actualA = document.getElementById('adminActA').value;
    
    if (!matchId || actualH === '' || actualA === '') return alert('أدخل البيانات كاملة');
    try {
        await fetch(`${API_URL}/api/admin/result`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ matchId, actualH: Number(actualH), actualA: Number(actualA) })
        });
        alert('تم حفظ النتيجة');
        await syncData();
    } catch(e) { alert('خطأ في السيرفر'); }
}

function setActiveNav(index) {
    document.querySelectorAll('.nav-item').forEach((el, i) => {
        if (i === index) el.classList.add('active');
        else el.classList.remove('active');
    });
}

    const saved = localStorage.getItem('goalSniperUser');
    if (saved) {
        currentUser = JSON.parse(saved);
        await syncData();
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        if (currentUser.role === 'admin') document.getElementById('navAdmin').style.display = 'flex';
        showHome();
    } else {
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('authApp').style.display = 'flex';
    }
};
